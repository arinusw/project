<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="eduGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>
    <linearGradient id="eduGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B61FF"/>
      <stop offset="100%" stop-color="#FF6B6B"/>
    </linearGradient>
  </defs>

  <!-- Background Screen / Monitor Container -->
  <rect x="70" y="80" width="360" height="260" rx="20" fill="#1A1B29" stroke="url(#eduGrad1)" stroke-width="2"/>
  <rect x="210" y="340" width="80" height="50" fill="#25273C"/>
  <path d="M 170 390 L 330 390 L 310 405 L 190 405 Z" fill="#25273C"/>

  <!-- Screen Content: Code & Learning Platform -->
  <rect x="90" y="105" width="320" height="210" rx="10" fill="#12131C"/>

  <!-- Graduation Cap Icon in Center -->
  <g transform="translate(190, 130)">
    <polygon points="60,10 110,35 60,60 10,35" fill="url(#eduGrad1)"/>
    <polygon points="30,50 30,75 60,90 90,75 90,50 60,65" fill="url(#eduGrad2)"/>
    <circle cx="105" cy="40" r="4" fill="#FF8E53"/>
    <line x1="105" y1="40" x2="105" y2="70" stroke="#FF8E53" stroke-width="2"/>
  </g>

  <!-- Code/Text Lines underneath -->
  <rect x="130" y="240" width="240" height="8" rx="4" fill="url(#eduGrad1)" opacity="0.8"/>
  <rect x="160" y="258" width="180" height="8" rx="4" fill="#6C7293" opacity="0.5"/>
  <rect x="190" y="276" width="120" height="8" rx="4" fill="url(#eduGrad2)" opacity="0.7"/>

  <!-- Floating Digital Orbit Sparks -->
  <circle cx="100" cy="180" r="15" fill="url(#eduGrad2)" opacity="0.8"/>
  <text x="100" y="185" font-family="sans-serif" font-size="14" fill="#FFF" text-anchor="middle" font-weight="bold">&lt;/&gt;</text>

  <circle cx="400" cy="200" r="18" fill="url(#eduGrad1)" opacity="0.8"/>
  <text x="400" y="205" font-family="sans-serif" font-size="16" fill="#FFF" text-anchor="middle" font-weight="bold">AI</text>
</svg>