<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="eduGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00cec9"/>
      <stop offset="100%" stop-color="#6C5CE7"/>
    </linearGradient>
    <linearGradient id="eduGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fd79a8"/>
      <stop offset="100%" stop-color="#a29bfe"/>
    </linearGradient>
  </defs>

  <!-- Decorative background circles -->
  <circle cx="250" cy="200" r="150" fill="url(#eduGrad1)" opacity="0.1"/>
  <circle cx="120" cy="100" r="50" fill="url(#eduGrad2)" opacity="0.15"/>
  <circle cx="390" cy="300" r="60" fill="url(#eduGrad1)" opacity="0.12"/>

  <!-- Open Digital Book / Knowledge Portal Base -->
  <g transform="translate(100, 150)">
    <!-- Book Shadow -->
    <path d="M 10 170 Q 150 190 290 170 Q 150 200 10 170 Z" fill="rgba(0,0,0,0.1)"/>

    <!-- Left Page -->
    <path d="M 150 160 Q 80 140 10 150 L 10 20 Q 80 10 150 30 Z" fill="#ffffff" filter="drop-shadow(-4px 6px 12px rgba(0,0,0,0.06))"/>

    <!-- Right Page -->
    <path d="M 150 160 Q 220 140 290 150 L 290 20 Q 220 10 150 30 Z" fill="#ffffff" filter="drop-shadow(4px 6px 12px rgba(0,0,0,0.06))"/>

    <!-- Book Spine Glow -->
    <line x1="150" y1="30" x2="150" y2="160" stroke="#6C5CE7" stroke-width="4" stroke-linecap="round"/>

    <!-- Left Page Lines (Code/Text) -->
    <rect x="35" y="45" width="85" height="6" rx="3" fill="#6C5CE7" opacity="0.8"/>
    <rect x="35" y="62" width="95" height="5" rx="2.5" fill="#a29bfe" opacity="0.6"/>
    <rect x="35" y="77" width="70" height="5" rx="2.5" fill="#a29bfe" opacity="0.6"/>
    <rect x="35" y="92" width="90" height="5" rx="2.5" fill="#00cec9" opacity="0.7"/>
    <rect x="35" y="107" width="60" height="5" rx="2.5" fill="#a29bfe" opacity="0.6"/>

    <!-- Right Page Elements (Graphics/Media) -->
    <rect x="170" y="45" width="95" height="50" rx="6" fill="#2d3436" opacity="0.05"/>
    <circle cx="217" cy="70" r="14" fill="url(#eduGrad2)" opacity="0.8"/>
    <path d="M 213 64 L 224 70 L 213 76 Z" fill="#ffffff"/>
    <rect x="170" y="105" width="90" height="5" rx="2.5" fill="#6C5CE7" opacity="0.6"/>
    <rect x="170" y="120" width="75" height="5" rx="2.5" fill="#00cec9" opacity="0.6"/>
  </g>

  <!-- Floating Digital Knowledge Symbols -->
  <!-- Atom / Tech Symbol -->
  <g transform="translate(250, 90)">
    <ellipse cx="0" cy="0" rx="35" ry="12" fill="none" stroke="#6C5CE7" stroke-width="2.5" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="35" ry="12" fill="none" stroke="#00cec9" stroke-width="2.5" transform="rotate(-30)"/>
    <circle cx="0" cy="0" r="7" fill="#fd79a8"/>
  </g>

  <!-- Binary / Digital floating tags -->
  <g transform="translate(70, 70)">
    <rect x="0" y="0" width="65" height="32" rx="10" fill="#2f3640"/>
    <text x="32.5" y="21" fill="#00cec9" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <g transform="translate(360, 100)">
    <rect x="0" y="0" width="65" height="32" rx="10" fill="#2f3640"/>
    <text x="32.5" y="21" fill="#fd79a8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">AI &amp; Tech</text>
  </g>

  <!-- Sparkles -->
  <path d="M 320 60 L 324 70 L 334 74 L 324 78 L 320 88 L 316 78 L 306 74 L 316 70 Z" fill="#fd79a8"/>
  <path d="M 130 290 L 133 297 L 140 300 L 133 303 L 130 310 L 127 303 L 120 300 L 127 297 Z" fill="#00cec9"/>
</svg>