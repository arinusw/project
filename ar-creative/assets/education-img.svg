<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="eduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e57e0"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadowEdu" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3b82f6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect x="50" y="50" width="400" height="300" rx="20" fill="#f8fafc"/>

  <!-- Open Book / Digital Portal Illustration -->
  <g filter="url(#shadowEdu)" transform="translate(100, 110)">
    <rect width="300" height="180" rx="16" fill="#ffffff"/>

    <!-- Left Page / Screen -->
    <rect x="20" y="20" width="120" height="140" rx="8" fill="#eff6ff"/>
    <circle cx="80" cy="60" r="24" fill="url(#eduGrad)"/>
    <path d="M 70 60 L 90 60 M 80 50 L 80 70" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <rect x="35" y="100" width="90" height="6" rx="3" fill="#93c5fd"/>
    <rect x="35" y="114" width="60" height="6" rx="3" fill="#bfdbfe"/>

    <!-- Right Page / Tech Nodes -->
    <rect x="160" y="20" width="120" height="140" rx="8" fill="#f3f0ff"/>
    <circle cx="200" cy="50" r="10" fill="#6e57e0"/>
    <circle cx="240" cy="80" r="10" fill="#a78bfa"/>
    <circle cx="200" cy="110" r="10" fill="#3b82f6"/>
    <line x1="200" y1="50" x2="240" y2="80" stroke="#c4b5fd" stroke-width="3"/>
    <line x1="240" y1="80" x2="200" y2="110" stroke="#c4b5fd" stroke-width="3"/>
  </g>

  <!-- Glowing Academic Lightbulb / Idea Element -->
  <g filter="url(#shadowEdu)" transform="translate(225, 50)">
    <circle cx="25" cy="25" r="28" fill="#ffffff"/>
    <circle cx="25" cy="25" r="22" fill="url(#eduGrad)"/>
    <path d="M 25 15 L 25 21 M 25 29 L 25 35 M 15 25 L 21 25 M 29 25 L 35 25" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>