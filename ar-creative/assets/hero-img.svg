<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6e57e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9b82f3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff7300;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#feaa00;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background decorative shapes -->
  <circle cx="250" cy="250" r="180" fill="#6e57e0" opacity="0.1" />
  <circle cx="380" cy="120" r="40" fill="url(#grad2)" opacity="0.8" />
  <rect x="60" y="340" width="60" height="60" rx="15" fill="#6e57e0" opacity="0.15" transform="rotate(15 90 370)" />

  <!-- Main Display Screen Frame -->
  <rect x="100" y="120" width="300" height="200" rx="16" fill="#1e1e24" filter="url(#glow)" />
  <rect x="108" y="128" width="284" height="184" rx="10" fill="#2d2b42" />

  <!-- IDE / Design Canvas Elements -->
  <circle cx="125" cy="142" r="4" fill="#ff5f56" />
  <circle cx="137" cy="142" r="4" fill="#ffbd2e" />
  <circle cx="149" cy="142" r="4" fill="#27c93f" />

  <!-- Content elements inside frame -->
  <rect x="125" y="160" width="100" height="12" rx="4" fill="url(#grad1)" />
  <rect x="125" y="180" width="140" height="8" rx="3" fill="#8f8ba6" opacity="0.6" />
  <rect x="125" y="195" width="110" height="8" rx="3" fill="#8f8ba6" opacity="0.4" />

  <path d="M125 220 C 160 200, 180 250, 220 220 S 260 210, 280 235" stroke="url(#grad1)" stroke-width="4" fill="none" stroke-linecap="round" />

  <rect x="280" y="160" width="95" height="110" rx="8" fill="#1e1e24" opacity="0.7" />
  <circle cx="327" cy="200" r="24" fill="url(#grad1)" />
  <polygon points="327,185 338,212 316,212" fill="#ffffff" opacity="0.9" />

  <!-- Stand / Keyboard Base -->
  <polygon points="170,320 330,320 360,345 140,345" fill="#252338" />
  <rect x="220" y="325" width="60" height="5" rx="2" fill="#8f8ba6" opacity="0.5" />

  <!-- Floating Creative Icons -->
  <g transform="translate(70, 160)">
    <circle cx="25" cy="25" r="25" fill="url(#grad1)" />
    <path d="M17 25 L23 31 L33 19" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(360, 270)">
    <rect x="0" y="0" width="50" height="50" rx="12" fill="#2d2b42" stroke="url(#grad1)" stroke-width="2" />
    <text x="25" y="32" font-family="sans-serif" font-size="20" font-weight="bold" fill="#6e57e0" text-anchor="middle">&lt;/&gt;</text>
  </g>
</svg>
