<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c5ce7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a29bfe" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#74b9ff"/>
      <stop offset="100%" stop-color="#6c5ce7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Abstract Shapes -->
  <circle cx="250" cy="200" r="160" fill="url(#heroGrad)"/>
  <circle cx="380" cy="100" r="40" fill="#74b9ff" opacity="0.4"/>
  <circle cx="100" cy="300" r="25" fill="#a29bfe" opacity="0.5"/>

  <!-- Monitor Floating Card -->
  <rect x="90" y="80" width="320" height="210" rx="16" fill="#1e1e2d" filter="url(#shadow)"/>
  <rect x="105" y="95" width="290" height="155" rx="8" fill="#14141f"/>

  <!-- Screen UI Mockup -->
  <rect x="120" y="110" width="120" height="12" rx="4" fill="url(#accentGrad)"/>
  <rect x="120" y="130" width="80" height="8" rx="3" fill="#3a3a52"/>
  <rect x="120" y="145" width="100" height="8" rx="3" fill="#2a2a3d"/>

  <rect x="260" y="110" width="120" height="75" rx="6" fill="#252538"/>
  <circle cx="320" cy="147" r="20" fill="#6c5ce7" opacity="0.6"/>
  <path d="M 305 160 L 320 135 L 335 160 Z" fill="#74b9ff"/>

  <rect x="120" y="165" width="120" height="70" rx="6" fill="#252538"/>
  <path d="M130 215 Q160 180 190 200 T230 185" fill="none" stroke="#6c5ce7" stroke-width="4" stroke-linecap="round"/>

  <!-- Monitor Stand -->
  <path d="M 220 290 L 280 290 L 290 330 L 210 330 Z" fill="#2b2b3d"/>
  <rect x="180" y="330" width="140" height="10" rx="5" fill="#3a3a52"/>

  <!-- Floating Digital Icons -->
  <g transform="translate(60, 120)" filter="url(#shadow)">
    <circle cx="25" cy="25" r="25" fill="#6c5ce7"/>
    <path d="M 17 25 L 23 31 L 33 19" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(390, 210)" filter="url(#shadow)">
    <circle cx="25" cy="25" r="25" fill="#74b9ff"/>
    <path d="M 18 25 L 32 25 M 25 18 L 25 32" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Glowing Stars/Sparkles -->
  <path d="M 400 60 L 403 67 L 410 70 L 403 73 L 400 80 L 397 73 L 390 70 L 397 67 Z" fill="#fdcb6e"/>
  <path d="M 80 240 L 82 245 L 87 247 L 82 249 L 80 254 L 78 249 L 73 247 L 78 245 Z" fill="#fdcb6e"/>
</svg>
