<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8062ec"/>
      <stop offset="100%" stop-color="#4f33bd"/>
    </linearGradient>
    <linearGradient id="heroGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6c52d9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9d85f2" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3f1fd"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#5537be" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background decorative shapes -->
  <circle cx="250" cy="250" r="200" fill="url(#heroGrad2)"/>
  <circle cx="380" cy="120" r="60" fill="#9d85f2" opacity="0.25"/>
  <circle cx="100" cy="390" r="45" fill="#8062ec" opacity="0.2"/>

  <!-- Main Floating Studio Workspace Base -->
  <rect x="70" y="110" width="360" height="260" rx="20" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="70" y="110" width="360" height="40" rx="20" fill="url(#heroGrad1)"/>
  <circle cx="100" cy="130" r="6" fill="#ff6b6b"/>
  <circle cx="120" cy="130" r="6" fill="#feca57"/>
  <circle cx="140" cy="130" r="6" fill="#1dd1a1"/>

  <!-- Code / Design UI Elements -->
  <rect x="100" y="180" width="140" height="80" rx="10" fill="url(#heroGrad2)"/>
  <path d="M125 210 L140 220 L125 230" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="150" y1="225" x2="180" y2="225" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Graphic Design Canvas -->
  <rect x="260" y="180" width="140" height="150" rx="10" fill="#f8f7ff" stroke="#e0dafc" stroke-width="2"/>
  <polygon points="330,200 370,270 290,270" fill="url(#heroGrad1)" opacity="0.8"/>
  <circle cx="305" cy="215" r="14" fill="#feca57"/>

  <!-- Floating Creative Objects -->
  <g transform="translate(90, 280)">
    <rect x="0" y="0" width="150" height="50" rx="12" fill="url(#heroGrad1)"/>
    <text x="20" y="30" font-family="'Poppins', sans-serif" font-size="14" font-weight="600" fill="#ffffff">Ar Creative</text>
    <circle cx="125" cy="25" r="8" fill="#ffffff" opacity="0.4"/>
  </g>

  <!-- Sparkles / Floating Dots -->
  <path d="M410 80 L415 95 L430 100 L415 105 L410 120 L405 105 L390 100 L405 95 Z" fill="#feca57"/>
  <path d="M80 80 L83 90 L93 93 L83 96 L80 106 L77 96 L67 93 L77 90 Z" fill="#8062ec"/>
  <circle cx="430" cy="280" r="8" fill="#8062ec"/>
  <circle cx="60" cy="260" r="6" fill="#5537be"/>
</svg>