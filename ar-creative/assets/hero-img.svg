<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8062ec"/>
      <stop offset="100%" stop-color="#5533ea"/>
    </linearGradient>
    <linearGradient id="heroGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#5533ea" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background decorative elements -->
  <circle cx="250" cy="250" r="200" fill="url(#heroGrad1)" opacity="0.08"/>
  <circle cx="250" cy="250" r="150" fill="none" stroke="url(#heroGrad1)" stroke-width="2" stroke-dasharray="8,8" opacity="0.3"/>

  <!-- Main Workstation Canvas Card -->
  <g filter="url(#shadow)">
    <rect x="70" y="90" width="360" height="260" rx="16" fill="#ffffff"/>
    <rect x="70" y="90" width="360" height="35" rx="16" fill="#f3f0ff"/>
    <!-- Window controls -->
    <circle cx="95" cy="107" r="5" fill="#ff5f56"/>
    <circle cx="112" cy="107" r="5" fill="#ffbd2e"/>
    <circle cx="129" cy="107" r="5" fill="#27c93f"/>
    <!-- Code / Design Lines -->
    <rect x="155" y="103" width="120" height="8" rx="4" fill="#a493f0"/>

    <!-- Left Sidebar -->
    <rect x="85" y="140" width="60" height="195" rx="8" fill="#f8f7fe"/>
    <circle cx="115" cy="165" r="15" fill="url(#heroGrad1)"/>
    <rect x="95" y="195" width="40" height="6" rx="3" fill="#d0c7f7"/>
    <rect x="95" y="210" width="40" height="6" rx="3" fill="#e8e4fb"/>
    <rect x="95" y="225" width="40" height="6" rx="3" fill="#e8e4fb"/>

    <!-- Canvas Workspace -->
    <rect x="160" y="140" width="255" height="195" rx="8" fill="#faf9fe"/>

    <!-- UI Layout Graphics -->
    <rect x="175" y="155" width="130" height="70" rx="8" fill="url(#heroGrad1)" opacity="0.85"/>
    <circle cx="200" cy="190" r="18" fill="#ffffff" opacity="0.8"/>
    <rect x="230" y="175" width="60" height="8" rx="4" fill="#ffffff"/>
    <rect x="230" y="190" width="45" height="6" rx="3" fill="#ffffff" opacity="0.7"/>

    <rect x="320" y="155" width="80" height="70" rx="8" fill="#6c5ce7" opacity="0.15"/>
    <circle cx="360" cy="190" r="16" fill="#6c5ce7"/>

    <!-- Code Block representation -->
    <rect x="175" y="240" width="225" height="80" rx="8" fill="#1e1e2e"/>
    <rect x="190" y="255" width="80" height="6" rx="3" fill="#f38ba8"/>
    <rect x="280" y="255" width="50" height="6" rx="3" fill="#89b4fa"/>
    <rect x="190" y="270" width="120" height="6" rx="3" fill="#a6e3a1"/>
    <rect x="190" y="285" width="90" height="6" rx="3" fill="#f9e2af"/>
  </g>

  <!-- Floating Digital Art Elements -->
  <!-- Floating Palette Card -->
  <g filter="url(#shadow)">
    <rect x="40" y="260" width="110" height="120" rx="14" fill="#ffffff"/>
    <circle cx="70" cy="295" r="12" fill="#8062ec"/>
    <circle cx="95" cy="295" r="12" fill="#00f2fe"/>
    <circle cx="70" cy="325" r="12" fill="#ff7675"/>
    <circle cx="95" cy="325" r="12" fill="#fdcb6e"/>
    <rect x="55" y="355" width="60" height="6" rx="3" fill="#d0c7f7"/>
  </g>

  <!-- Floating Rocket/Creative badge -->
  <g filter="url(#shadow)">
    <rect x="340" y="300" width="120" height="110" rx="14" fill="#ffffff"/>
    <rect x="355" y="315" width="90" height="50" rx="8" fill="url(#heroGrad2)"/>
    <!-- Pencil / Creative Icon inside badge -->
    <path d="M395 330 L405 340 L385 355 L375 355 L375 345 Z" fill="#ffffff"/>
    <rect x="365" y="380" width="70" height="6" rx="3" fill="#e0e0e0"/>
    <rect x="375" y="392" width="50" height="6" rx="3" fill="#b0c4de"/>
  </g>

  <!-- Sparkles and Dots -->
  <path d="M120 70 L125 55 L130 70 L145 75 L130 80 L125 95 L120 80 L105 75 Z" fill="#00f2fe"/>
  <path d="M420 70 L423 60 L426 70 L436 73 L426 76 L423 86 L420 76 L410 73 Z" fill="#8062ec"/>
  <circle cx="60" cy="180" r="6" fill="#8062ec" opacity="0.6"/>
  <circle cx="440" cy="220" r="8" fill="#00f2fe" opacity="0.6"/>
</svg>
