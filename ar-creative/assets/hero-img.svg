<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B61FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00F0FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF5252;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B61FF;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background decorative elements -->
  <circle cx="250" cy="250" r="210" fill="none" stroke="url(#grad1)" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />
  <circle cx="250" cy="250" r="170" fill="url(#grad1)" opacity="0.08" />

  <!-- Abstract Geometric Digital Art Shapes -->
  <g transform="translate(100, 100)">
    <!-- Code / Canvas Frame -->
    <rect x="20" y="20" width="260" height="200" rx="16" fill="#1E1E2E" opacity="0.9" />
    <rect x="20" y="20" width="260" height="35" rx="16" fill="#2D2D3F" />
    <circle cx="40" cy="37" r="5" fill="#FF5252" />
    <circle cx="55" cy="37" r="5" fill="#FFC107" />
    <circle cx="70" cy="37" r="5" fill="#4CAF50" />

    <!-- Design & Tech Elements inside frame -->
    <rect x="40" y="70" width="120" height="12" rx="4" fill="url(#grad1)" />
    <rect x="40" y="92" width="180" height="8" rx="4" fill="#45455A" />
    <rect x="40" y="108" width="140" height="8" rx="4" fill="#45455A" />

    <!-- Code & Creative Graphics -->
    <path d="M 40 135 L 70 165 L 40 195" fill="none" stroke="#00F0FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="85" y1="195" x2="135" y2="195" stroke="#7B61FF" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Overlay Creative Floating Cards -->
  <g transform="translate(240, 220)" filter="url(#glow)">
    <rect x="0" y="0" width="180" height="130" rx="16" fill="#252538" stroke="url(#grad2)" stroke-width="2" />
    <!-- Glowing Palette / Creative Icon -->
    <circle cx="50" cy="45" r="20" fill="url(#grad2)" opacity="0.8" />
    <rect x="85" y="35" width="65" height="10" rx="4" fill="#FFFFFF" opacity="0.9" />
    <rect x="85" y="52" width="45" height="8" rx="4" fill="#8F8FA8" />
    <rect x="25" y="85" width="125" height="22" rx="6" fill="url(#grad1)" />
  </g>

  <!-- Floating Digital Nodes -->
  <circle cx="90" cy="140" r="12" fill="url(#grad1)" />
  <circle cx="410" cy="120" r="8" fill="#00F0FF" />
  <circle cx="390" cy="380" r="14" fill="url(#grad2)" />
  <circle cx="110" cy="370" r="10" fill="#7B61FF" />

  <!-- Connecting Lines -->
  <path d="M 90 140 L 120 120 M 410 120 L 360 140 M 390 380 L 340 350" stroke="#7B61FF" stroke-width="2" opacity="0.5" stroke-dasharray="4 4" />
</svg>
