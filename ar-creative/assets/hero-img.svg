<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#a29bfe"/>
    </linearGradient>
    <linearGradient id="heroGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00cec9"/>
      <stop offset="100%" stop-color="#81ecec"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background decorative elements -->
  <circle cx="250" cy="200" r="160" fill="url(#heroGrad1)" opacity="0.12"/>
  <circle cx="380" cy="100" r="60" fill="url(#heroGrad2)" opacity="0.15"/>
  <circle cx="100" cy="300" r="80" fill="url(#heroGrad1)" opacity="0.1"/>

  <!-- Floating geometric creative icons -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="70" height="70" rx="18" fill="url(#heroGrad1)" opacity="0.85"/>
    <path d="M25 20 L45 35 L25 50 Z" fill="#ffffff"/>
  </g>

  <g transform="translate(360, 240)">
    <rect x="0" y="0" width="65" height="65" rx="18" fill="url(#heroGrad2)" opacity="0.85"/>
    <path d="M20 20 L45 20 L45 45 L20 45 Z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="32.5" cy="32.5" r="5" fill="#ffffff"/>
  </g>

  <!-- Central Workstation / Monitor Canvas -->
  <g transform="translate(110, 110)">
    <!-- Monitor Base & Stand -->
    <rect x="110" y="210" width="60" height="20" rx="4" fill="#a0a0b0"/>
    <path d="M125 190 L155 190 L160 210 L120 210 Z" fill="#718093"/>

    <!-- Screen Frame -->
    <rect x="10" y="10" width="260" height="180" rx="14" fill="#2f3640" filter="url(#glow)"/>
    <rect x="18" y="18" width="244" height="164" rx="8" fill="#1e272e"/>

    <!-- Screen Content: Code & Design UI -->
    <!-- Sidebar -->
    <rect x="25" y="25" width="45" height="150" rx="4" fill="#2d3436"/>
    <circle cx="47" cy="40" r="8" fill="#6C5CE7"/>
    <rect x="33" y="60" width="28" height="6" rx="3" fill="#636e72"/>
    <rect x="33" y="75" width="28" height="6" rx="3" fill="#636e72"/>
    <rect x="33" y="90" width="28" height="6" rx="3" fill="#636e72"/>

    <!-- Main Workspace -->
    <rect x="78" y="25" width="176" height="100" rx="4" fill="#222f3e"/>
    <!-- Abstract Vector Design Lines -->
    <path d="M90 100 Q130 40 170 90 T240 50" fill="none" stroke="#00cec9" stroke-width="3" stroke-linecap="round"/>
    <circle cx="130" cy="62" r="5" fill="#6C5CE7"/>
    <circle cx="170" cy="90" r="5" fill="#fd79a8"/>

    <!-- Code Editor Bottom Panel -->
    <rect x="78" y="132" width="176" height="43" rx="4" fill="#10ac84" opacity="0.15"/>
    <rect x="88" y="142" width="60" height="6" rx="3" fill="#00cec9"/>
    <rect x="154" y="142" width="40" height="6" rx="3" fill="#a29bfe"/>
    <rect x="88" y="156" width="90" height="6" rx="3" fill="#fd79a8"/>
  </g>

  <!-- Floating Sparkles & Dots -->
  <circle cx="120" cy="60" r="3" fill="#00cec9"/>
  <circle cx="420" cy="160" r="4" fill="#6C5CE7"/>
  <circle cx="80" cy="240" r="5" fill="#fd79a8"/>
  <circle cx="400" cy="340" r="3" fill="#a29bfe"/>
</svg>