<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e57e0" />
      <stop offset="100%" stop-color="#9b87f5" />
    </linearGradient>
    <linearGradient id="heroGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8f7bf7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6e57e0" stop-opacity="0.8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6e57e0" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Abstract Shapes -->
  <circle cx="250" cy="200" r="170" fill="url(#heroGrad2)" opacity="0.3"/>
  <circle cx="380" cy="100" r="40" fill="#6e57e0" opacity="0.15"/>
  <circle cx="100" cy="300" r="60" fill="#9b87f5" opacity="0.2"/>

  <!-- Floating Tech & Design Cards -->
  <!-- Card 1: Code Window -->
  <g filter="url(#shadow)" transform="translate(60, 90)">
    <rect width="200" height="140" rx="12" fill="#ffffff"/>
    <rect width="200" height="28" rx="12" fill="#f3f0ff"/>
    <circle cx="20" cy="14" r="4" fill="#ff5f56"/>
    <circle cx="34" cy="14" r="4" fill="#ffbd2e"/>
    <circle cx="48" cy="14" r="4" fill="#27c93f"/>
    <!-- Code Lines -->
    <rect x="20" y="45" width="80" height="8" rx="4" fill="#6e57e0"/>
    <rect x="110" y="45" width="50" height="8" rx="4" fill="#c4b5fd"/>
    <rect x="35" y="65" width="100" height="8" rx="4" fill="#8f7bf7"/>
    <rect x="35" y="85" width="60" height="8" rx="4" fill="#a78bfa"/>
    <rect x="20" y="105" width="40" height="8" rx="4" fill="#6e57e0"/>
  </g>

  <!-- Card 2: Creative Design Palette / Screen -->
  <g filter="url(#shadow)" transform="translate(220, 160)">
    <rect width="220" height="160" rx="12" fill="#ffffff"/>
    <rect x="15" y="15" width="190" height="90" rx="8" fill="#f8f7ff"/>
    <!-- Vector Pen Graphic -->
    <path d="M 40 70 Q 80 20 130 70 T 180 40" fill="none" stroke="url(#heroGrad1)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="40" cy="70" r="5" fill="#6e57e0"/>
    <circle cx="130" cy="70" r="5" fill="#6e57e0"/>
    <circle cx="180" cy="40" r="5" fill="#6e57e0"/>
    <!-- UI Elements -->
    <rect x="15" y="118" width="50" height="24" rx="6" fill="#6e57e0"/>
    <rect x="75" y="118" width="24" rx="6" height="24" fill="#ddd6fe"/>
    <rect x="105" y="118" width="24" rx="6" height="24" fill="#c4b5fd"/>
    <rect x="135" y="118" width="24" rx="6" height="24" fill="#a78bfa"/>
  </g>

  <!-- Decorative Orbiting Elements -->
  <g transform="translate(140, 260)">
    <rect width="60" height="60" rx="16" fill="url(#heroGrad1)" filter="url(#shadow)"/>
    <path d="M 22 30 L 38 30 M 30 22 L 30 38" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
