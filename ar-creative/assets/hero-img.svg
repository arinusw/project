<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hero-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#a29bfe"/>
    </linearGradient>
    <linearGradient id="hero-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00CEC9"/>
      <stop offset="100%" stop-color="#81ECEC"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Abstract Blob -->
  <path d="M420,300Q390,400,290,430Q190,460,110,390Q30,320,60,210Q90,100,200,70Q310,40,390,120Q470,200,420,300Z" fill="url(#hero-grad1)" opacity="0.12" />

  <!-- Outer Floating Rings -->
  <circle cx="250" cy="250" r="180" stroke="url(#hero-grad1)" stroke-width="2" fill="none" stroke-dasharray="10 15" opacity="0.4"/>
  <circle cx="250" cy="250" r="210" stroke="url(#hero-grad2)" stroke-width="1.5" fill="none" opacity="0.3"/>

  <!-- Main Device / Canvas Display -->
  <rect x="100" y="120" width="300" height="200" rx="16" fill="#1E1E2E" filter="url(#shadow)"/>
  <rect x="110" y="130" width="280" height="180" rx="10" fill="#252538"/>

  <!-- UI Header Bar -->
  <rect x="110" y="130" width="280" height="24" rx="10" fill="#2D2D44"/>
  <circle cx="125" cy="142" r="4" fill="#FF5F56"/>
  <circle cx="137" cy="142" r="4" fill="#FFBD2E"/>
  <circle cx="149" cy="142" r="4" fill="#27C93F"/>

  <!-- Creative Graphic Elements on Display -->
  <path d="M130 270 Q 180 180, 230 220 T 330 180 T 370 250 L 370 290 L 130 290 Z" fill="url(#hero-grad1)" opacity="0.7"/>
  <path d="M150 280 Q 210 200, 270 240 T 370 210 L 370 290 L 150 290 Z" fill="url(#hero-grad2)" opacity="0.6"/>
  <circle cx="310" cy="180" r="18" fill="#FF7675" opacity="0.8"/>

  <!-- Code/Design Floating Cards -->
  <!-- Card 1: Vector Tools -->
  <g filter="url(#shadow)">
    <rect x="60" y="240" width="110" height="90" rx="12" fill="#FFFFFF"/>
    <rect x="72" y="255" width="40" height="6" rx="3" fill="#6C5CE7"/>
    <rect x="72" y="267" width="60" height="4" rx="2" fill="#DFE6E9"/>
    <rect x="72" y="275" width="50" height="4" rx="2" fill="#DFE6E9"/>
    <circle cx="140" cy="295" r="14" fill="url(#hero-grad2)"/>
    <path d="M135 295 L145 295 M140 290 L140 300" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Card 2: Analytics / Growth -->
  <g filter="url(#shadow)">
    <rect x="320" y="260" width="120" height="100" rx="12" fill="#FFFFFF"/>
    <text x="332" y="280" font-family="sans-serif" font-size="10" font-weight="bold" fill="#2D3436">Ar Creative</text>
    <rect x="332" y="295" width="14" height="40" rx="4" fill="#6C5CE7"/>
    <rect x="352" y="310" width="14" height="25" rx="4" fill="#81ECEC"/>
    <rect x="372" y="285" width="14" height="50" rx="4" fill="#00CEC9"/>
    <rect x="392" y="300" width="14" height="35" rx="4" fill="#a29bfe"/>
  </g>

  <!-- Stand / Base -->
  <path d="M220 320 L280 320 L290 380 L210 380 Z" fill="#2D2D44"/>
  <rect x="180" y="380" width="140" height="10" rx="5" fill="#1E1E2E"/>

  <!-- Floating Sparkles -->
  <polygon points="120,80 123,90 133,93 123,96 120,106 117,96 107,93 117,90" fill="#FFD166"/>
  <polygon points="380,90 382,97 389,99 382,101 380,108 378,101 371,99 378,97" fill="#6C5CE7"/>
  <circle cx="80" cy="180" r="6" fill="#00CEC9"/>
  <circle cx="420" cy="200" r="8" fill="#FF7675"/>
</svg>
