<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B61FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3A1C93" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="heroGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4FACFE" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#FF8E53"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Abstract Shapes -->
  <circle cx="250" cy="250" r="180" fill="url(#heroGrad1)" opacity="0.15" />
  <circle cx="340" cy="180" r="110" fill="url(#heroGrad2)" opacity="0.2" />
  <path d="M 120 140 Q 250 80 380 150 T 420 350 Q 280 440 140 380 Z" fill="none" stroke="url(#heroGrad1)" stroke-width="2" opacity="0.3" stroke-dasharray="8 6"/>

  <!-- Main Floating Canvas Dashboard -->
  <rect x="90" y="120" width="320" height="220" rx="16" fill="#1E1E2E" opacity="0.9" stroke="url(#heroGrad1)" stroke-width="2" filter="url(#glow)"/>

  <!-- Header Bar -->
  <rect x="90" y="120" width="320" height="35" rx="16" fill="#2A2A3D"/>
  <circle cx="115" cy="137" r="5" fill="#FF5F56"/>
  <circle cx="130" cy="137" r="5" fill="#FFBD2E"/>
  <circle cx="145" cy="137" r="5" fill="#27C93F"/>

  <!-- Digital Art Code & Grid Elements -->
  <rect x="110" y="170" width="120" height="12" rx="4" fill="url(#heroGrad2)"/>
  <rect x="110" y="192" width="180" height="8" rx="3" fill="#6C7293" opacity="0.6"/>
  <rect x="110" y="208" width="140" height="8" rx="3" fill="#6C7293" opacity="0.4"/>
  <rect x="110" y="224" width="160" height="8" rx="3" fill="#6C7293" opacity="0.5"/>

  <!-- Interactive Graphic Cards inside Canvas -->
  <rect x="250" y="240" width="140" height="80" rx="10" fill="#282A36" stroke="url(#accentGrad)" stroke-width="1.5"/>
  <path d="M 265 295 L 290 265 L 315 285 L 340 255 L 375 295 Z" fill="url(#heroGrad2)" opacity="0.6"/>
  <circle cx="350" cy="265" r="8" fill="url(#accentGrad)"/>

  <!-- Floating 3D-like Geometric Badges -->
  <g transform="translate(60, 260)">
    <rect x="0" y="0" width="70" height="70" rx="14" fill="#252836" stroke="url(#heroGrad2)" stroke-width="2"/>
    <path d="M 20 45 L 35 20 L 50 45 Z" fill="none" stroke="url(#heroGrad2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(360, 90)">
    <circle cx="35" cy="35" r="35" fill="url(#accentGrad)" opacity="0.85"/>
    <path d="M 22 35 L 32 45 L 48 25" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Glowing particles -->
  <circle cx="150" cy="380" r="6" fill="#00F2FE"/>
  <circle cx="380" cy="390" r="4" fill="#7B61FF"/>
  <circle cx="280" cy="90" r="5" fill="#FF8E53"/>
</svg>