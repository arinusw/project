<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <linearGradient id="eduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7597"/>
      <stop offset="100%" stop-color="#6956e5"/>
    </linearGradient>
    <filter id="eduShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#413880" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="none"/>

  <circle cx="250" cy="225" r="160" fill="#6956e5" opacity="0.07"/>
  <circle cx="160" cy="110" r="45" fill="#ff7597" opacity="0.12"/>

  <!-- Education Desk / Digital Classroom Screen -->
  <g filter="url(#eduShadow)">
    <!-- Stand -->
    <rect x="235" y="320" width="30" height="50" rx="4" fill="#302c52"/>
    <path d="M 180 370 L 320 370 L 330 380 L 170 380 Z" fill="#201c3e"/>

    <!-- Big Monitor -->
    <rect x="110" y="80" width="280" height="240" rx="16" fill="#201c3e"/>
    <rect x="122" y="92" width="256" height="216" rx="10" fill="#ffffff" opacity="0.97"/>

    <!-- Course / Video Player Header -->
    <rect x="138" y="110" width="224" height="24" rx="6" fill="#f0edff"/>
    <circle cx="152" cy="122" r="5" fill="#6956e5"/>
    <rect x="166" y="119" width="100" height="6" rx="3" fill="#6956e5"/>

    <!-- Digital Blackboard / Presentation graphics -->
    <rect x="138" y="144" width="140" height="96" rx="8" fill="#2a2559"/>

    <!-- Code logic & diagram inside whiteboard -->
    <circle cx="170" cy="180" r="14" fill="#6956e5" opacity="0.7"/>
    <circle cx="230" cy="180" r="14" fill="#ff7597" opacity="0.7"/>
    <line x1="184" y1="180" x2="216" y2="180" stroke="#ffffff" stroke-width="2" stroke-dasharray="3,3"/>
    <rect x="150" y="212" width="100" height="6" rx="3" fill="#a498f3"/>

    <!-- Mentor / Student side panel -->
    <rect x="290" y="144" width="72" height="96" rx="8" fill="#fff6e5"/>
    <circle cx="326" cy="172" r="16" fill="#ffbd2e"/>
    <path d="M 314 200 C 314 192, 338 192, 338 200 Z" fill="#ffbd2e"/>
    <rect x="300" y="210" width="52" height="5" rx="2.5" fill="#e5e5f0"/>
    <rect x="305" y="222" width="42" height="5" rx="2.5" fill="#ff7597"/>

    <!-- Progress Tracker Bar -->
    <rect x="138" y="258" width="224" height="12" rx="6" fill="#f0edff"/>
    <rect x="138" y="258" width="160" height="12" rx="6" fill="url(#eduGrad)"/>
    <text x="145" y="295" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#6956e5">Digital Learning &amp; Creativity</text>
  </g>

  <!-- Left Floating Community Badge -->
  <g filter="url(#eduShadow)" transform="translate(60, 180)">
    <rect x="0" y="0" width="80" height="80" rx="14" fill="#ffffff" opacity="0.95"/>
    <circle cx="40" cy="32" r="14" fill="#6956e5"/>
    <circle cx="26" cy="46" r="10" fill="#a498f3"/>
    <circle cx="54" cy="46" r="10" fill="#a498f3"/>
    <rect x="15" y="64" width="50" height="5" rx="2.5" fill="#6956e5"/>
  </g>

  <!-- Right Floating Workshop Badge -->
  <g filter="url(#eduShadow)" transform="translate(365, 220)">
    <rect x="0" y="0" width="85" height="85" rx="14" fill="#ffffff" opacity="0.95"/>
    <circle cx="42.5" cy="35" r="18" fill="#ffeaf0"/>
    <path d="M 36 28 L 49 35 L 36 42 Z" fill="#ff7597"/>
    <rect x="15" y="60" width="55" height="5" rx="2.5" fill="#ff7597"/>
    <rect x="22" y="70" width="40" height="4" rx="2" fill="#e5e5f0"/>
  </g>
</svg>
