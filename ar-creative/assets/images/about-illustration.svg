<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6956e5"/>
      <stop offset="100%" stop-color="#3b337a"/>
    </linearGradient>
    <filter id="aboutShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#413880" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="none"/>

  <!-- Subtle Background Rings -->
  <circle cx="250" cy="225" r="170" fill="#6956e5" opacity="0.08"/>
  <circle cx="250" cy="225" r="120" stroke="#6956e5" stroke-dasharray="6,6" stroke-width="2" fill="none" opacity="0.3"/>

  <!-- Center Digital Hub / Studio Tablet -->
  <g filter="url(#aboutShadow)">
    <rect x="130" y="80" width="240" height="290" rx="20" fill="#201c3e"/>
    <rect x="142" y="94" width="216" height="262" rx="14" fill="#ffffff" opacity="0.96"/>

    <!-- Header of Tablet -->
    <rect x="160" y="115" width="80" height="12" rx="6" fill="#6956e5"/>
    <rect x="160" y="135" width="180" height="6" rx="3" fill="#e5e5f0"/>
    <rect x="160" y="147" width="140" height="6" rx="3" fill="#e5e5f0"/>

    <!-- Three Pillars inside Tablet: Creative, Tech, Solution -->
    <!-- Pillar 1: Kreatif -->
    <rect x="160" y="175" width="50" height="50" rx="8" fill="#f0edff"/>
    <circle cx="185" cy="200" r="12" fill="#6956e5"/>

    <!-- Pillar 2: Teknologi -->
    <rect x="225" y="175" width="50" height="50" rx="8" fill="#ffeaf0"/>
    <rect x="237" y="187" width="26" height="26" rx="4" fill="#ff7597"/>

    <!-- Pillar 3: Solusi -->
    <rect x="290" y="175" width="50" height="50" rx="8" fill="#fff6e5"/>
    <polygon points="315,188 328,212 302,212" fill="#ffbd2e"/>

    <!-- Graph / Growth Waves -->
    <path d="M 160 300 C 200 280, 240 310, 280 260 C 310 230, 330 240, 340 235"
          fill="none" stroke="#6956e5" stroke-width="4" stroke-linecap="round"/>
    <circle cx="280" cy="260" r="5" fill="#ff7597"/>
    <circle cx="340" cy="235" r="5" fill="#6956e5"/>

    <rect x="160" y="325" width="180" height="8" rx="4" fill="#f0edff"/>
  </g>

  <!-- Left Floating Badge: Studio Experience -->
  <g filter="url(#aboutShadow)" transform="translate(60, 240)">
    <rect x="0" y="0" width="90" height="90" rx="16" fill="#6956e5"/>
    <text x="45" y="42" font-family="'Poppins', sans-serif" font-weight="700" font-size="28" fill="#ffffff" text-anchor="middle">Ar</text>
    <text x="45" y="66" font-family="'Poppins', sans-serif" font-weight="500" font-size="11" fill="#e5e5f0" text-anchor="middle">CREATIVE</text>
  </g>

  <!-- Right Floating Badge: Education Mission -->
  <g filter="url(#aboutShadow)" transform="translate(350, 110)">
    <rect x="0" y="0" width="90" height="90" rx="16" fill="#ffffff" opacity="0.95"/>
    <circle cx="45" cy="38" r="18" fill="#ffbd2e" opacity="0.2"/>
    <!-- Mortarboard / Graduation / Learning icon -->
    <polygon points="45,26 62,35 45,44 28,35" fill="#ffbd2e"/>
    <polygon points="45,45 57,39 57,47 45,53 33,47 33,39" fill="#ff7597"/>
    <text x="45" y="74" font-family="'Poppins', sans-serif" font-weight="600" font-size="10" fill="#201c3e" text-anchor="middle">EDUKASI</text>
  </g>
</svg>
