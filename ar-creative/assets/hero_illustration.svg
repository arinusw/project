<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(250, 69%, 61%)" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="hsl(250, 69%, 61%)" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F0FF"/>
    </linearGradient>
  </defs>
  <!-- Background Decorative Shapes -->
  <circle cx="250" cy="200" r="160" fill="url(#heroGrad)" />
  <circle cx="400" cy="80" r="40" fill="hsl(250, 69%, 61%)" opacity="0.15"/>
  <circle cx="90" cy="320" r="35" fill="hsl(250, 69%, 61%)" opacity="0.2"/>

  <!-- Main Monitor / Digital Screen -->
  <rect x="100" y="80" width="300" height="200" rx="12" fill="#1E1E2C"/>
  <rect x="110" y="90" width="280" height="180" rx="8" fill="url(#screenGrad)"/>
  <rect x="220" y="280" width="60" height="40" fill="#3D3B54"/>
  <path d="M180 320 L320 320" stroke="#3D3B54" stroke-width="8" stroke-linecap="round"/>

  <!-- Window UI Bar -->
  <rect x="110" y="90" width="280" height="24" rx="8" fill="#E2DFEE"/>
  <circle cx="125" cy="102" r="4" fill="#FF5F56"/>
  <circle cx="137" cy="102" r="4" fill="#FFBD2E"/>
  <circle cx="149" cy="102" r="4" fill="#27C93F"/>

  <!-- Digital Art Elements on Screen -->
  <rect x="130" y="130" width="110" height="120" rx="6" fill="hsl(250, 69%, 61%)" opacity="0.85"/>
  <circle cx="185" cy="170" r="25" fill="#FFFFFF" opacity="0.9"/>
  <path d="M140 230 L170 190 L195 220 L210 200 L230 230 Z" fill="#E0D2FE"/>

  <!-- Code / Design Cards -->
  <rect x="255" y="130" width="120" height="32" rx="6" fill="#6C5CE7" opacity="0.15"/>
  <rect x="265" y="140" width="60" height="6" rx="3" fill="hsl(250, 69%, 61%)"/>
  <rect x="265" y="150" width="40" height="4" rx="2" fill="#A492F0"/>

  <rect x="255" y="172" width="120" height="32" rx="6" fill="#6C5CE7" opacity="0.15"/>
  <rect x="265" y="182" width="80" height="6" rx="3" fill="hsl(250, 69%, 61%)"/>
  <rect x="265" y="192" width="50" height="4" rx="2" fill="#A492F0"/>

  <rect x="255" y="214" width="120" height="36" rx="6" fill="hsl(250, 69%, 61%)"/>
  <text x="275" y="236" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Ar Creative</text>

  <!-- Floating Digital Art Gear / Creative Icons -->
  <g transform="translate(60, 140)">
    <rect width="50" height="50" rx="10" fill="#FFFFFF" box-shadow="0 10px 20px rgba(0,0,0,0.1)"/>
    <path d="M15 25 L22 32 L35 18" stroke="hsl(250, 69%, 61%)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <g transform="translate(380, 220)">
    <circle cx="25" cy="25" r="25" fill="#6C5CE7"/>
    <path d="M18 18 L32 32 M32 18 L18 32" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
