<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a29bfe" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="heroGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00CEC9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#81ECEC" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background decorative shapes -->
  <circle cx="250" cy="250" r="180" fill="url(#heroGrad1)" />
  <circle cx="340" cy="160" r="90" fill="url(#heroGrad2)" />

  <!-- Laptop / Screen Illustration -->
  <rect x="110" y="140" width="280" height="180" rx="12" fill="#2D3436" stroke="#6C5CE7" stroke-width="4"/>
  <rect x="125" y="155" width="250" height="150" rx="6" fill="#0F172A"/>

  <!-- Code/Design lines on screen -->
  <rect x="145" y="175" width="120" height="10" rx="5" fill="#6C5CE7"/>
  <rect x="145" y="195" width="180" height="8" rx="4" fill="#00CEC9"/>
  <rect x="145" y="210" width="150" height="8" rx="4" fill="#a29bfe"/>

  <circle cx="320" cy="245" r="30" fill="#FD79A8" opacity="0.8"/>
  <rect x="145" y="235" width="140" height="45" rx="8" fill="#1E293B" stroke="#00CEC9" stroke-width="2"/>
  <text x="160" y="262" font-family="sans-serif" font-size="14" font-weight="bold" fill="#00CEC9">Ar Creative</text>

  <!-- Laptop Base -->
  <path d="M80 320 L420 320 L390 340 L110 340 Z" fill="#64748B"/>
  <rect x="210" y="322" width="80" height="6" rx="3" fill="#94A3B8"/>

  <!-- Floating Creative Icons / Elements -->
  <g stroke="#00CEC9" stroke-width="3" fill="none">
    <path d="M70 160 L100 130 L100 190 Z" fill="#6C5CE7" opacity="0.6"/>
    <circle cx="410" cy="280" r="20" fill="#FDCB6E" opacity="0.7"/>
    <path d="M380 110 L410 110 L395 80 Z" fill="#00CEC9" opacity="0.8"/>
  </g>

  <!-- Floating sparkles -->
  <circle cx="120" cy="100" r="4" fill="#6C5CE7"/>
  <circle cx="380" cy="360" r="6" fill="#00CEC9"/>
  <circle cx="90" cy="280" r="5" fill="#FD79A8"/>
</svg>
