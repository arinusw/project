<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a29bfe" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="heroGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7675" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FD79A8" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Art Shapes -->
  <circle cx="250" cy="250" r="180" fill="url(#heroGrad1)" />
  <path d="M 120 350 Q 250 100 380 350 Z" fill="url(#heroGrad2)" opacity="0.6"/>

  <!-- Floating Elements (Digital Art Studio Vibe) -->
  <rect x="180" y="140" width="140" height="180" rx="16" fill="#1E1E2E" opacity="0.9" stroke="#6C5CE7" stroke-width="3"/>
  <!-- Canvas lines -->
  <path d="M 200 170 L 300 170 M 200 195 L 280 195 M 200 220 L 260 220" stroke="#a29bfe" stroke-width="4" stroke-linecap="round"/>

  <!-- Geometric Decorative Elements -->
  <circle cx="350" cy="150" r="25" fill="#FD79A8" opacity="0.8"/>
  <rect x="120" y="220" width="40" height="40" rx="8" fill="#00CEC9" transform="rotate(15 140 240)" opacity="0.8"/>
  <circle cx="200" cy="360" r="15" fill="#FFEAA7"/>
  <circle cx="330" cy="340" r="30" stroke="#6C5CE7" stroke-width="4" fill="none"/>

  <!-- Glowing Code / Design Cursor -->
  <polygon points="260,260 290,285 272,289 282,310 270,315 260,294 250,305" fill="#6C5CE7" filter="url(#glow)"/>
</svg>