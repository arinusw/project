<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#725BDE" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#5841C6" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#725BDE" />
      <stop offset="100%" stop-color="#5841C6" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7B9C" />
      <stop offset="100%" stop-color="#FF527B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#725BDE" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Blob -->
  <path d="M420,280Q390,360,310,410Q230,460,150,400Q70,340,80,240Q90,140,170,90Q250,40,340,80Q430,120,420,280Z" fill="url(#bg-grad)" />

  <!-- Floating Elements -->
  <circle cx="100" cy="120" r="12" fill="#725BDE" opacity="0.4"/>
  <circle cx="430" cy="140" r="8" fill="#FF7B9C" opacity="0.6"/>
  <circle cx="380" cy="400" r="16" fill="#725BDE" opacity="0.2"/>

  <!-- Digital Monitor / Workstation Container -->
  <rect x="90" y="110" width="320" height="220" rx="16" fill="#FFFFFF" filter="url(#shadow)"/>

  <!-- Screen Header -->
  <rect x="90" y="110" width="320" height="36" rx="16" fill="#F4F2FF"/>
  <rect x="90" y="130" width="320" height="16" fill="#F4F2FF"/>
  <circle cx="115" cy="128" r="5" fill="#FF527B"/>
  <circle cx="130" cy="128" r="5" fill="#FFC107"/>
  <circle cx="145" cy="128" r="5" fill="#4CAF50"/>

  <!-- Code & Graphic UI Graphics -->
  <rect x="115" y="165" width="120" height="12" rx="4" fill="#725BDE" opacity="0.8"/>
  <rect x="115" y="187" width="80" height="8" rx="3" fill="#E2DCFF"/>
  <rect x="202" y="187" width="50" height="8" rx="3" fill="#FF7B9C" opacity="0.7"/>
  <rect x="115" y="203" width="150" height="8" rx="3" fill="#E2DCFF"/>
  <rect x="115" y="219" width="100" height="8" rx="3" fill="#725BDE" opacity="0.3"/>

  <!-- Graphic Design Canvas -->
  <rect x="280" y="165" width="110" height="110" rx="12" fill="url(#primary-grad)"/>
  <circle cx="335" cy="220" r="30" fill="#FFFFFF" opacity="0.2"/>
  <path d="M310,240 L335,195 L360,240 Z" fill="#FF7B9C"/>
  <circle cx="350" cy="190" r="8" fill="#FFC107"/>

  <!-- Palette / Tools -->
  <rect x="115" y="245" width="275" height="60" rx="10" fill="#F9F8FE"/>
  <circle cx="145" cy="275" r="14" fill="url(#accent-grad)"/>
  <circle cx="185" cy="275" r="14" fill="#725BDE"/>
  <circle cx="225" cy="275" r="14" fill="#36D1DC"/>
  <rect x="260" y="267" width="110" height="16" rx="8" fill="#E2DCFF"/>

  <!-- Monitor Stand -->
  <rect x="230" y="330" width="40" height="50" fill="#D3CBFC"/>
  <ellipse cx="250" cy="380" rx="60" ry="12" fill="#B8ACF6"/>

  <!-- Creative Sparkles / Waves -->
  <path d="M70,260 C90,240 100,280 120,260" stroke="#725BDE" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M390,320 C410,300 420,340 440,320" stroke="#FF7B9C" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>
