<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#A29BFE"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F1F0FE" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6C5CE7" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background decorative elements -->
  <circle cx="100" cy="100" r="60" fill="#A29BFE" opacity="0.15"/>
  <circle cx="500" cy="400" r="90" fill="#6C5CE7" opacity="0.12"/>
  <rect x="420" y="80" width="40" height="40" rx="8" transform="rotate(15 440 100)" fill="#FD79A8" opacity="0.2"/>

  <!-- Desk Base -->
  <ellipse cx="300" cy="420" rx="240" ry="25" fill="#E2E8F0"/>

  <!-- Main Digital Workspace Canvas -->
  <g filter="url(#shadow)">
    <rect x="120" y="100" width="360" height="250" rx="16" fill="url(#heroGrad)"/>
    <!-- Screen Header bar -->
    <rect x="120" y="100" width="360" height="35" rx="16" fill="#5A4AD1"/>
    <circle cx="145" cy="117" r="5" fill="#FF7675"/>
    <circle cx="162" cy="117" r="5" fill="#FFEAA7"/>
    <circle cx="179" cy="117" r="5" fill="#55E6C1"/>

    <!-- Canvas Inner UI Window -->
    <rect x="140" y="150" width="210" height="180" rx="10" fill="#FFFFFF"/>
    <!-- Artwork elements inside UI -->
    <rect x="155" y="165" width="180" height="90" rx="6" fill="#F8F9FE"/>
    <path d="M 165 240 Q 200 190 235 220 T 315 195 L 325 240 Z" fill="#6C5CE7" opacity="0.7"/>
    <circle cx="280" cy="190" r="14" fill="#FDCB6E"/>

    <!-- Code Lines simulation -->
    <rect x="155" y="270" width="120" height="8" rx="4" fill="#6C5CE7"/>
    <rect x="155" y="285" width="160" height="8" rx="4" fill="#A29BFE"/>
    <rect x="155" y="300" width="90" height="8" rx="4" fill="#DFE6E9"/>

    <!-- Right Tool Palette Window -->
    <rect x="365" y="150" width="95" height="180" rx="10" fill="url(#cardGrad)"/>
    <circle cx="412" cy="180" r="18" fill="#6C5CE7"/>
    <rect x="380" y="215" width="65" height="10" rx="5" fill="#A29BFE"/>
    <rect x="380" y="235" width="65" height="10" rx="5" fill="#A29BFE" opacity="0.6"/>
    <rect x="380" y="255" width="65" height="10" rx="5" fill="#A29BFE" opacity="0.3"/>
    <rect x="380" y="285" width="65" height="28" rx="6" fill="#00B894"/>
    <text x="412" y="303" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">CREATE</text>
  </g>

  <!-- Laptop Stand and Base -->
  <path d="M 220 350 L 380 350 L 410 400 L 190 400 Z" fill="#DFE6E9"/>
  <rect x="270" y="400" width="60" height="6" rx="3" fill="#B2BEC3"/>

  <!-- Floating Creative Icons / Badges -->
  <g filter="url(#shadow)">
    <!-- Brush Icon Badge -->
    <circle cx="90" cy="240" r="30" fill="#FFFFFF"/>
    <path d="M 80 250 L 95 235 C 98 232 103 232 106 235 C 109 238 109 243 106 246 L 91 261 Z" fill="#6C5CE7"/>
    <circle cx="78" cy="253" r="4" fill="#E84393"/>

    <!-- Rocket / Innovation Badge -->
    <circle cx="510" cy="230" r="32" fill="#FFFFFF"/>
    <path d="M 510 210 C 522 210 528 222 528 232 L 492 232 C 492 222 498 210 510 210 Z" fill="#00CEC9"/>
    <polygon points="492,232 528,232 510,248" fill="#FF7675"/>
  </g>
</svg>
