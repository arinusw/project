<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c5dfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a31f4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9e80ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#7c5dfa;stop-opacity:0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Glow Circle -->
  <circle cx="250" cy="250" r="180" fill="url(#grad2)" />
  <circle cx="250" cy="250" r="140" fill="none" stroke="url(#grad1)" stroke-width="2" stroke-dasharray="8 8" opacity="0.6" />

  <!-- Main Display Screen Frame -->
  <rect x="100" y="120" width="300" height="200" rx="16" fill="#1e1e2d" stroke="url(#grad1)" stroke-width="3" filter="url(#glow)"/>

  <!-- Screen Header -->
  <path d="M 100 136 A 16 16 0 0 1 116 120 L 384 120 A 16 16 0 0 1 400 136 L 400 150 L 100 150 Z" fill="#2a2a3d"/>
  <circle cx="120" cy="135" r="4" fill="#ff5f56"/>
  <circle cx="132" cy="135" r="4" fill="#ffbd2e"/>
  <circle cx="144" cy="135" r="4" fill="#27c93f"/>

  <!-- Content Graphic Elements on Screen -->
  <!-- Code Lines / Graphics -->
  <rect x="120" y="170" width="80" height="8" rx="4" fill="#7c5dfa"/>
  <rect x="120" y="188" width="140" height="6" rx="3" fill="#606080"/>
  <rect x="120" y="202" width="110" height="6" rx="3" fill="#606080"/>

  <!-- Floating Card 1: Creative Art -->
  <rect x="220" y="190" width="160" height="100" rx="12" fill="url(#grad1)" opacity="0.9" />
  <path d="M 240 260 L 270 220 L 290 245 L 320 210 L 360 260 Z" fill="#ffffff" opacity="0.9"/>
  <circle cx="330" cy="225" r="12" fill="#ffbd2e"/>

  <!-- Stand / Base -->
  <path d="M 220 320 L 280 320 L 290 370 L 210 370 Z" fill="#2a2a3d"/>
  <rect x="180" y="370" width="140" height="10" rx="5" fill="#7c5dfa"/>

  <!-- Floating Creative Icons around -->
  <!-- Bulb Icon Circle -->
  <g transform="translate(80, 280)">
    <circle cx="25" cy="25" r="25" fill="#2a2a3d" stroke="#7c5dfa" stroke-width="2"/>
    <path d="M 25 12 A 8 8 0 0 0 18 22 C 18 25 21 27 21 30 L 29 30 C 29 27 32 25 32 22 A 8 8 0 0 0 25 12 Z" fill="#ffbd2e"/>
  </g>

  <!-- Rocket / Growth Circle -->
  <g transform="translate(360, 80)">
    <circle cx="25" cy="25" r="25" fill="#2a2a3d" stroke="#7c5dfa" stroke-width="2"/>
    <path d="M 20 32 C 20 25 25 15 32 15 C 32 22 25 28 20 32 Z" fill="#7c5dfa"/>
    <circle cx="27" cy="20" r="3" fill="#ffffff"/>
  </g>
</svg>
