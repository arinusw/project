<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a29bfe" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="heroGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00cec9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6C5CE7" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Glow Shapes -->
  <circle cx="250" cy="200" r="160" fill="url(#heroGrad1)" opacity="0.25" filter="url(#glow)"/>
  <circle cx="340" cy="140" r="80" fill="url(#heroGrad2)" opacity="0.3"/>

  <!-- Main Monitor / Screen Frame -->
  <rect x="90" y="70" width="320" height="210" rx="16" fill="#1e1e2e" stroke="#6C5CE7" stroke-width="3"/>
  <rect x="105" y="85" width="290" height="180" rx="10" fill="#2d2d44"/>

  <!-- Screen Elements -->
  <!-- Top Bar -->
  <rect x="115" y="95" width="270" height="24" rx="6" fill="#181825"/>
  <circle cx="130" cy="107" r="4" fill="#ff5f56"/>
  <circle cx="142" cy="107" r="4" fill="#ffbd2e"/>
  <circle cx="154" cy="107" r="4" fill="#27c93f"/>

  <!-- Creative Graphics / Code / Artwork Blocks -->
  <rect x="115" y="130" width="120" height="85" rx="8" fill="url(#heroGrad1)"/>
  <circle cx="175" cy="165" r="22" fill="#ffffff" opacity="0.8"/>
  <polygon points="170,155 185,165 170,175" fill="#6C5CE7"/>

  <!-- Sidebar UI elements -->
  <rect x="245" y="130" width="140" height="12" rx="4" fill="#6C5CE7" opacity="0.9"/>
  <rect x="245" y="150" width="110" height="8" rx="3" fill="#a29bfe" opacity="0.6"/>
  <rect x="245" y="165" width="125" height="8" rx="3" fill="#a29bfe" opacity="0.4"/>

  <rect x="245" y="185" width="60" height="30" rx="6" fill="#00cec9"/>
  <rect x="315" y="185" width="70" height="30" rx="6" fill="#6C5CE7"/>

  <!-- Stand & Base -->
  <path d="M220 280 L280 280 L290 330 L210 330 Z" fill="#181825"/>
  <rect x="180" y="330" width="140" height="12" rx="6" fill="#2d2d44"/>

  <!-- Floating Digital Icons -->
  <!-- Palette / Art Icon Floating -->
  <g transform="translate(60, 110)">
    <circle cx="25" cy="25" r="25" fill="#6C5CE7" opacity="0.9"/>
    <path d="M25 12 C18 12 12 18 12 25 C12 32 18 38 25 38 C27 38 28.5 36.5 28.5 35 C28.5 34.3 28.2 33.7 27.8 33.2 C27.4 32.7 27.2 32.1 27.2 31.5 C27.2 30.1 28.3 29 29.7 29 L32 29 C35.3 29 38 26.3 38 23 C38 16.9 32.2 12 25 12 Z" fill="#ffffff"/>
  </g>

  <!-- Code / Tech Icon Floating -->
  <g transform="translate(385, 220)">
    <circle cx="25" cy="25" r="25" fill="#00cec9" opacity="0.9"/>
    <path d="M17 20 L12 25 L17 30 M33 20 L38 25 L33 30 M27 15 L23 35" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Education / Lightbulb Icon Floating -->
  <g transform="translate(370, 60)">
    <circle cx="22" cy="22" r="22" fill="#fdcb6e" opacity="0.9"/>
    <path d="M22 12 C17 12 14 15 14 19 C14 22 16 24 17 26 C18 28 18 29 18 30 L26 30 C26 29 26 28 27 26 C28 24 30 22 30 19 C30 15 27 12 22 12 Z M20 32 L24 32" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Sparkles -->
  <path d="M100 50 L103 58 L111 61 L103 64 L100 72 L97 64 L89 61 L97 58 Z" fill="#fdcb6e"/>
  <path d="M420 180 L422 185 L427 187 L422 189 L420 194 L418 189 L413 187 L418 185 Z" fill="#6C5CE7"/>
</svg>
