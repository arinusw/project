<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e57e0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6e57e0" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6e57e0"/>
      <stop offset="100%" stop-color="#5a43cd"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6e57e0" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Decorative Shapes -->
  <circle cx="250" cy="200" r="160" fill="url(#heroGrad)"/>
  <circle cx="390" cy="90" r="24" fill="#6e57e0" opacity="0.2"/>
  <circle cx="100" cy="310" r="16" fill="#6e57e0" opacity="0.3"/>

  <!-- Monitor Stand -->
  <rect x="230" y="300" width="40" height="40" fill="#a197f0" rx="4"/>
  <path d="M 200 340 L 300 340 L 310 350 L 190 350 Z" fill="#7f6ee3"/>

  <!-- Monitor Screen -->
  <g filter="url(#shadow)">
    <rect x="100" y="80" width="300" height="220" rx="12" fill="#ffffff" stroke="#e2dff8" stroke-width="3"/>
    <rect x="108" y="88" width="284" height="204" rx="8" fill="#f8f7fd"/>

    <!-- Code Editor Header -->
    <rect x="108" y="88" width="284" height="28" rx="8" fill="url(#screenGrad)"/>
    <circle cx="126" cy="102" r="4" fill="#ff5f56"/>
    <circle cx="138" cy="102" r="4" fill="#ffbd2e"/>
    <circle cx="150" cy="102" r="4" fill="#27c93f"/>

    <!-- Code Lines / Digital UI Art -->
    <rect x="128" y="132" width="100" height="10" rx="3" fill="#6e57e0"/>
    <rect x="236" y="132" width="60" height="10" rx="3" fill="#a197f0"/>

    <rect x="148" y="152" width="140" height="8" rx="2" fill="#c4bcfa"/>
    <rect x="148" y="168" width="110" height="8" rx="2" fill="#c4bcfa"/>

    <!-- Graphical Cards on Screen -->
    <rect x="128" y="190" width="110" height="80" rx="8" fill="#ffffff" stroke="#e2dff8"/>
    <path d="M 140 245 L 165 215 L 185 235 L 200 220 L 226 245 Z" fill="#6e57e0" opacity="0.7"/>
    <circle cx="210" cy="208" r="8" fill="#ffbd2e"/>

    <rect x="250" y="190" width="124" height="36" rx="6" fill="#6e57e0" opacity="0.1"/>
    <rect x="262" y="202" width="70" height="6" rx="2" fill="#6e57e0"/>
    <rect x="262" y="214" width="45" height="4" rx="2" fill="#a197f0"/>

    <rect x="250" y="234" width="124" height="36" rx="6" fill="#6e57e0" opacity="0.1"/>
    <rect x="262" y="246" width="80" height="6" rx="2" fill="#6e57e0"/>
    <rect x="262" y="258" width="50" height="4" rx="2" fill="#a197f0"/>
  </g>

  <!-- Floating Elements -->
  <g filter="url(#shadow)">
    <!-- Palette Floating Card -->
    <rect x="60" y="180" width="70" height="70" rx="14" fill="#ffffff"/>
    <path d="M 95 195 A 20 20 0 1 0 115 215 A 10 10 0 0 1 105 205 A 10 10 0 0 0 95 195 Z" fill="#6e57e0"/>
    <circle cx="85" cy="210" r="3" fill="#ff5f56"/>
    <circle cx="95" cy="203" r="3" fill="#ffbd2e"/>
    <circle cx="107" cy="215" r="3" fill="#27c93f"/>

    <!-- Rocket / Creativity Card -->
    <rect x="360" y="130" width="80" height="80" rx="16" fill="#ffffff"/>
    <path d="M 400 150 C 415 150 420 165 420 180 L 380 180 C 380 165 385 150 400 150 Z" fill="#6e57e0"/>
    <circle cx="400" cy="165" r="5" fill="#ffffff"/>
    <path d="M 390 180 L 400 195 L 410 180 Z" fill="#ff5f56"/>
  </g>
</svg>
