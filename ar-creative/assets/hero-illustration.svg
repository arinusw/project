<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-hero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e57e0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9b51e0" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#3a7bd5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6e57e0" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Blobs -->
  <circle cx="250" cy="200" r="160" fill="url(#grad-hero)" opacity="0.15"/>
  <circle cx="380" cy="120" r="60" fill="#00d2ff" opacity="0.2"/>
  <circle cx="120" cy="300" r="80" fill="#9b51e0" opacity="0.15"/>

  <!-- Screen / Canvas Frame -->
  <rect x="80" y="70" width="340" height="230" rx="16" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="80" y="70" width="340" height="36" rx="16" fill="#6e57e0"/>
  <!-- Hide bottom rounded corner for header -->
  <rect x="80" y="90" width="340" height="16" fill="#6e57e0"/>

  <!-- Window Controls -->
  <circle cx="104" cy="88" r="5" fill="#ff5f56"/>
  <circle cx="120" cy="88" r="5" fill="#ffbd2e"/>
  <circle cx="136" cy="88" r="5" fill="#27c93f"/>

  <!-- Graphic Design Elements inside Window -->
  <rect x="110" y="125" width="120" height="80" rx="8" fill="#f0edff"/>
  <path d="M 125 180 Q 150 140 170 165 T 215 145" fill="none" stroke="#6e57e0" stroke-width="4" stroke-linecap="round"/>
  <circle cx="150" cy="145" r="10" fill="#00d2ff"/>

  <!-- Code Blocks -->
  <rect x="245" y="125" width="145" height="12" rx="4" fill="#e2e8f0"/>
  <rect x="245" y="145" width="110" height="12" rx="4" fill="#6e57e0" opacity="0.7"/>
  <rect x="245" y="165" width="130" height="12" rx="4" fill="#e2e8f0"/>
  <rect x="245" y="185" width="85" height="12" rx="4" fill="#00d2ff" opacity="0.8"/>

  <!-- Floating Digital Badges -->
  <g transform="translate(60, 220)">
    <rect x="0" y="0" width="120" height="60" rx="12" fill="#ffffff" filter="url(#shadow)"/>
    <circle cx="30" cy="30" r="16" fill="url(#grad-accent)"/>
    <path d="M 24 30 L 28 34 L 36 26" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="54" y="20" width="50" height="8" rx="4" fill="#2d3748"/>
    <rect x="54" y="34" width="35" height="6" rx="3" fill="#a0aec0"/>
  </g>

  <g transform="translate(320, 210)">
    <rect x="0" y="0" width="130" height="65" rx="12" fill="#6e57e0" filter="url(#shadow)"/>
    <circle cx="32" cy="32" r="16" fill="#ffffff" opacity="0.2"/>
    <polygon points="32,22 40,38 24,38" fill="#ffffff"/>
    <rect x="58" y="22" width="55" height="8" rx="4" fill="#ffffff"/>
    <rect x="58" y="36" width="40" height="6" rx="3" fill="#ffffff" opacity="0.7"/>
  </g>
</svg>
