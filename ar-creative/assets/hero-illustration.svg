<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B61FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#5A3EE8" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background decorative elements -->
  <circle cx="250" cy="250" r="180" fill="url(#heroGrad)" opacity="0.15" />
  <circle cx="360" cy="140" r="40" fill="#00F2FE" opacity="0.2" />
  <circle cx="120" cy="380" r="60" fill="#7B61FF" opacity="0.2" />

  <!-- Digital Workstation Canvas -->
  <rect x="80" y="100" width="340" height="230" rx="16" fill="#1E1E2E" stroke="#313244" stroke-width="4" filter="url(#glow)"/>
  <rect x="95" y="115" width="310" height="200" rx="10" fill="#181825"/>

  <!-- Code / Art interface elements -->
  <rect x="110" y="130" width="120" height="12" rx="6" fill="url(#accentGrad)" />
  <rect x="110" y="152" width="180" height="8" rx="4" fill="#6C7086" opacity="0.6"/>
  <rect x="110" y="168" width="140" height="8" rx="4" fill="#6C7086" opacity="0.4"/>

  <!-- Vector graphics illustration art inside canvas -->
  <path d="M 240 280 L 290 190 L 330 240 L 360 200 L 395 280 Z" fill="url(#heroGrad)" opacity="0.8"/>
  <circle cx="340" cy="160" r="18" fill="#F9E2AF"/>

  <!-- Palette / Tools representation -->
  <g transform="translate(110, 200)">
    <rect x="0" y="0" width="80" height="90" rx="8" fill="#313244" opacity="0.7"/>
    <circle cx="20" cy="25" r="8" fill="#F38BA8"/>
    <circle cx="45" cy="25" r="8" fill="#FAB387"/>
    <circle cx="20" cy="50" r="8" fill="#A6E3A1"/>
    <circle cx="45" cy="50" r="8" fill="#89B4FA"/>
  </g>

  <!-- Stylus / Floating Creative Elements -->
  <g transform="translate(260, 290) rotate(-25)">
    <rect x="0" y="0" width="14" height="120" rx="7" fill="url(#accentGrad)"/>
    <polygon points="0,120 14,120 7,135" fill="#CDD6F4"/>
  </g>

  <!-- Glowing nodes / digital connections -->
  <circle cx="100" cy="80" r="6" fill="#00F2FE" />
  <line x1="100" y1="80" x2="160" y2="100" stroke="#00F2FE" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>

  <circle cx="410" cy="370" r="8" fill="#7B61FF" />
  <line x1="410" y1="370" x2="350" y2="330" stroke="#7B61FF" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
</svg>
