<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hero-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7059e2" />
      <stop offset="100%" stop-color="#4a37b6" />
    </linearGradient>
    <linearGradient id="hero-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="hero-grad-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background decorative floating shapes -->
  <circle cx="100" cy="100" r="80" fill="url(#hero-grad-1)" opacity="0.15" />
  <circle cx="520" cy="380" r="100" fill="url(#hero-grad-2)" opacity="0.15" />
  <rect x="450" y="60" width="60" height="60" rx="15" transform="rotate(25 480 90)" fill="url(#hero-grad-accent)" opacity="0.2" />

  <!-- Main Canvas / Laptop & Floating Elements Studio Illustration -->
  <g transform="translate(50, 40)">
    <!-- Base Desk Glow -->
    <ellipse cx="250" cy="390" rx="220" ry="20" fill="#2d2b42" opacity="0.2" />

    <!-- Main Workspace Monitor/Screen -->
    <rect x="80" y="80" width="340" height="230" rx="16" fill="#1e1c2b" stroke="#332f4c" stroke-width="3" />
    <rect x="95" y="95" width="310" height="200" rx="8" fill="#13121c" />

    <!-- Code / Creative UI Canvas inside screen -->
    <rect x="110" y="110" width="120" height="170" rx="6" fill="#1d1a2f" />
    <line x1="125" y1="130" x2="200" y2="130" stroke="#7059e2" stroke-width="4" stroke-linecap="round" />
    <line x1="125" y1="148" x2="180" y2="148" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" />
    <line x1="125" y1="162" x2="210" y2="162" stroke="#ffb199" stroke-width="3" stroke-linecap="round" />
    <line x1="125" y1="176" x2="160" y2="176" stroke="#686589" stroke-width="3" stroke-linecap="round" />

    <!-- Graphic Design Tool / Palette side -->
    <rect x="242" y="110" width="150" height="110" rx="6" fill="#25213b" />
    <circle cx="280" cy="150" r="22" fill="url(#hero-grad-1)" />
    <rect x="315" y="135" width="60" height="8" rx="4" fill="#00f2fe" />
    <rect x="315" y="150" width="45" height="8" rx="4" fill="#ffb199" />
    <rect x="315" y="165" width="55" height="8" rx="4" fill="#7059e2" opacity="0.6" />

    <!-- Stand -->
    <path d="M 220 310 L 280 310 L 290 360 L 210 360 Z" fill="#2d2b42" />
    <rect x="190" y="360" width="120" height="10" rx="4" fill="#3f3b5c" />

    <!-- Floating Graphic Badges / Digital Icons -->
    <g transform="translate(20, 40)" filter="url(#glow)">
      <rect x="10" y="140" width="70" height="70" rx="18" fill="url(#hero-grad-1)" />
      <path d="M 35 160 L 55 175 L 35 190 Z" fill="#ffffff" />
    </g>

    <g transform="translate(380, 20)">
      <rect x="0" y="0" width="75" height="75" rx="20" fill="url(#hero-grad-2)" />
      <circle cx="37" cy="37" r="18" stroke="#ffffff" stroke-width="4" fill="none" />
      <path d="M 45 25 L 52 18" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    </g>

    <g transform="translate(360, 260)">
      <rect x="0" y="0" width="65" height="65" rx="18" fill="url(#hero-grad-accent)" />
      <path d="M 20 45 L 32 20 L 45 45 Z" fill="#ffffff" />
    </g>

    <!-- Sparkles / Floating Dots -->
    <circle cx="60" cy="60" r="4" fill="#00f2fe" />
    <circle cx="420" cy="30" r="6" fill="#7059e2" />
    <circle cx="450" cy="220" r="5" fill="#ffb199" />
    <circle cx="40" cy="320" r="5" fill="#00f2fe" />
  </g>
</svg>
