<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c69ef" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#5a41d6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="heroGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38ef7d" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#11998e" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e43"/>
      <stop offset="100%" stop-color="#181a27"/>
    </linearGradient>
    <filter id="heroShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ambient background glow elements -->
  <circle cx="250" cy="200" r="160" fill="url(#heroGrad1)" opacity="0.12"/>
  <circle cx="360" cy="140" r="90" fill="url(#heroGrad2)" opacity="0.15"/>

  <!-- Isometric / Floating Platform / Digital Workspace Base -->
  <g filter="url(#heroShadow)">
    <rect x="75" y="70" width="350" height="230" rx="18" fill="url(#screenGrad)" stroke="#4a4f6b" stroke-width="2"/>
    <!-- Window Bar -->
    <rect x="75" y="70" width="350" height="30" rx="18" fill="#202436"/>
    <circle cx="98" cy="85" r="5" fill="#ff5f56"/>
    <circle cx="114" cy="85" r="5" fill="#ffbd2e"/>
    <circle cx="130" cy="85" r="5" fill="#27c93f"/>
    <!-- Search / URL mock -->
    <rect x="155" y="77" width="190" height="16" rx="8" fill="#151722"/>
    <text x="250" y="89" fill="#8e94a8" font-size="9" font-family="'Poppins', sans-serif" text-anchor="middle">arcreative.studio</text>
  </g>

  <!-- Code / Design Canvas Interior -->
  <rect x="95" y="115" width="180" height="165" rx="10" fill="#151824" opacity="0.9"/>
  <!-- Code lines -->
  <rect x="110" y="132" width="70" height="6" rx="3" fill="#6c5ce7"/>
  <rect x="190" y="132" width="40" height="6" rx="3" fill="#00cec9"/>
  <rect x="120" y="148" width="90" height="5" rx="2.5" fill="#fab1a0" opacity="0.8"/>
  <rect x="120" y="162" width="110" height="5" rx="2.5" fill="#74b9ff" opacity="0.8"/>
  <rect x="135" y="176" width="60" height="5" rx="2.5" fill="#55efc4" opacity="0.8"/>
  <rect x="110" y="196" width="80" height="6" rx="3" fill="#a29bfe"/>
  <rect x="120" y="212" width="120" height="5" rx="2.5" fill="#ffeaa7" opacity="0.8"/>
  <rect x="120" y="226" width="75" height="5" rx="2.5" fill="#81ecec" opacity="0.8"/>
  <rect x="110" y="246" width="50" height="6" rx="3" fill="#fd79a8"/>

  <!-- Right Visual Cards / Creative Elements -->
  <g filter="url(#heroShadow)">
    <rect x="290" y="115" width="120" height="75" rx="12" fill="url(#heroGrad1)"/>
    <!-- Creative Sparkle -->
    <circle cx="350" cy="145" r="18" fill="#ffffff" opacity="0.2"/>
    <path d="M350 133 L353 142 L362 145 L353 148 L350 157 L347 148 L338 145 L347 142 Z" fill="#ffffff"/>
    <text x="350" y="175" fill="#ffffff" font-size="10" font-weight="600" font-family="'Poppins', sans-serif" text-anchor="middle">Creative Studio</text>
  </g>

  <g filter="url(#heroShadow)">
    <rect x="290" y="202" width="120" height="78" rx="12" fill="#202538" stroke="#6c5ce7" stroke-width="1.5"/>
    <circle cx="318" cy="228" r="12" fill="#00cec9" opacity="0.2"/>
    <path d="M314 228 L317 232 L323 224" stroke="#00cec9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="338" y="222" width="55" height="5" rx="2.5" fill="#ffffff"/>
    <rect x="338" y="232" width="40" height="4" rx="2" fill="#8e94a8"/>
    <!-- Progress Indicator -->
    <rect x="305" y="254" width="90" height="6" rx="3" fill="#131622"/>
    <rect x="305" y="254" width="70" height="6" rx="3" fill="url(#heroGrad2)"/>
    <text x="305" y="271" fill="#74b9ff" font-size="8" font-family="'Poppins', sans-serif">100% Solusi Digital</text>
  </g>

  <!-- Floating Digital Badges -->
  <g filter="url(#heroShadow)">
    <circle cx="70" cy="180" r="28" fill="#6c5ce7"/>
    <path d="M60 180 L68 172 L76 188 L80 180" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <g filter="url(#heroShadow)">
    <circle cx="430" cy="190" r="26" fill="#00cec9"/>
    <text x="430" y="196" fill="#ffffff" font-size="16" font-weight="bold" font-family="'Poppins', sans-serif" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- Base Stand / Keyboard Glow -->
  <ellipse cx="250" cy="335" rx="160" ry="14" fill="#000000" opacity="0.2"/>
</svg>
