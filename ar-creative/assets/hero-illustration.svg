<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hero-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B61FF"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>
    <linearGradient id="hero-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6584"/>
      <stop offset="100%" stop-color="#7B61FF"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2A38"/>
      <stop offset="100%" stop-color="#1E1E28"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Ambient Glows -->
  <circle cx="200" cy="180" r="140" fill="#7B61FF" opacity="0.25" filter="url(#glow)"/>
  <circle cx="420" cy="300" r="120" fill="#00F2FE" opacity="0.2" filter="url(#glow)"/>
  <circle cx="150" cy="380" r="90" fill="#FF6584" opacity="0.2" filter="url(#glow)"/>

  <!-- Floating Grid Lines -->
  <path d="M 50 100 L 550 100 M 50 200 L 550 200 M 50 300 L 550 300 M 50 400 L 550 400" stroke="rgba(255,255,255,0.05)" stroke-width="1" stroke-dasharray="5 5"/>
  <path d="M 100 50 L 100 450 M 200 50 L 200 450 M 300 50 L 300 450 M 400 50 L 400 450 M 500 50 L 500 450" stroke="rgba(255,255,255,0.05)" stroke-width="1" stroke-dasharray="5 5"/>

  <!-- Main Canvas / Monitor Frame -->
  <rect x="120" y="80" width="360" height="240" rx="16" fill="url(#card-grad)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <!-- Screen Header -->
  <rect x="120" y="80" width="360" height="36" rx="16" fill="rgba(255,255,255,0.05)"/>
  <circle cx="145" cy="98" r="5" fill="#FF5F56"/>
  <circle cx="162" cy="98" r="5" fill="#FFBD2E"/>
  <circle cx="179" cy="98" r="5" fill="#27C93F"/>

  <!-- Screen Content: Vector Graphic & UI Elements -->
  <path d="M 160 260 C 220 160, 260 280, 320 180 C 360 250, 400 210, 440 270" stroke="url(#hero-grad-1)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="320" cy="180" r="8" fill="#00F2FE"/>
  <circle cx="260" cy="280" r="6" fill="#FF6584"/>

  <!-- Glowing Abstract Spheres/Shapes -->
  <circle cx="380" cy="150" r="28" fill="url(#hero-grad-2)" opacity="0.9"/>
  <rect x="160" y="140" width="80" height="60" rx="10" fill="rgba(123, 97, 255, 0.3)" stroke="#7B61FF" stroke-width="1.5"/>

  <!-- Code / Design Lines in Screen -->
  <rect x="175" y="155" width="50" height="6" rx="3" fill="#ffffff" opacity="0.8"/>
  <rect x="175" y="170" width="35" height="6" rx="3" fill="#00F2FE" opacity="0.8"/>
  <rect x="175" y="185" width="42" height="6" rx="3" fill="#FF6584" opacity="0.8"/>

  <!-- Floating UI Cards -->
  <!-- Card 1: Creative Palette -->
  <g transform="translate(60, 240)">
    <rect x="0" y="0" width="130" height="110" rx="14" fill="#1E1E28" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="14" fill="url(#hero-grad-1)"/>
    <rect x="58" y="28" width="50" height="6" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="58" y="40" width="35" height="5" rx="2.5" fill="#a0a0b0"/>
    <!-- Palette Dots -->
    <circle cx="30" cy="75" r="8" fill="#7B61FF"/>
    <circle cx="52" cy="75" r="8" fill="#00F2FE"/>
    <circle cx="74" cy="75" r="8" fill="#FF6584"/>
    <circle cx="96" cy="75" r="8" fill="#FFBD2E"/>
  </g>

  <!-- Card 2: Code / Tech Badge -->
  <g transform="translate(410, 200)">
    <rect x="0" y="0" width="130" height="100" rx="14" fill="#1E1E28" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <rect x="20" y="20" width="36" height="36" rx="8" fill="rgba(0, 242, 254, 0.15)"/>
    <path d="M 31 32 L 25 38 L 31 44 M 45 32 L 51 38 L 45 44" stroke="#00F2FE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="20" y="68" width="70" height="6" rx="3" fill="#ffffff" opacity="0.8"/>
    <rect x="20" y="80" width="45" height="5" rx="2.5" fill="#a0a0b0"/>
  </g>

  <!-- Card 3: Laptop Base / Stand -->
  <path d="M 180 320 L 420 320 L 450 350 L 150 350 Z" fill="rgba(255,255,255,0.08)"/>
  <rect x="260" y="325" width="80" height="5" rx="2.5" fill="rgba(255,255,255,0.2)"/>

  <!-- Decorative Sparks & Floating Elements -->
  <polygon points="100,80 105,95 120,100 105,105 100,120 95,105 80,100 95,95" fill="#00F2FE" opacity="0.8"/>
  <polygon points="500,380 504,392 516,396 504,400 500,412 496,400 484,396 496,392" fill="#FF6584" opacity="0.8"/>
  <circle cx="480" cy="90" r="4" fill="#7B61FF"/>
  <circle cx="110" cy="410" r="6" fill="#00F2FE"/>
</svg>