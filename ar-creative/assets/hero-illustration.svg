<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b5df0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4932a8" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="heroGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff758c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff7eb3" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2f"/>
      <stop offset="100%" stop-color="#2a2b45"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background blobs -->
  <circle cx="250" cy="250" r="180" fill="url(#heroGrad1)" opacity="0.15" filter="url(#glow)"/>
  <circle cx="340" cy="180" r="100" fill="url(#heroGrad2)" opacity="0.2" filter="url(#glow)"/>

  <!-- Geometric base shapes -->
  <rect x="70" y="90" width="360" height="250" rx="18" fill="url(#screenGrad)" stroke="#7b5df0" stroke-width="2"/>

  <!-- Window top bar -->
  <rect x="70" y="90" width="360" height="34" rx="18" fill="#181824"/>
  <rect x="70" y="110" width="360" height="14" fill="#181824"/>
  <circle cx="95" cy="107" r="5" fill="#ff5f56"/>
  <circle cx="112" cy="107" r="5" fill="#ffbd2e"/>
  <circle cx="129" cy="107" r="5" fill="#27c93f"/>

  <!-- Code / Art Canvas elements -->
  <rect x="95" y="145" width="130" height="12" rx="4" fill="#7b5df0" opacity="0.7"/>
  <rect x="95" y="168" width="80" height="8" rx="3" fill="#a493f7" opacity="0.5"/>
  <rect x="95" y="185" width="110" height="8" rx="3" fill="#a493f7" opacity="0.3"/>
  <rect x="95" y="202" width="60" height="8" rx="3" fill="#ff758c" opacity="0.6"/>

  <!-- Floating Digital Art Canvas Card -->
  <rect x="250" y="145" width="155" height="165" rx="12" fill="#23243a" stroke="#a493f7" stroke-width="1.5"/>
  <!-- Vector geometry inside canvas -->
  <polygon points="327,170 380,260 275,260" fill="url(#heroGrad1)" opacity="0.85"/>
  <circle cx="295" cy="195" r="20" fill="url(#heroGrad2)" opacity="0.9"/>
  <path d="M 260 270 Q 327 220 395 270" stroke="#00f2fe" stroke-width="3" fill="none" opacity="0.8"/>

  <!-- Floating UI Elements -->
  <!-- Creative palette badge -->
  <g transform="translate(40, 270)">
    <rect x="0" y="0" width="130" height="60" rx="12" fill="#2a2550" stroke="#7b5df0" stroke-width="1.5"/>
    <circle cx="25" cy="30" r="14" fill="#7b5df0"/>
    <path d="M22 30 L28 26 L28 34 Z" fill="#ffffff"/>
    <rect x="48" y="20" width="65" height="7" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="48" y="33" width="45" height="6" rx="3" fill="#a493f7" opacity="0.7"/>
  </g>

  <!-- Tech badge -->
  <g transform="translate(330, 290)">
    <rect x="0" y="0" width="135" height="60" rx="12" fill="#202b48" stroke="#00f2fe" stroke-width="1.5"/>
    <circle cx="25" cy="30" r="14" fill="#00d2d3"/>
    <!-- Code icon inside circle -->
    <text x="25" y="35" font-family="monospace" font-size="14" font-weight="bold" fill="#0c1b29" text-anchor="middle">&lt;/&gt;</text>
    <rect x="48" y="20" width="70" height="7" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="48" y="33" width="50" height="6" rx="3" fill="#00f2fe" opacity="0.7"/>
  </g>

  <!-- Laptop stand / base -->
  <path d="M190 340 L310 340 L330 380 L170 380 Z" fill="#181824" stroke="#7b5df0" stroke-width="1.5"/>
  <rect x="140" y="380" width="220" height="12" rx="6" fill="#23243a" stroke="#7b5df0" stroke-width="1.5"/>

  <!-- Floating stars/sparkles -->
  <path d="M 120 70 L 123 78 L 131 81 L 123 84 L 120 92 L 117 84 L 109 81 L 117 78 Z" fill="#ffd166"/>
  <path d="M 400 90 L 402 96 L 408 98 L 402 100 L 400 106 L 398 100 L 392 98 L 398 96 Z" fill="#ff758c"/>
  <path d="M 370 410 L 372 416 L 378 418 L 372 420 L 370 426 L 368 420 L 362 418 L 368 416 Z" fill="#00f2fe"/>
</svg>
