<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7c3aed" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background decorative blobs -->
  <circle cx="250" cy="200" r="160" fill="url(#gradBg)"/>
  <circle cx="380" cy="110" r="45" fill="#c4b5fd" opacity="0.3"/>
  <circle cx="110" cy="290" r="30" fill="#93c5fd" opacity="0.4"/>

  <!-- Floating creative elements -->
  <g transform="translate(70, 70)" filter="url(#shadow)">
    <rect width="64" height="64" rx="16" fill="#ffffff"/>
    <path d="M22 32 L32 22 L42 32 L32 42 Z" fill="#7c3aed"/>
  </g>
  <g transform="translate(370, 240)" filter="url(#shadow)">
    <rect width="58" height="58" rx="14" fill="#ffffff"/>
    <circle cx="29" cy="29" r="14" fill="#06b6d4"/>
  </g>

  <!-- Main Canvas / Laptop Display -->
  <g transform="translate(110, 110)" filter="url(#shadow)">
    <!-- Display frame -->
    <rect x="0" y="0" width="280" height="185" rx="14" fill="#1e1b4b"/>
    <!-- Screen content -->
    <rect x="8" y="8" width="264" height="169" rx="8" fill="#0f172a"/>

    <!-- Browser bar -->
    <circle cx="24" cy="22" r="4" fill="#ef4444"/>
    <circle cx="36" cy="22" r="4" fill="#eab308"/>
    <circle cx="48" cy="22" r="4" fill="#22c55e"/>

    <!-- Code & Creative Layers -->
    <rect x="24" y="42" width="70" height="10" rx="3" fill="#818cf8"/>
    <rect x="24" y="58" width="110" height="6" rx="3" fill="#475569"/>
    <rect x="24" y="70" width="90" height="6" rx="3" fill="#475569"/>

    <!-- Vector palette illustration inside screen -->
    <rect x="150" y="42" width="95" height="110" rx="8" fill="url(#gradPrimary)"/>
    <circle cx="198" cy="85" r="28" fill="#ffffff" opacity="0.25"/>
    <path d="M170 135 C185 110, 210 110, 225 135 Z" fill="#ffffff" opacity="0.4"/>

    <!-- Code tag accents -->
    <text x="24" y="115" font-family="monospace" font-size="13" font-weight="bold" fill="#38bdf8">&lt;/&gt;</text>
    <rect x="52" y="105" width="60" height="12" rx="3" fill="#334155"/>
    <text x="24" y="140" font-family="monospace" font-size="11" fill="#a78bfa">creative_studio.init();</text>
  </g>

  <!-- Base stand of device -->
  <path d="M200 295 L300 295 L315 315 L185 315 Z" fill="#cbd5e1"/>
  <rect x="170" y="315" width="160" height="8" rx="4" fill="#94a3b8"/>
</svg>
