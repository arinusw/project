<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7b61ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Glow Shapes -->
  <circle cx="250" cy="250" r="180" fill="url(#grad1)" opacity="0.15" filter="url(#glow)" />
  <circle cx="360" cy="140" r="80" fill="url(#grad2)" opacity="0.2" />

  <!-- Abstract Floating Canvas/Screen -->
  <rect x="80" y="100" width="340" height="240" rx="20" fill="#1e1b4b" opacity="0.9" />
  <rect x="100" y="120" width="300" height="200" rx="12" fill="#0f172a" />

  <!-- Code/Design Lines inside Screen -->
  <rect x="120" y="145" width="120" height="12" rx="6" fill="#7b61ff" />
  <rect x="250" y="145" width="80" height="12" rx="6" fill="#38bdf8" />
  <rect x="120" y="175" width="200" height="10" rx="5" fill="#334155" />
  <rect x="120" y="195" width="160" height="10" rx="5" fill="#334155" />

  <!-- Graphic Elements/Charts on Screen -->
  <circle cx="150" cy="255" r="25" fill="none" stroke="#7b61ff" stroke-width="6" />
  <path d="M 150 230 A 25 25 0 0 1 175 255" fill="none" stroke="#38bdf8" stroke-width="6" />
  <rect x="200" y="240" width="18" height="40" rx="4" fill="#6366f1" />
  <rect x="228" y="225" width="18" height="55" rx="4" fill="#38bdf8" />
  <rect x="256" y="250" width="18" height="30" rx="4" fill="#818cf8" />

  <!-- Stylized Floating Digital Cubes & Objects -->
  <g transform="translate(320, 260)">
    <polygon points="0,-25 22,-12 22,12 0,25 -22,12 -22,-12" fill="#7b61ff" />
    <polygon points="0,-25 22,-12 0,0 -22,-12" fill="#a5b4fc" opacity="0.7" />
    <polygon points="0,0 22,-12 22,12 0,25" fill="#4338ca" />
  </g>

  <!-- Laptop Base/Stand -->
  <path d="M 40 340 L 460 340 C 470 340 475 348 465 355 L 435 375 C 430 380 420 380 410 380 L 90 380 C 80 380 70 380 65 375 L 35 355 C 25 348 30 340 40 340 Z" fill="url(#grad1)" />
  <rect x="200" y="345" width="100" height="6" rx="3" fill="#cbd5e1" opacity="0.6" />

  <!-- Decorative Orbit Dots -->
  <circle cx="90" cy="80" r="6" fill="#38bdf8" />
  <circle cx="420" cy="90" r="10" fill="#7b61ff" />
  <circle cx="430" cy="300" r="5" fill="#f43f5e" />
  <circle cx="70" cy="280" r="8" fill="#10b981" />
</svg>
