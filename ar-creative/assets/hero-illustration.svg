<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8068e0"/>
      <stop offset="100%" stop-color="#5b42c6"/>
    </linearGradient>
    <linearGradient id="heroGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a83f3"/>
      <stop offset="100%" stop-color="#6e57d2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Floating Blob -->
  <path d="M 250, 80 C 350, 60 440, 140 430, 250 C 420, 360 340, 430 230, 420 C 120, 410 70, 310 90, 210 C 110, 110 150, 100 250, 80 Z" fill="url(#heroGrad1)" opacity="0.15" />
  <circle cx="250" cy="250" r="160" fill="none" stroke="url(#heroGrad1)" stroke-width="2" stroke-dasharray="8 6" opacity="0.4"/>

  <!-- Central Digital Device Frame -->
  <rect x="140" y="120" width="220" height="260" rx="20" fill="url(#heroGrad1)" filter="url(#glow)" opacity="0.9"/>
  <rect x="150" y="130" width="200" height="240" rx="14" fill="#181528"/>

  <!-- Floating Creative Code & Graphics Elements -->
  <!-- Screen Elements -->
  <rect x="165" y="150" width="100" height="12" rx="4" fill="#6e57d2" opacity="0.8"/>
  <rect x="165" y="170" width="170" height="8" rx="3" fill="#3b335c"/>
  <rect x="165" y="185" width="130" height="8" rx="3" fill="#3b335c"/>

  <!-- Floating Nodes / Canvas Elements -->
  <circle cx="200" cy="240" r="24" fill="url(#heroGrad2)"/>
  <path d="M 192 240 L 208 240 M 200 232 L 200 248" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <rect x="240" y="220" width="95" height="70" rx="8" fill="#241e3a" stroke="#6e57d2" stroke-width="1.5"/>
  <polygon points="260,270 280,240 295,260 305,250 320,270" fill="#8068e0" opacity="0.7"/>
  <circle cx="300" cy="238" r="5" fill="#f0c674"/>

  <!-- Lower Interface Lines -->
  <rect x="165" y="310" width="170" height="6" rx="3" fill="#6e57d2" opacity="0.6"/>
  <rect x="165" y="325" width="110" height="6" rx="3" fill="#3b335c"/>

  <!-- Outer Floating Badges -->
  <g transform="translate(80, 160)">
    <circle cx="30" cy="30" r="28" fill="#201b35" stroke="#8068e0" stroke-width="2"/>
    <path d="M 20 30 L 27 37 L 40 22" fill="none" stroke="#8068e0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(340, 280)">
    <circle cx="30" cy="30" r="28" fill="#201b35" stroke="#9a83f3" stroke-width="2"/>
    <text x="30" y="36" fill="#9a83f3" font-family="sans-serif" font-weight="bold" font-size="18" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <g transform="translate(320, 100)">
    <circle cx="25" cy="25" r="22" fill="url(#heroGrad2)"/>
    <polygon points="25,15 32,30 18,30" fill="#ffffff"/>
  </g>
</svg>