<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7" />
      <stop offset="100%" stop-color="#a29bfe" />
    </linearGradient>
    <linearGradient id="accentG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00CEC9" />
      <stop offset="100%" stop-color="#81ECEC" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f8f9fa" stop-opacity="0.8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6C5CE7" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background decorative elements -->
  <circle cx="250" cy="200" r="160" fill="url(#primaryG)" opacity="0.08" />
  <circle cx="400" cy="90" r="40" fill="url(#accentG)" opacity="0.2" />
  <circle cx="90" cy="310" r="25" fill="url(#primaryG)" opacity="0.2" />

  <!-- Abstract floating art elements -->
  <rect x="70" y="80" width="360" height="240" rx="16" fill="url(#cardBg)" filter="url(#shadow)" stroke="#E0E7FF" stroke-width="2" />

  <!-- Header Bar -->
  <rect x="70" y="80" width="360" height="40" rx="16" fill="#F1F5F9" />
  <circle cx="95" cy="100" r="6" fill="#FF7675" />
  <circle cx="115" cy="100" r="6" fill="#FDCB6E" />
  <circle cx="135" cy="100" r="6" fill="#55E6C1" />

  <!-- Code/Design Window Layout -->
  <rect x="100" y="140" width="140" height="150" rx="10" fill="#1E293B" />
  <line x1="115" y1="165" x2="175" y2="165" stroke="#6C5CE7" stroke-width="4" stroke-linecap="round" />
  <line x1="115" y1="185" x2="215" y2="185" stroke="#00CEC9" stroke-width="4" stroke-linecap="round" />
  <line x1="115" y1="205" x2="190" y2="205" stroke="#A855F7" stroke-width="4" stroke-linecap="round" />
  <line x1="115" y1="225" x2="160" y2="225" stroke="#64748B" stroke-width="4" stroke-linecap="round" />
  <line x1="115" y1="245" x2="200" y2="245" stroke="#00CEC9" stroke-width="4" stroke-linecap="round" />

  <!-- Creative Graphic Canvas -->
  <rect x="260" y="140" width="140" height="150" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" />
  <polygon points="330,160 380,240 280,240" fill="url(#primaryG)" opacity="0.8" />
  <circle cx="300" cy="180" r="18" fill="url(#accentG)" />

  <!-- Floating Tech Icons/Badges -->
  <g transform="translate(370, 60)" filter="url(#shadow)">
    <circle cx="20" cy="20" r="24" fill="#6C5CE7" />
    <path d="M12 20 L20 12 L28 20 L20 28 Z" fill="#FFFFFF" />
  </g>

  <g transform="translate(50, 220)" filter="url(#shadow)">
    <circle cx="20" cy="20" r="22" fill="#00CEC9" />
    <path d="M13 20 L27 20 M20 13 L20 27" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
