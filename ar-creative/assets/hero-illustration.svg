<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c5ce7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a29bfe" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#00cec9"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#4f46e5" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ambient Organic Blobs -->
  <path d="M420,130 C470,200 460,330 380,390 C300,450 180,430 110,380 C40,330 20,220 80,140 C140,60 370,60 420,130 Z" fill="url(#bgGrad)"/>

  <!-- Background Grid Nodes -->
  <g stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.3">
    <line x1="80" y1="90" x2="220" y2="70"/>
    <line x1="220" y1="70" x2="390" y2="110"/>
    <line x1="390" y1="110" x2="430" y2="260"/>
  </g>
  <circle cx="80" cy="90" r="4" fill="#6c5ce7"/>
  <circle cx="220" cy="70" r="4" fill="#00cec9"/>
  <circle cx="390" cy="110" r="4" fill="#fd79a8"/>
  <circle cx="430" cy="260" r="4" fill="#ffd166"/>

  <!-- Main Digital Workspace Canvas (Illustration) -->
  <g filter="url(#softShadow)">
    <!-- Monitor Base & Stand -->
    <path d="M210,360 L290,360 L275,320 L225,320 Z" fill="#cbd5e1"/>
    <rect x="180" y="360" width="140" height="12" rx="6" fill="#94a3b8"/>

    <!-- Monitor Bezel -->
    <rect x="80" y="110" width="340" height="215" rx="16" fill="#1e293b"/>
    <!-- Screen Area -->
    <rect x="90" y="120" width="320" height="190" rx="10" fill="url(#screenGrad)"/>

    <!-- Editor Bar -->
    <rect x="90" y="120" width="320" height="24" rx="6" fill="#0f172a"/>
    <circle cx="106" cy="132" r="3.5" fill="#ef4444"/>
    <circle cx="118" cy="132" r="3.5" fill="#eab308"/>
    <circle cx="130" cy="132" r="3.5" fill="#22c55e"/>
    <rect x="155" y="126" width="90" height="12" rx="4" fill="#334155"/>

    <!-- Creative Canvas Visual Content -->
    <!-- Wave Graph / Vector Path -->
    <path d="M110,240 C150,180 180,270 230,200 C280,130 330,260 380,180" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M110,240 C150,180 180,270 230,200 C280,130 330,260 380,180 L380,280 L110,280 Z" fill="url(#accentGrad)" opacity="0.1"/>

    <!-- Anchor points on path -->
    <circle cx="230" cy="200" r="5" fill="#ffffff" stroke="#6c5ce7" stroke-width="3"/>
    <circle cx="330" cy="225" r="5" fill="#ffffff" stroke="#00cec9" stroke-width="3"/>
    <line x1="210" y1="215" x2="250" y2="185" stroke="#a5b4fc" stroke-width="1.5"/>

    <!-- UI Component Blocks in Screen -->
    <rect x="110" y="160" width="70" height="14" rx="4" fill="#4338ca"/>
    <rect x="110" y="180" width="45" height="8" rx="3" fill="#6366f1" opacity="0.6"/>
    <rect x="110" y="193" width="55" height="8" rx="3" fill="#6366f1" opacity="0.4"/>
  </g>

  <!-- Floating Digital Art Card 1: Color Palette Tool -->
  <g filter="url(#softShadow)">
    <rect x="40" y="210" width="110" height="125" rx="14" fill="#ffffff"/>
    <rect x="52" y="222" width="50" height="10" rx="3" fill="#e2e8f0"/>
    <!-- Palette Swatches -->
    <circle cx="62" cy="255" r="12" fill="#6c5ce7"/>
    <circle cx="95" cy="255" r="12" fill="#00cec9"/>
    <circle cx="62" cy="290" r="12" fill="#fd79a8"/>
    <circle cx="95" cy="290" r="12" fill="#ffd166"/>
  </g>

  <!-- Floating Digital Art Card 2: Code & Education Badge -->
  <g filter="url(#softShadow)">
    <rect x="330" y="70" width="130" height="85" rx="14" fill="#ffffff"/>
    <rect x="345" y="85" width="28" height="28" rx="8" fill="#6c5ce7"/>
    <!-- Brackets Icon in Badge -->
    <path d="M356,94 L352,99 L356,104 M362,94 L366,99 L362,104" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="382" y="88" width="62" height="10" rx="3" fill="#0f172a"/>
    <rect x="382" y="103" width="45" height="8" rx="3" fill="#94a3b8"/>
    <rect x="345" y="125" width="99" height="14" rx="4" fill="#e0e7ff"/>
    <text x="355" y="135" font-family="sans-serif" font-size="8" font-weight="bold" fill="#4338ca">&lt;edukasi_tech/&gt;</text>
  </g>

  <!-- Floating Interactive Sparkles & Particles -->
  <g fill="#ffd166">
    <path d="M250,55 L253,65 L263,68 L253,71 L250,81 L247,71 L237,68 L247,65 Z"/>
    <path d="M70,160 L72,166 L78,168 L72,170 L70,176 L68,170 L62,168 L68,166 Z" fill="#6c5ce7"/>
    <path d="M430,340 L432,347 L439,349 L432,351 L430,358 L428,351 L421,349 L428,347 Z" fill="#00cec9"/>
  </g>
</svg>
