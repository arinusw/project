<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a29bfe" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#8c7ae6"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00CEC9"/>
      <stop offset="100%" stop-color="#81ECEC"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F8F9FA" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6C5CE7" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Decorative Circles -->
  <circle cx="300" cy="250" r="200" fill="url(#bg-grad)"/>
  <circle cx="450" cy="120" r="40" fill="#a29bfe" opacity="0.2"/>
  <circle cx="120" cy="380" r="60" fill="#81ECEC" opacity="0.2"/>

  <!-- Main Canvas Frame -->
  <rect x="100" y="80" width="400" height="280" rx="16" fill="#FFFFFF" filter="url(#shadow)"/>

  <!-- Window Header -->
  <rect x="100" y="80" width="400" height="36" rx="16" fill="#F1F3F5"/>
  <rect x="100" y="100" width="400" height="16" fill="#F1F3F5"/>
  <circle cx="124" cy="98" r="5" fill="#FF7675"/>
  <circle cx="140" cy="98" r="5" fill="#FFEAA7"/>
  <circle cx="156" cy="98" r="5" fill="#55E6C1"/>

  <!-- Creative Graphic Elements Inside Window -->
  <!-- Layer 1: Code/Design Blocks -->
  <rect x="130" y="132" width="160" height="18" rx="4" fill="#E9ECEF"/>
  <rect x="130" y="160" width="220" height="10" rx="3" fill="#6C5CE7" opacity="0.3"/>
  <rect x="130" y="178" width="180" height="10" rx="3" fill="#E9ECEF"/>

  <!-- Layer 2: Graphic Chart / Creative Analytics -->
  <path d="M 130 290 Q 200 210 270 250 T 410 180 T 470 210" fill="none" stroke="url(#primary-grad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 130 290 Q 200 210 270 250 T 410 180 T 470 210 L 470 310 L 130 310 Z" fill="url(#bg-grad)"/>

  <!-- Floating Elements -->
  <!-- Floating Card 1: UI Palette -->
  <g filter="url(#shadow)">
    <rect x="70" y="220" width="130" height="140" rx="12" fill="#FFFFFF"/>
    <circle cx="100" cy="250" r="12" fill="#6C5CE7"/>
    <circle cx="135" cy="250" r="12" fill="#00CEC9"/>
    <circle cx="170" cy="250" r="12" fill="#FF7675"/>
    <rect x="90" y="280" width="90" height="8" rx="4" fill="#E9ECEF"/>
    <rect x="90" y="298" width="60" height="8" rx="4" fill="#6C5CE7" opacity="0.4"/>
    <rect x="90" y="316" width="75" height="8" rx="4" fill="#E9ECEF"/>
  </g>

  <!-- Floating Card 2: Code / Rocket Badge -->
  <g filter="url(#shadow)">
    <rect x="380" y="260" width="150" height="120" rx="12" fill="#FFFFFF"/>
    <rect x="400" y="280" width="110" height="12" rx="6" fill="url(#accent-grad)"/>
    <rect x="400" y="304" width="80" height="8" rx="4" fill="#E9ECEF"/>
    <rect x="400" y="320" width="95" height="8" rx="4" fill="#E9ECEF"/>
    <rect x="400" y="336" width="50" height="8" rx="4" fill="#6C5CE7"/>
  </g>

  <!-- Star Sparks -->
  <path d="M 460 70 L 465 85 L 480 90 L 465 95 L 460 110 L 455 95 L 440 90 L 455 85 Z" fill="#FFEAA7"/>
  <path d="M 120 160 L 123 170 L 133 173 L 123 176 L 120 186 L 117 176 L 107 173 L 117 170 Z" fill="#6C5CE7" opacity="0.6"/>
</svg>