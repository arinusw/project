<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B61FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6344E7" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="heroGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38EF7D" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#11998E" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="heroGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF8E53" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B61FF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Glow -->
  <circle cx="300" cy="250" r="220" fill="url(#bgGlow)"/>

  <!-- Code / Design Canvas Window -->
  <rect x="100" y="80" width="400" height="280" rx="16" fill="#1E1E2E" filter="url(#shadow)" />
  <!-- Window Header -->
  <path d="M 100 96 A 16 16 0 0 1 116 80 L 484 80 A 16 16 0 0 1 500 96 L 500 120 L 100 120 Z" fill="#2A2A3C" />
  <circle cx="125" cy="100" r="6" fill="#FF5F56" />
  <circle cx="145" cy="100" r="6" fill="#FFBD2E" />
  <circle cx="165" cy="100" r="6" fill="#27C93F" />

  <!-- Code lines & Graphic elements -->
  <rect x="130" y="145" width="120" height="12" rx="6" fill="#7B61FF" />
  <rect x="130" y="170" width="200" height="10" rx="5" fill="#4B4B60" />
  <rect x="130" y="190" width="160" height="10" rx="5" fill="#4B4B60" />

  <!-- Digital Art Elements floating out -->
  <rect x="280" y="140" width="180" height="180" rx="12" fill="#252538" stroke="#7B61FF" stroke-width="2" />
  <circle cx="370" cy="200" r="40" fill="url(#heroGrad1)" filter="url(#shadow)" />
  <polygon points="340,290 370,230 400,290" fill="url(#heroGrad2)" />
  <circle cx="410" cy="170" r="15" fill="url(#heroGrad3)" />

  <!-- Floating Floating Cards / Badges -->
  <!-- Card 1: Creative -->
  <g transform="translate(60, 260)" filter="url(#shadow)">
    <rect x="0" y="0" width="150" height="70" rx="12" fill="#FFFFFF" opacity="0.95" />
    <circle cx="35" cy="35" r="18" fill="url(#heroGrad1)" />
    <!-- Brush Icon inside -->
    <path d="M30 38 l8 -8 a2 2 0 0 1 3 3 l-8 8 Z" stroke="#FFF" stroke-width="2" fill="none" />
    <rect x="62" y="25" width="65" height="8" rx="4" fill="#2A2A3C" />
    <rect x="62" y="39" width="45" height="6" rx="3" fill="#8E8EA0" />
  </g>

  <!-- Card 2: Education / Tech -->
  <g transform="translate(380, 310)" filter="url(#shadow)">
    <rect x="0" y="0" width="160" height="75" rx="12" fill="#FFFFFF" opacity="0.95" />
    <circle cx="35" cy="37" r="18" fill="url(#heroGrad2)" />
    <!-- Tech Icon -->
    <path d="M28 37 l5 5 l10 -10" stroke="#FFF" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <rect x="62" y="27" width="75" height="8" rx="4" fill="#2A2A3C" />
    <rect x="62" y="41" width="55" height="6" rx="3" fill="#8E8EA0" />
  </g>

  <!-- Floating Sparkles & Dots -->
  <circle cx="80" cy="120" r="4" fill="#7B61FF" opacity="0.8" />
  <circle cx="520" cy="100" r="6" fill="#FF8E53" opacity="0.8" />
  <circle cx="530" cy="260" r="5" fill="#38EF7D" opacity="0.8" />
  <path d="M 120 400 L 125 415 L 140 420 L 125 425 L 120 440 L 115 425 L 100 420 L 115 415 Z" fill="#7B61FF" opacity="0.6"/>
  <path d="M 480 60 L 483 70 L 493 73 L 483 76 L 480 86 L 477 76 L 467 73 L 477 70 Z" fill="#FFBD2E" opacity="0.7"/>
</svg>
