<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C69EF"/>
      <stop offset="100%" stop-color="#5843D8"/>
    </linearGradient>
    <linearGradient id="gradSecondary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7B9C"/>
      <stop offset="100%" stop-color="#FF9E79"/>
    </linearGradient>
    <linearGradient id="gradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#3A7BD5"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#5843D8" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Abstract Floating Bubbles -->
  <circle cx="100" cy="120" r="80" fill="url(#gradSecondary)" opacity="0.15" />
  <circle cx="500" cy="380" r="100" fill="url(#gradAccent)" opacity="0.12" />
  <circle cx="480" cy="100" r="40" fill="url(#gradPrimary)" opacity="0.2" />

  <!-- Main Canvas / Laptop Display Frame -->
  <rect x="80" y="80" width="440" height="300" rx="16" fill="#1E1E2E" filter="url(#dropShadow)"/>
  <rect x="95" y="95" width="410" height="270" rx="10" fill="#2A2A3D"/>

  <!-- Screen Header / UI Dots -->
  <circle cx="115" cy="112" r="5" fill="#FF5F56"/>
  <circle cx="130" cy="112" r="5" fill="#FFBD2E"/>
  <circle cx="145" cy="112" r="5" fill="#27C93F"/>

  <!-- UI Windows / Digital Art Elements -->
  <!-- Code / Tech Block -->
  <rect x="115" y="135" width="170" height="110" rx="8" fill="#181825"/>
  <rect x="130" y="155" width="80" height="8" rx="4" fill="#7C69EF"/>
  <rect x="130" y="172" width="120" height="6" rx="3" fill="#45475A"/>
  <rect x="130" y="186" width="90" height="6" rx="3" fill="#00D2FF"/>
  <rect x="130" y="200" width="110" height="6" rx="3" fill="#FF7B9C"/>

  <!-- Graphics / Design Card -->
  <rect x="300" y="135" width="180" height="190" rx="10" fill="#181825"/>
  <path d="M 320 280 Q 360 180 400 240 T 460 200" fill="none" stroke="url(#gradSecondary)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="360" cy="190" r="18" fill="url(#gradAccent)"/>
  <rect x="320" y="295" width="90" height="10" rx="5" fill="url(#gradPrimary)"/>

  <!-- Floating Creative Tools -->
  <!-- Stylus / Digital Pen -->
  <g transform="translate(420, 260) rotate(-45)">
    <rect x="0" y="0" width="16" height="100" rx="8" fill="url(#gradSecondary)"/>
    <polygon points="0,100 16,100 8,120" fill="#2A2A3D"/>
  </g>

  <!-- Laptop Base -->
  <path d="M 40 380 L 560 380 Q 570 380 560 395 L 530 405 L 70 405 L 40 395 Q 30 380 40 380 Z" fill="#11111B"/>
  <rect x="260" y="383" width="80" height="6" rx="3" fill="#45475A"/>

  <!-- Floating Glowing Geometric Icons -->
  <!-- Digital Bulb / Idea -->
  <g transform="translate(60, 220)" filter="url(#dropShadow)">
    <circle cx="30" cy="30" r="30" fill="url(#gradPrimary)"/>
    <path d="M 22 25 C 22 18, 38 18, 38 25 C 38 30, 32 32, 32 36 L 28 36 C 28 32, 22 30, 22 25 Z" fill="#FFF"/>
    <rect x="27" y="38" width="6" height="4" rx="1" fill="#FFF"/>
  </g>

  <!-- Palette / Creativity -->
  <g transform="translate(470, 60)">
    <circle cx="25" cy="25" r="25" fill="url(#gradAccent)"/>
    <circle cx="18" cy="18" r="4" fill="#FFF"/>
    <circle cx="30" cy="15" r="4" fill="#FF7B9C"/>
    <circle cx="33" cy="28" r="4" fill="#FFBD2E"/>
  </g>
</svg>
