<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7059e2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4a37b6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="heroGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8c77ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5642c5" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Glow Shapes -->
  <circle cx="250" cy="250" r="180" fill="url(#heroGrad2)" />
  <circle cx="350" cy="150" r="80" fill="#7059e2" opacity="0.15" filter="url(#glow)"/>
  <circle cx="150" cy="350" r="100" fill="#a08eff" opacity="0.1" filter="url(#glow)"/>

  <!-- Digital Tablet / Screen -->
  <rect x="90" y="120" width="320" height="230" rx="16" fill="#1e1e2d" stroke="#7059e2" stroke-width="4" filter="url(#glow)"/>
  <rect x="105" y="135" width="290" height="200" rx="8" fill="#13131d"/>

  <!-- Code & UI elements on screen -->
  <rect x="125" y="155" width="140" height="12" rx="4" fill="#7059e2"/>
  <rect x="125" y="175" width="200" height="8" rx="4" fill="#3f3d56"/>
  <rect x="125" y="190" width="160" height="8" rx="4" fill="#3f3d56"/>
  <rect x="125" y="205" width="180" height="8" rx="4" fill="#3f3d56"/>

  <circle cx="330" cy="175" r="25" fill="url(#heroGrad1)"/>
  <path d="M320 175 L328 183 L342 167" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- UI Cards -->
  <rect x="125" y="230" width="110" height="80" rx="8" fill="#252538" stroke="#7059e2" stroke-width="1.5"/>
  <circle cx="155" cy="260" r="14" fill="#7059e2" opacity="0.6"/>
  <rect x="140" y="285" width="70" height="6" rx="3" fill="#8c77ff"/>

  <rect x="250" y="230" width="125" height="80" rx="8" fill="#252538" stroke="#7059e2" stroke-width="1.5"/>
  <path d="M265 280 L285 250 L305 270 L325 240 L355 280 Z" fill="url(#heroGrad1)" opacity="0.7"/>

  <!-- Floating Creative elements -->
  <g transform="translate(60, 280)">
    <rect x="0" y="0" width="70" height="70" rx="14" fill="#7059e2" opacity="0.9"/>
    <path d="M20 45 L35 20 L50 45 Z" fill="#ffffff"/>
  </g>

  <g transform="translate(360, 90)">
    <circle cx="35" cy="35" r="35" fill="#8c77ff" opacity="0.8"/>
    <text x="35" y="42" font-family="Arial" font-weight="bold" font-size="22" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- Base Stand -->
  <path d="M200 350 L300 350 L320 400 L180 400 Z" fill="#2a2a3c"/>
  <rect x="160" y="400" width="180" height="10" rx="4" fill="#7059e2"/>
</svg>
