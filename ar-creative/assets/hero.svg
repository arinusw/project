<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:0.3" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#7C3AED" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background decorative shapes -->
  <circle cx="250" cy="250" r="200" fill="url(#grad2)" opacity="0.15" />
  <circle cx="380" cy="120" r="40" fill="#7C3AED" opacity="0.1" />
  <circle cx="100" cy="380" r="60" fill="#3B82F6" opacity="0.1" />

  <!-- Main Display Screen Frame -->
  <rect x="70" y="90" width="360" height="250" rx="16" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="70" y="90" width="360" height="35" rx="16" fill="#F3F4F6"/>
  <!-- Screen Header Dots -->
  <circle cx="95" cy="107" r="5" fill="#EF4444" />
  <circle cx="112" cy="107" r="5" fill="#F59E0B" />
  <circle cx="129" cy="107" r="5" fill="#10B981" />

  <!-- Code/Design Elements inside Screen -->
  <rect x="100" y="150" width="140" height="12" rx="6" fill="url(#grad1)" />
  <rect x="100" y="175" width="90" height="10" rx="5" fill="#E5E7EB" />
  <rect x="100" y="195" width="180" height="10" rx="5" fill="#E5E7EB" />
  <rect x="100" y="215" width="120" height="10" rx="5" fill="#E5E7EB" />

  <!-- Digital Art Floating Canvas Card -->
  <rect x="250" y="160" width="150" height="150" rx="12" fill="url(#grad1)" filter="url(#shadow)"/>
  <circle cx="325" cy="210" r="30" fill="#FFFFFF" opacity="0.2" />
  <path d="M 270 280 L 310 230 L 340 260 L 360 240 L 390 280 Z" fill="#FFFFFF" opacity="0.8" />
  <circle cx="360" cy="190" r="12" fill="#FBBF24" />

  <!-- Floating Palette / Tool Element -->
  <g transform="translate(60, 280)" filter="url(#shadow)">
    <rect x="0" y="0" width="160" height="110" rx="14" fill="#FFFFFF"/>
    <circle cx="35" cy="35" r="14" fill="#7C3AED"/>
    <circle cx="80" cy="35" r="14" fill="#3B82F6"/>
    <circle cx="125" cy="35" r="14" fill="#10B981"/>
    <rect x="20" y="65" width="120" height="8" rx="4" fill="#F3F4F6"/>
    <rect x="20" y="80" width="80" height="8" rx="4" fill="#F3F4F6"/>
  </g>

  <!-- Glowing Connection Dots/Nodes -->
  <circle cx="410" cy="310" r="8" fill="#7C3AED"/>
  <line x1="400" y1="280" x2="410" y2="310" stroke="#7C3AED" stroke-width="2" stroke-dasharray="4"/>
  <circle cx="390" cy="380" r="12" fill="#3B82F6"/>
  <line x1="410" y1="310" x2="390" y2="380" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4"/>
</svg>
