<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6249cd"/>
      <stop offset="100%" stop-color="#a893fd"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f0ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#382e66" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect x="40" y="30" width="420" height="340" rx="24" fill="#f8f6ff"/>
  <circle cx="400" cy="80" r="70" fill="#a893fd" opacity="0.2"/>
  <circle cx="100" cy="320" r="90" fill="#6249cd" opacity="0.15"/>

  <!-- Layered Creative Cards representing Studio / Solutions -->
  <!-- Card 1: Tech & Code -->
  <g transform="translate(70, 70)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="150" rx="16" fill="url(#cardGrad)"/>
    <rect x="20" y="20" width="40" height="40" rx="10" fill="#6249cd" opacity="0.15"/>
    <path d="M 35 33 L 28 40 L 35 47 M 45 33 L 52 40 L 45 47" stroke="#6249cd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="75" y="25" width="120" height="10" rx="5" fill="#322858"/>
    <rect x="75" y="45" width="80" height="8" rx="4" fill="#a893fd"/>
    <rect x="20" y="80" width="180" height="8" rx="4" fill="#e2d9fe"/>
    <rect x="20" y="100" width="140" height="8" rx="4" fill="#e2d9fe"/>
    <rect x="20" y="120" width="90" height="8" rx="4" fill="#6249cd"/>
  </g>

  <!-- Card 2: Digital Strategy & Creativity -->
  <g transform="translate(200, 170)" filter="url(#shadow)">
    <rect x="0" y="0" width="230" height="160" rx="16" fill="#6249cd"/>
    <!-- Abstract graphic on card -->
    <circle cx="170" cy="80" r="50" fill="#a893fd" opacity="0.3"/>
    <rect x="25" y="25" width="44" height="44" rx="12" fill="#ffffff" opacity="0.2"/>
    <path d="M47 37 L40 50 L54 50 Z" fill="#ffffff"/>
    <rect x="80" y="30" width="120" height="10" rx="5" fill="#ffffff"/>
    <rect x="80" y="50" width="80" height="8" rx="4" fill="#a893fd"/>

    <!-- Progress / Analytics Bars -->
    <rect x="25" y="115" width="20" height="25" rx="4" fill="#ffffff" opacity="0.4"/>
    <rect x="55" y="100" width="20" height="40" rx="4" fill="#ffffff" opacity="0.7"/>
    <rect x="85" y="90" width="20" height="50" rx="4" fill="#ffffff"/>
    <rect x="115" y="105" width="20" height="35" rx="4" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Connecting Nodes / Sparkles -->
  <circle cx="180" cy="240" r="8" fill="#ffbd2e"/>
  <line x1="180" y1="220" x2="200" y2="190" stroke="#7c66dc" stroke-width="2" stroke-dasharray="4 4"/>
</svg>
