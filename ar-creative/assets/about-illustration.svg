<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <linearGradient id="about-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C69EF"/>
      <stop offset="100%" stop-color="#5038ED"/>
    </linearGradient>
    <filter id="about-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#5038ED" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Decorative Shape -->
  <rect x="50" y="50" width="380" height="340" rx="30" fill="#F4F2FF"/>

  <!-- Studio Gear / Lightbulb Illustration -->
  <g transform="translate(100, 70)" filter="url(#about-shadow)">
    <!-- Central Device Base -->
    <rect x="20" y="40" width="260" height="260" rx="20" fill="#FFFFFF"/>

    <!-- Header bar -->
    <rect x="20" y="40" width="260" height="40" rx="20" fill="url(#about-grad)"/>
    <circle cx="45" cy="60" r="6" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="65" cy="60" r="6" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="85" cy="60" r="6" fill="#FFFFFF" opacity="0.3"/>

    <!-- Bulb Icon Idea -->
    <path d="M 150 130 C 130 130, 115 145, 115 165 C 115 180, 125 192, 135 200 L 135 215 L 165 215 L 165 200 C 175 192, 185 180, 185 165 C 185 145, 170 130, 150 130 Z" fill="none" stroke="url(#about-grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="138" y1="225" x2="162" y2="225" stroke="#7C69EF" stroke-width="5" stroke-linecap="round"/>

    <!-- Rays -->
    <line x1="150" y1="110" x2="150" y2="120" stroke="#7C69EF" stroke-width="4" stroke-linecap="round"/>
    <line x1="110" y1="150" x2="100" y2="145" stroke="#7C69EF" stroke-width="4" stroke-linecap="round"/>
    <line x1="190" y1="150" x2="200" y2="145" stroke="#7C69EF" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Floating Technology & Creative Badges -->
  <g filter="url(#about-shadow)">
    <rect x="30" y="240" width="120" height="50" rx="12" fill="#FFFFFF"/>
    <text x="50" y="270" font-family="sans-serif" font-size="14" font-weight="bold" fill="#5038ED">💡 Inovasi</text>

    <rect x="330" y="140" width="130" height="50" rx="12" fill="#FFFFFF"/>
    <text x="350" y="170" font-family="sans-serif" font-size="14" font-weight="bold" fill="#5038ED">🚀 Edukasi</text>
  </g>
</svg>
