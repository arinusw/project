      <stop offset="0%" stop-color="#6e57e0"/>
      <stop offset="100%" stop-color="#3a7bd5"/>
    </linearGradient>
    <filter id="shadow-about" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#6e57e0" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Decorative Background Shapes -->
  <rect x="60" y="50" width="380" height="300" rx="24" fill="#f8f9ff" />
