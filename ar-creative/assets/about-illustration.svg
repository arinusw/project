<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B61FF"/>
      <stop offset="100%" stop-color="#2D1B69"/>
    </linearGradient>
  </defs>

  <rect x="50" y="50" width="400" height="400" rx="20" fill="url(#aboutGrad)" opacity="0.1"/>

  <!-- Creative Bulb & Gears -->
  <g transform="translate(175, 100)">
    <!-- Light Bulb -->
    <path d="M 75 20 C 35 20 5 50 5 90 C 5 120 25 145 40 165 L 40 190 L 110 190 L 110 165 C 125 145 145 120 145 90 C 145 50 115 20 75 20 Z" fill="#7B61FF" opacity="0.8"/>
    <rect x="50" y="200" width="50" height="15" rx="5" fill="#89B4FA"/>
    <path d="M 60 215 L 90 215 L 85 230 L 65 230 Z" fill="#6C7086"/>

    <!-- Rays -->
    <line x1="75" y1="-5" x2="75" y2="10" stroke="#00F2FE" stroke-width="4" stroke-linecap="round"/>
    <line x1="15" y1="20" x2="25" y2="30" stroke="#00F2FE" stroke-width="4" stroke-linecap="round"/>
    <line x1="135" y1="20" x2="125" y2="30" stroke="#00F2FE" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Digital Studio Badges -->
  <rect x="80" y="320" width="150" height="90" rx="12" fill="#181825" stroke="#7B61FF" stroke-width="2"/>
  <text x="105" y="355" fill="#CDD6F4" font-family="sans-serif" font-weight="bold" font-size="14">Kreativitas</text>
  <text x="105" y="380" fill="#A6ADC8" font-family="sans-serif" font-size="12">Solusi Digital</text>

  <rect x="270" y="320" width="150" height="90" rx="12" fill="#181825" stroke="#00F2FE" stroke-width="2"/>
  <text x="295" y="355" fill="#CDD6F4" font-family="sans-serif" font-weight="bold" font-size="14">Teknologi</text>
  <text x="295" y="380" fill="#A6ADC8" font-family="sans-serif" font-size="12">Edukasi Lokal</text>
</svg>
