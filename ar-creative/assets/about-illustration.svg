<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C69EF"/>
      <stop offset="100%" stop-color="#3A7BD5"/>
    </linearGradient>
    <linearGradient id="aboutGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7B9C"/>
      <stop offset="100%" stop-color="#FFBD2E"/>
    </linearGradient>
  </defs>

  <!-- Abstract Background Shapes -->
  <rect x="50" y="40" width="400" height="320" rx="24" fill="#7C69EF" opacity="0.08"/>
  <circle cx="400" cy="80" r="60" fill="url(#aboutGrad2)" opacity="0.15"/>
  <circle cx="80" cy="320" r="50" fill="url(#aboutGrad1)" opacity="0.15"/>

  <!-- Main Composition Cards -->
  <!-- Back Card: Technology & Strategy -->
  <rect x="100" y="70" width="260" height="180" rx="16" fill="#1E1E2E" opacity="0.9"/>
  <rect x="120" y="95" width="100" height="10" rx="5" fill="#7C69EF"/>
  <rect x="120" y="115" width="180" height="8" rx="4" fill="#45475A"/>
  <rect x="120" y="130" width="140" height="8" rx="4" fill="#45475A"/>
  <rect x="120" y="160" width="60" height="24" rx="6" fill="#00D2FF"/>

  <!-- Front Card: Creative & Solution -->
  <rect x="160" y="140" width="250" height="190" rx="16" fill="#2A2A3D" stroke="#7C69EF" stroke-width="2"/>

  <!-- Interactive Analytics / Creative Bars -->
  <rect x="190" y="240" width="24" height="60" rx="6" fill="url(#aboutGrad1)"/>
  <rect x="225" y="210" width="24" height="90" rx="6" fill="url(#aboutGrad2)"/>
  <rect x="260" y="180" width="24" height="120" rx="6" fill="#00D2FF"/>
  <rect x="295" y="220" width="24" height="80" rx="6" fill="#7C69EF"/>

  <!-- Target / Goal Icon Graphic -->
  <circle cx="360" cy="190" r="28" fill="#181825"/>
  <circle cx="360" cy="190" r="18" fill="none" stroke="#FF7B9C" stroke-width="4"/>
  <circle cx="360" cy="190" r="8" fill="#FFBD2E"/>

  <!-- Decorative Orbit Dots -->
  <path d="M 60 200 Q 250 20 440 200" fill="none" stroke="#7C69EF" stroke-width="2" stroke-dasharray="6,6"/>
</svg>
