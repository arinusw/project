<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="about-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B61FF"/>
      <stop offset="100%" stop-color="#FF6584"/>
    </linearGradient>
    <linearGradient id="about-grad-2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#7B61FF"/>
    </linearGradient>
    <filter id="about-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect x="40" y="40" width="420" height="320" rx="24" fill="#1E1E28" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Decorative Gradient Circles -->
  <circle cx="120" cy="120" r="70" fill="url(#about-grad-1)" opacity="0.3" filter="url(#about-glow)"/>
  <circle cx="380" cy="280" r="80" fill="url(#about-grad-2)" opacity="0.25" filter="url(#about-glow)"/>

  <!-- Central Gear / Innovation Emblem -->
  <g transform="translate(250, 190)">
    <circle cx="0" cy="0" r="75" fill="none" stroke="url(#about-grad-1)" stroke-width="3" stroke-dasharray="8 6"/>
    <circle cx="0" cy="0" r="55" fill="rgba(123, 97, 255, 0.15)" stroke="#7B61FF" stroke-width="2"/>
    <circle cx="0" cy="0" r="30" fill="url(#about-grad-1)"/>
    <!-- Center Icon Symbol (Lightbulb / Tech Spark) -->
    <path d="M -8 -10 L 8 -10 L 12 5 L -12 5 Z M -6 10 L 6 10 M -3 15 L 3 15" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Floating Feature Badges -->
  <!-- 1. Creative Studio Node -->
  <g transform="translate(90, 90)">
    <rect x="0" y="0" width="120" height="70" rx="14" fill="#2A2A38" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <circle cx="30" cy="35" r="16" fill="rgba(255, 101, 132, 0.2)"/>
    <path d="M 24 35 C 24 29, 36 29, 36 35 C 36 41, 24 41, 24 35 Z" fill="none" stroke="#FF6584" stroke-width="2"/>
    <rect x="54" y="26" width="50" height="6" rx="3" fill="#ffffff"/>
    <rect x="54" y="38" width="35" height="5" rx="2.5" fill="#a0a0b0"/>
  </g>

  <!-- 2. Technology Node -->
  <g transform="translate(290, 80)">
    <rect x="0" y="0" width="130" height="70" rx="14" fill="#2A2A38" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <circle cx="30" cy="35" r="16" fill="rgba(0, 242, 254, 0.2)"/>
    <path d="M 24 30 L 36 35 L 24 40" stroke="#00F2FE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="54" y="26" width="55" height="6" rx="3" fill="#ffffff"/>
    <rect x="54" y="38" width="40" height="5" rx="2.5" fill="#a0a0b0"/>
  </g>

  <!-- 3. Education Node -->
  <g transform="translate(110, 250)">
    <rect x="0" y="0" width="130" height="70" rx="14" fill="#2A2A38" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <circle cx="30" cy="35" r="16" fill="rgba(123, 97, 255, 0.2)"/>
    <path d="M 22 33 L 30 28 L 38 33 L 30 38 Z M 25 36.5 L 25 41 C 25 43, 35 43, 35 41 L 35 36.5" stroke="#7B61FF" stroke-width="2" fill="none" stroke-linecap="round"/>
    <rect x="54" y="26" width="55" height="6" rx="3" fill="#ffffff"/>
    <rect x="54" y="38" width="38" height="5" rx="2.5" fill="#a0a0b0"/>
  </g>

  <!-- Connecting Lines between Nodes -->
  <path d="M 170 160 L 210 175 M 310 150 L 285 170 M 200 250 L 220 225" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="4 4"/>
</svg>