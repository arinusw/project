<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="about-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B61FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <circle cx="250" cy="250" r="190" fill="url(#about-grad)" opacity="0.12"/>

  <!-- Central Digital Screen / Creative Workspace -->
  <rect x="90" y="110" width="320" height="240" rx="20" fill="#1E1E2E" />
  <rect x="105" y="125" width="290" height="210" rx="14" fill="#0F172A" />

  <!-- Code & Graphic Design Elements inside screen -->
  <rect x="125" y="150" width="140" height="12" rx="6" fill="#38BDF8" opacity="0.8"/>
  <rect x="125" y="172" width="100" height="10" rx="5" fill="#7B61FF" opacity="0.7"/>
  <rect x="125" y="190" width="180" height="8" rx="4" fill="#64748B" opacity="0.5"/>

  <!-- Creative Gear & Bulb / Idea Symbol -->
  <g transform="translate(290, 180)">
    <circle cx="40" cy="40" r="45" fill="#7B61FF" opacity="0.2" filter="url(#glow)"/>
    <circle cx="40" cy="40" r="35" fill="#7B61FF"/>
    <path d="M40 20 C30 20 22 28 22 38 C22 45 27 50 30 55 L50 55 C53 50 58 45 58 38 C58 28 50 20 40 20 Z" fill="#FFFFFF"/>
    <rect x="33" y="58" width="14" height="6" rx="2" fill="#CBD5E1"/>
  </g>

  <!-- Floating Cards & Stats Badges -->
  <g transform="translate(60, 270)">
    <rect x="0" y="0" width="160" height="80" rx="14" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="35" cy="40" r="18" fill="#38BDF8" opacity="0.2"/>
    <path d="M30 40 L35 45 L45 33" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="65" y="28" width="70" height="10" rx="5" fill="#1E293B"/>
    <rect x="65" y="46" width="45" height="8" rx="4" fill="#94A3B8"/>
  </g>

  <!-- Decorative Orbiting Dots -->
  <circle cx="100" cy="90" r="10" fill="#7B61FF"/>
  <circle cx="410" cy="370" r="14" fill="#38BDF8"/>
  <circle cx="400" cy="100" r="6" fill="#F43F5E"/>
</svg>