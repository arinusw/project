  <circle cx="90" cy="310" r="50" fill="#00d2ff" opacity="0.1"/>

  <!-- Main Digital Studio Badge -->
  <rect x="100" y="80" width="300" height="240" rx="16" fill="#ffffff" filter="url(#shadow-about)"/>

