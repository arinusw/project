<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e57e0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6e57e0" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="shadowAbout" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#6e57e0" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="500" height="400" rx="24" fill="url(#aboutGrad)"/>

  <!-- Lightbulbs / Growth Art -->
  <g filter="url(#shadowAbout)" transform="translate(130, 60)">
    <!-- Main Lightbulb / Idea Symbol -->
    <path d="M 120 40 C 70 40 50 80 50 120 C 50 150 70 170 85 190 L 155 190 C 170 170 190 150 190 120 C 190 80 170 40 120 40 Z" fill="#ffffff" stroke="#e2dff8" stroke-width="3"/>

    <!-- Inner Flame / Spark -->
    <path d="M 120 70 A 30 30 0 0 1 150 100 C 150 130 120 150 120 150 C 120 150 90 130 90 100 A 30 30 0 0 1 120 70 Z" fill="#6e57e0"/>

    <!-- Base of Bulb -->
    <rect x="88" y="198" width="64" height="12" rx="3" fill="#a197f0"/>
    <rect x="94" y="214" width="52" height="10" rx="3" fill="#7f6ee3"/>
    <path d="M 104 228 L 136 228 L 128 238 L 112 238 Z" fill="#6e57e0"/>

    <!-- Light Rays -->
    <line x1="120" y1="15" x2="120" y2="25" stroke="#6e57e0" stroke-width="4" stroke-linecap="round"/>
    <line x1="35" y1="120" x2="25" y2="120" stroke="#6e57e0" stroke-width="4" stroke-linecap="round"/>
    <line x1="205" y1="120" x2="215" y2="120" stroke="#6e57e0" stroke-width="4" stroke-linecap="round"/>
    <line x1="60" y1="60" x2="50" y2="50" stroke="#6e57e0" stroke-width="4" stroke-linecap="round"/>
    <line x1="180" y1="60" x2="190" y2="50" stroke="#6e57e0" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Surrounding Badges / Targets -->
  <g filter="url(#shadowAbout)">
    <!-- Target Badge -->
    <circle cx="90" cy="280" r="45" fill="#ffffff"/>
    <circle cx="90" cy="280" r="32" fill="#6e57e0" opacity="0.15"/>
    <circle cx="90" cy="280" r="20" fill="#6e57e0"/>
    <circle cx="90" cy="280" r="8" fill="#ffffff"/>

    <!-- Gear / Solution Badge -->
    <circle cx="410" cy="260" r="40" fill="#ffffff"/>
    <path d="M 410 235 L 410 285 M 385 260 L 435 260 M 392 242 L 428 278 M 392 278 L 428 242" stroke="#6e57e0" stroke-width="8" stroke-linecap="round"/>
    <circle cx="410" cy="260" r="16" fill="#ffffff"/>
  </g>
</svg>
