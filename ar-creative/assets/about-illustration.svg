<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#8E7CF0"/>
    </linearGradient>
    <filter id="aboutShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#6C5CE7" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Decorative background circles -->
  <circle cx="250" cy="225" r="180" fill="#F4F3FF"/>
  <circle cx="250" cy="225" r="140" fill="#ECE9FE"/>

  <!-- Main Concept Card 1: Services & Products -->
  <g filter="url(#aboutShadow)" transform="translate(60, 60)">
    <rect x="0" y="0" width="220" height="150" rx="14" fill="#FFFFFF"/>
    <rect x="0" y="0" width="220" height="10" rx="5" fill="#6C5CE7"/>
    <circle cx="40" cy="45" r="18" fill="#EAE8FD"/>
    <path d="M 33 45 L 38 50 L 48 40" stroke="#6C5CE7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="70" y="35" width="120" height="10" rx="5" fill="#2D3436"/>
    <rect x="70" y="52" width="90" height="8" rx="4" fill="#B2BEC3"/>
    <rect x="20" y="80" width="180" height="1" fill="#DFE6E9"/>
    <rect x="20" y="95" width="150" height="8" rx="4" fill="#A29BFE"/>
    <rect x="20" y="112" width="110" height="8" rx="4" fill="#DFE6E9"/>
  </g>

  <!-- Main Concept Card 2: Technology Education -->
  <g filter="url(#aboutShadow)" transform="translate(220, 210)">
    <rect x="0" y="0" width="220" height="150" rx="14" fill="url(#aboutGrad)"/>
    <circle cx="45" cy="45" r="20" fill="#FFFFFF" fill-opacity="0.2"/>
    <!-- Mortarboard / Education Icon -->
    <path d="M 45 32 L 62 40 L 45 48 L 28 40 Z" fill="#FFFFFF"/>
    <path d="M 33 45 L 33 54 C 33 57 57 57 57 54 L 57 45" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <rect x="80" y="38" width="110" height="10" rx="5" fill="#FFFFFF"/>
    <rect x="80" y="54" width="75" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.7"/>
    <rect x="20" y="85" width="180" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.9"/>
    <rect x="20" y="102" width="140" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.6"/>
    <rect x="20" y="119" width="90" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.4"/>
  </g>

  <!-- Connecting Synergy Nodes -->
  <circle cx="160" cy="270" r="10" fill="#00CEC9"/>
  <circle cx="330" cy="150" r="8" fill="#FD79A8"/>
  <path d="M 170 270 Q 250 270 250 210" stroke="#00CEC9" stroke-width="3" stroke-dasharray="6,6" fill="none"/>
</svg>
