<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c5ce7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00d2d3" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="cubeGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7d5fff"/>
      <stop offset="100%" stop-color="#575fcf"/>
    </linearGradient>
    <linearGradient id="cubeGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a29bfe"/>
      <stop offset="100%" stop-color="#6c5ce7"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="250" cy="250" r="170" fill="url(#aboutGrad1)"/>

  <!-- Digital Geometry & Studio Composition -->
  <!-- Isometric studio blocks symbolizing creativity, technology, education -->

  <!-- Central Studio Portal / Diamond Grid -->
  <polygon points="250,90 380,170 380,330 250,410 120,330 120,170" fill="#1e1e2f" stroke="#6c5ce7" stroke-width="2" stroke-dasharray="6,6"/>
  <polygon points="250,110 360,180 360,320 250,390 140,320 140,180" fill="#ffffff" fill-opacity="0.04"/>

  <!-- Center Floating Isometric Cube (Creativity & Tech) -->
  <!-- Top Face -->
  <polygon points="250,170 310,205 250,240 190,205" fill="#a29bfe"/>
  <!-- Left Face -->
  <polygon points="190,205 250,240 250,310 190,275" fill="url(#cubeGrad1)"/>
  <!-- Right Face -->
  <polygon points="250,240 310,205 310,275 250,310" fill="url(#cubeGrad2)"/>

  <!-- Satellite Isometric Shapes (Services & Solutions) -->
  <!-- Left Satellite (Education / Knowledge) -->
  <g transform="translate(-10, -10)">
    <polygon points="150,280 190,300 150,320 110,300" fill="#00d2d3" opacity="0.8"/>
    <polygon points="110,300 150,320 150,360 110,340" fill="#0984e3" opacity="0.8"/>
    <polygon points="150,320 190,300 190,340 150,360" fill="#00cec9" opacity="0.8"/>
  </g>

  <!-- Right Satellite (Digital Products) -->
  <g transform="translate(10, 10)">
    <polygon points="350,130 390,150 350,170 310,150" fill="#ff7675" opacity="0.8"/>
    <polygon points="310,150 350,170 350,210 310,190" fill="#d63031" opacity="0.8"/>
    <polygon points="350,170 390,150 390,190 350,210" fill="#e17055" opacity="0.8"/>
  </g>

  <!-- Dynamic Connecting Network Nodes -->
  <circle cx="250" cy="170" r="5" fill="#ffffff"/>
  <circle cx="150" cy="280" r="5" fill="#ffffff"/>
  <circle cx="350" cy="130" r="5" fill="#ffffff"/>

  <line x1="250" y1="170" x2="350" y2="130" stroke="#a29bfe" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="190" y1="205" x2="150" y2="280" stroke="#00d2d3" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Studio Emblem Symbol -->
  <circle cx="250" cy="240" r="16" fill="#2d3436" stroke="#ffeaa7" stroke-width="2"/>
  <path d="M 244 246 L 250 234 L 256 246 Z" fill="#ffeaa7"/>
</svg>
