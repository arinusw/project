<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e57d2"/>
      <stop offset="100%" stop-color="#3b299a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a83f3"/>
      <stop offset="100%" stop-color="#8068e0"/>
    </linearGradient>
  </defs>

  <!-- Decorative Outer Layer -->
  <circle cx="250" cy="250" r="190" fill="none" stroke="#6e57d2" stroke-width="1.5" stroke-dasharray="10 10" opacity="0.3"/>

  <!-- Main Card Base -->
  <rect x="100" y="100" width="300" height="300" rx="24" fill="#1e1933" stroke="url(#aboutGrad)" stroke-width="2"/>

  <!-- Card Top Header Bar -->
  <path d="M 100, 124 A 24,24 0 0,1 124,100 L 376,100 A 24,24 0 0,1 400,124 L 400,140 L 100,140 Z" fill="#292244"/>
  <circle cx="125" cy="120" r="5" fill="#ff5f56"/>
  <circle cx="140" cy="120" r="5" fill="#ffbd2e"/>
  <circle cx="155" cy="120" r="5" fill="#27c93f"/>

  <!-- Left Column: Tech & Education Nodes -->
  <g transform="translate(130, 165)">
    <rect x="0" y="0" width="100" height="60" rx="10" fill="url(#aboutGrad)" opacity="0.8"/>
    <text x="50" y="35" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">SOLUSI</text>

    <!-- Node Connections -->
    <circle cx="50" cy="90" r="14" fill="#8068e0"/>
    <path d="M 50,60 L 50,76" stroke="#8068e0" stroke-width="3"/>

    <circle cx="20" cy="150" r="18" fill="#292244" stroke="#9a83f3" stroke-width="2"/>
    <path d="M 40,100 L 20,132" stroke="#8068e0" stroke-width="2"/>

    <circle cx="80" cy="150" r="18" fill="#292244" stroke="#9a83f3" stroke-width="2"/>
    <path d="M 60,100 L 80,132" stroke="#8068e0" stroke-width="2"/>
  </g>

  <!-- Right Column: Creative Output Representation -->
  <g transform="translate(250, 165)">
    <rect x="0" y="0" width="120" height="20" rx="6" fill="#3b315b"/>
    <rect x="0" y="30" width="90" height="12" rx="4" fill="#3b315b"/>

    <rect x="0" y="60" width="120" height="110" rx="12" fill="#251e3e" stroke="#6e57d2" stroke-width="1.5"/>
    <circle cx="60" cy="105" r="28" fill="url(#accentGrad)"/>
    <polygon points="55,93 72,105 55,117" fill="#ffffff"/>
    <rect x="20" y="148" width="80" height="8" rx="4" fill="#8068e0" opacity="0.7"/>
  </g>

  <!-- Floating Idea/Education Badge -->
  <g transform="translate(70, 310)">
    <circle cx="35" cy="35" r="30" fill="#2a2247" stroke="#8068e0" stroke-width="2"/>
    <path d="M 35 20 A 12 12 0 0 1 47 32 C 47 38 41 41 41 45 L 29 45 C 29 41 23 38 23 32 A 12 12 0 0 1 35 20 Z" fill="none" stroke="#f0c674" stroke-width="2.5"/>
    <rect x="32" y="47" width="6" height="4" fill="#f0c674"/>
  </g>
</svg>