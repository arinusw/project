<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C5CE7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cec9;stop-opacity:1" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00cec9" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Decorative Circles -->
  <circle cx="250" cy="250" r="170" fill="url(#aboutGrad)" opacity="0.1" />

  <!-- Laptop Base & Screen -->
  <rect x="110" y="140" width="280" height="190" rx="12" fill="#2d3436" filter="url(#softShadow)" />
  <rect x="122" y="152" width="256" height="166" rx="6" fill="#ffffff" />

  <!-- Content inside laptop screen -->
  <rect x="140" y="170" width="100" height="12" rx="6" fill="#6C5CE7" />
  <rect x="140" y="192" width="180" height="8" rx="4" fill="#dfe6e9" />
  <rect x="140" y="208" width="150" height="8" rx="4" fill="#dfe6e9" />
  <rect x="140" y="224" width="165" height="8" rx="4" fill="#dfe6e9" />

  <!-- Code/Design Graphic Blocks -->
  <rect x="140" y="245" width="60" height="50" rx="8" fill="#00cec9" opacity="0.8" />
  <rect x="210" y="245" width="60" height="50" rx="8" fill="#fd79a8" opacity="0.8" />
  <rect x="280" y="245" width="60" height="50" rx="8" fill="#fdcb6e" opacity="0.8" />

  <!-- Laptop Base Stand -->
  <path d="M 80 330 L 420 330 L 400 345 L 100 345 Z" fill="#b2bec3" />

  <!-- Lightbulb / Idea Icon Floating -->
  <circle cx="370" cy="120" r="30" fill="#ffeaa7" filter="url(#softShadow)" />
  <path d="M 370 102 C 360 102 352 110 352 120 C 352 127 357 132 361 136 L 379 136 C 383 132 388 127 388 120 C 388 110 380 102 370 102 Z" fill="#fdcb6e" />
  <rect x="364" y="138" width="12" height="6" rx="2" fill="#2d3436" />

  <!-- Rocket / Growth Icon Floating -->
  <circle cx="120" cy="120" r="28" fill="#a29bfe" filter="url(#softShadow)" />
  <path d="M 120 105 C 128 105 133 113 133 123 L 107 123 C 107 113 112 105 120 105 Z" fill="#ffffff" />
  <polygon points="107,123 120,135 133,123" fill="#ff7675" />
</svg>