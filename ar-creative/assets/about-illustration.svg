<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="about-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00CEC9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6C5CE7" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#a29bfe"/>
    </linearGradient>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00CEC9"/>
      <stop offset="100%" stop-color="#81ECEC"/>
    </linearGradient>
    <filter id="shadow-about" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background shapes -->
  <circle cx="300" cy="250" r="190" fill="url(#about-bg)"/>
  <rect x="180" y="80" width="240" height="240" rx="40" fill="#a29bfe" opacity="0.1" transform="rotate(15 300 200)"/>

  <!-- Central Lightbulb & Digital Idea Hub -->
  <g filter="url(#shadow-about)">
    <!-- Base Plate / Workspace -->
    <rect x="150" y="340" width="300" height="20" rx="10" fill="#E9ECEF"/>
    <rect x="200" y="320" width="200" height="25" rx="6" fill="#FFFFFF"/>

    <!-- Lightbulb SVG illustration -->
    <path d="M 300 120 C 240 120 220 170 220 210 C 220 245 245 270 260 290 L 340 290 C 355 270 380 245 380 210 C 380 170 360 120 300 120 Z" fill="#FFFFFF"/>
    <!-- Glow -->
    <path d="M 300 120 C 240 120 220 170 220 210 C 220 245 245 270 260 290 L 340 290 C 355 270 380 245 380 210 C 380 170 360 120 300 120 Z" fill="url(#grad-teal)" opacity="0.25"/>

    <!-- Bulb Base -->
    <rect x="265" y="295" width="70" height="10" rx="3" fill="#B2BEC3"/>
    <rect x="270" y="308" width="60" height="8" rx="3" fill="#636E72"/>
    <path d="M 285 316 L 315 316 L 300 326 Z" fill="#2D3436"/>

    <!-- Tech Nodes inside Bulb -->
    <circle cx="300" cy="180" r="16" fill="url(#grad-purple)"/>
    <circle cx="260" cy="220" r="12" fill="url(#grad-teal)"/>
    <circle cx="340" cy="220" r="12" fill="#FF7675"/>

    <!-- Lines connecting nodes -->
    <line x1="300" y1="180" x2="260" y2="220" stroke="#6C5CE7" stroke-width="3" stroke-dasharray="4 2"/>
    <line x1="300" y1="180" x2="340" y2="220" stroke="#6C5CE7" stroke-width="3" stroke-dasharray="4 2"/>
  </g>

  <!-- Surrounding Tech & Education Icons -->
  <!-- Gear Icon Floating -->
  <g transform="translate(100, 150)" filter="url(#shadow-about)">
    <circle cx="25" cy="25" r="25" fill="#FFFFFF"/>
    <circle cx="25" cy="25" r="14" fill="url(#grad-purple)"/>
  </g>

  <!-- Graduation Cap / Education Icon Floating -->
  <g transform="translate(440, 160)" filter="url(#shadow-about)">
    <circle cx="30" cy="30" r="30" fill="#FFFFFF"/>
    <polygon points="30,15 50,25 30,35 10,25" fill="#00CEC9"/>
    <rect x="20" y="32" width="20" height="10" rx="2" fill="#6C5CE7"/>
  </g>

  <!-- Digital Code Icon Floating -->
  <g transform="translate(110, 280)" filter="url(#shadow-about)">
    <rect x="0" y="0" width="60" height="50" rx="10" fill="#FFFFFF"/>
    <path d="M 18 20 L 10 25 L 18 30 M 42 20 L 50 25 L 42 30" stroke="#6C5CE7" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Creative Spark Floating -->
  <g transform="translate(430, 290)" filter="url(#shadow-about)">
    <rect x="0" y="0" width="55" height="55" rx="12" fill="url(#grad-purple)"/>
    <path d="M 27.5 12 L 30 23 L 41 27.5 L 30 32 L 27.5 43 L 25 32 L 14 27.5 L 25 23 Z" fill="#FFFFFF"/>
  </g>
</svg>