<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="about-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#725BDE" />
      <stop offset="100%" stop-color="#3A239B" />
    </linearGradient>
    <linearGradient id="light-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#FF9F1C" />
    </linearGradient>
    <filter id="shadow-about" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#725BDE" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Circle Arc -->
  <circle cx="250" cy="250" r="180" fill="#F4F2FF" />

  <!-- Bulb / Idea Base Structure -->
  <path d="M250,90 C180,90 140,140 140,210 C140,260 170,290 190,320 L210,360 L290,360 L310,320 C330,290 360,260 360,210 C360,140 320,90 250,90 Z" fill="url(#light-grad)" filter="url(#shadow-about)"/>

  <!-- Bulb Screw Base -->
  <rect x="210" y="365" width="80" height="12" rx="4" fill="#8D99AE"/>
  <rect x="220" y="380" width="60" height="10" rx="3" fill="#6C757D"/>
  <rect x="230" y="393" width="40" height="8" rx="2" fill="#495057"/>

  <!-- Inner Digital Gear & Code Icon inside Bulb -->
  <circle cx="250" cy="210" r="55" fill="#FFFFFF" opacity="0.9"/>
  <path d="M235,195 L215,210 L235,225" stroke="#725BDE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M265,195 L285,210 L265,225" stroke="#725BDE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="255" y1="190" x2="245" y2="230" stroke="#FF7B9C" stroke-width="5" stroke-linecap="round"/>

  <!-- Glowing Rays -->
  <line x1="250" y1="45" x2="250" y2="25" stroke="#FFD166" stroke-width="6" stroke-linecap="round"/>
  <line x1="130" y1="100" x2="110" y2="85" stroke="#FFD166" stroke-width="6" stroke-linecap="round"/>
  <line x1="370" y1="100" x2="390" y2="85" stroke="#FFD166" stroke-width="6" stroke-linecap="round"/>
  <line x1="80" y1="210" x2="60" y2="210" stroke="#FFD166" stroke-width="6" stroke-linecap="round"/>
  <line x1="420" y1="210" x2="440" y2="210" stroke="#FFD166" stroke-width="6" stroke-linecap="round"/>

  <!-- Creative Digital Floating Badges -->
  <rect x="70" y="280" width="110" height="50" rx="10" fill="#FFFFFF" filter="url(#shadow-about)"/>
  <circle cx="95" cy="305" r="12" fill="#725BDE"/>
  <rect x="115" y="297" width="50" height="6" rx="3" fill="#2B2D42"/>
  <rect x="115" y="307" width="35" height="6" rx="3" fill="#8D99AE"/>

  <rect x="320" y="280" width="110" height="50" rx="10" fill="#FFFFFF" filter="url(#shadow-about)"/>
  <circle cx="345" cy="305" r="12" fill="#FF7B9C"/>
  <rect x="365" y="297" width="50" height="6" rx="3" fill="#2B2D42"/>
  <rect x="365" y="307" width="35" height="6" rx="3" fill="#8D99AE"/>
</svg>
