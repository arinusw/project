<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B61FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <linearGradient id="aboutAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="100%" stop-color="#FF8E53" />
    </linearGradient>
    <filter id="aboutShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Central Studio Sphere & Connectors -->
  <circle cx="300" cy="250" r="180" fill="url(#aboutGrad)" opacity="0.1" />

  <!-- Main Illustration Base: Modern Creative Workstation Concept -->
  <rect x="140" y="120" width="320" height="220" rx="20" fill="#202231" filter="url(#aboutShadow)" />

  <!-- Screen Elements -->
  <rect x="160" y="140" width="280" height="180" rx="12" fill="#151621" />

  <!-- Creative Canvas & Nodes -->
  <circle cx="230" cy="210" r="30" fill="url(#aboutGrad)" filter="url(#aboutShadow)" />
  <circle cx="350" cy="210" r="24" fill="url(#aboutAccent)" filter="url(#aboutShadow)" />
  <circle cx="290" cy="270" r="20" fill="#38EF7D" filter="url(#aboutShadow)" />

  <!-- Connecting Lines (Representing Digital Solutions & Technology) -->
  <path d="M230 210 L350 210 L290 270 Z" stroke="#7B61FF" stroke-width="3" stroke-dasharray="6,6" fill="none" />

  <!-- Surrounding Service Badges -->
  <!-- Badge 1: Solusi Digital -->
  <g transform="translate(80, 100)" filter="url(#aboutShadow)">
    <rect x="0" y="0" width="130" height="50" rx="10" fill="#FFFFFF" />
    <circle cx="25" cy="25" r="12" fill="#7B61FF" />
    <rect x="45" y="18" width="65" height="6" rx="3" fill="#2A2A3C" />
    <rect x="45" y="28" width="45" height="5" rx="2.5" fill="#9090A0" />
  </g>

  <!-- Badge 2: Edukasi & Literasi -->
  <g transform="translate(390, 310)" filter="url(#aboutShadow)">
    <rect x="0" y="0" width="140" height="50" rx="10" fill="#FFFFFF" />
    <circle cx="25" cy="25" r="12" fill="#38EF7D" />
    <rect x="45" y="18" width="75" height="6" rx="3" fill="#2A2A3C" />
    <rect x="45" y="28" width="50" height="5" rx="2.5" fill="#9090A0" />
  </g>

  <!-- Decorative geometric accents -->
  <circle cx="100" cy="380" r="8" fill="#7B61FF" />
  <circle cx="480" cy="120" r="10" fill="#FF8E53" />
  <polygon points="500,220 515,245 485,245" fill="#00D2FF" opacity="0.8"/>
</svg>
