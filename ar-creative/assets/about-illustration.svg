<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c5dfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a1cba;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="250" cy="250" r="190" fill="none" stroke="#7c5dfa" stroke-width="2" stroke-dasharray="6 12" opacity="0.4"/>
  <circle cx="250" cy="250" r="160" fill="#7c5dfa" opacity="0.08"/>

  <!-- Center Hexagon Shield / Badge -->
  <polygon points="250,90 370,160 370,300 250,370 130,300 130,160" fill="url(#aboutGrad)"/>

  <!-- Inner Decorative Elements -->
  <polygon points="250,110 350,170 350,290 250,350 150,290 150,170" fill="#1e1e2d" opacity="0.9"/>

  <!-- Studio Gear & Creativity Icon -->
  <circle cx="250" cy="230" r="45" fill="#7c5dfa" opacity="0.2"/>
  <circle cx="250" cy="230" r="30" fill="none" stroke="#7c5dfa" stroke-width="4"/>

  <!-- Rays / Nodes -->
  <circle cx="250" cy="160" r="8" fill="#ffbd2e"/>
  <line x1="250" y1="168" x2="250" y2="200" stroke="#ffbd2e" stroke-width="3"/>

  <circle cx="310" cy="260" r="8" fill="#ff5f56"/>
  <line x1="303" y1="255" x2="276" y2="240" stroke="#ff5f56" stroke-width="3"/>

  <circle cx="190" cy="260" r="8" fill="#27c93f"/>
  <line x1="197" y1="255" x2="224" y2="240" stroke="#27c93f" stroke-width="3"/>

  <!-- Text / Code Representation Banner below -->
  <rect x="170" y="310" width="160" height="30" rx="15" fill="#7c5dfa"/>
  <text x="250" y="330" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">AR CREATIVE</text>
</svg>
