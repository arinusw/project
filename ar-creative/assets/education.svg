<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="eduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a70f6"/>
      <stop offset="100%" stop-color="#5037be"/>
    </linearGradient>
    <filter id="shadowEdu" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background decorative light circle -->
  <circle cx="250" cy="175" r="140" fill="#7352f7" opacity="0.08"/>

  <!-- Main Education Board / Screen -->
  <g filter="url(#shadowEdu)" transform="translate(100, 50)">
    <rect x="0" y="0" width="300" height="200" rx="18" fill="#1e1e2d"/>
    <rect x="10" y="10" width="280" height="180" rx="12" fill="#13131d"/>

    <!-- Code / Learning Visual Content -->
    <!-- Code Editor Header -->
    <rect x="10" y="10" width="280" height="22" rx="12" fill="#282838"/>
    <circle cx="25" cy="21" r="3.5" fill="#ff5f56"/>
    <circle cx="35" cy="21" r="3.5" fill="#ffbd2e"/>
    <circle cx="45" cy="21" r="3.5" fill="#27c93f"/>
    <text x="150" y="25" fill="#8d8d9d" font-family="sans-serif" font-size="10" text-anchor="middle">edukasi-teknologi.js</text>

    <!-- Code lines -->
    <text x="25" y="55" fill="#9a80f9" font-family="monospace" font-size="11" font-weight="bold">// Ar Creative Edukasi</text>
    <text x="25" y="75" fill="#ff79c6" font-family="monospace" font-size="11">function <tspan fill="#50fa7b">bagikanIlmu</tspan>() {</text>
    <text x="40" y="95" fill="#f1fa8c" font-family="monospace" font-size="11">const <tspan fill="#8be9fd">kreativitas</tspan> = <tspan fill="#bd93f9">true</tspan>;</text>
    <text x="40" y="115" fill="#f1fa8c" font-family="monospace" font-size="11">const <tspan fill="#8be9fd">literasiDigital</tspan> = <tspan fill="#bd93f9">100</tspan>;</text>
    <text x="40" y="135" fill="#ff79c6" font-family="monospace" font-size="11">return <tspan fill="#f1fa8c">"Masa Depan Digital"</tspan>;</text>
    <text x="25" y="155" fill="#ff79c6" font-family="monospace" font-size="11">}</text>
  </g>

  <!-- Graduation Cap / Knowledge Badge -->
  <g filter="url(#shadowEdu)" transform="translate(60, 180)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#eduGrad)"/>
    <!-- Mortarboard Icon -->
    <path d="M 18 36 L 40 25 L 62 36 L 40 47 Z" fill="#ffffff"/>
    <path d="M 26 43.5 V 55 C 26 58 32 61 40 61 C 48 61 54 58 54 55 V 43.5" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M 58 38 V 52" stroke="#f1fa8c" stroke-width="2"/>
    <circle cx="58" cy="54" r="2" fill="#f1fa8c"/>
  </g>

  <!-- Community / Sharing Badge -->
  <g filter="url(#shadowEdu)" transform="translate(350, 80)">
    <circle cx="35" cy="35" r="35" fill="#ffffff"/>
    <circle cx="35" cy="28" r="10" fill="#7352f7"/>
    <path d="M 18 52 C 18 43 25 39 35 39 C 45 39 52 43 52 52" fill="none" stroke="#7352f7" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
