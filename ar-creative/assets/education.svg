<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="eduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7059e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3c24b3;stop-opacity:1" />
    </linearGradient>
    <filter id="shadowEdu" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7059e2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Outer Circle Background -->
  <circle cx="250" cy="250" r="190" fill="#f4f1ff" />
  <circle cx="250" cy="250" r="140" fill="#e8e3ff" />

  <!-- Graduation Cap / Knowledge Icon -->
  <g transform="translate(130, 110)" filter="url(#shadowEdu)">
    <polygon points="120,20 230,70 120,120 10,70" fill="url(#eduGrad)" />
    <polygon points="120,120 200,82 200,130 120,170 40,130 40,82" fill="#5338d1" />

    <!-- Tassel -->
    <path d="M200 75 L220 120 L220 150" stroke="#ffb703" stroke-width="4" fill="none" stroke-linecap="round" />
    <circle cx="220" cy="155" r="8" fill="#ffb703" />
  </g>

  <!-- Open Digital Book / Tablet -->
  <g transform="translate(110, 270)" filter="url(#shadowEdu)">
    <rect x="0" y="0" width="280" height="150" rx="16" fill="#ffffff" />

    <!-- Left Page / Screen -->
    <rect x="25" y="25" width="105" height="100" rx="8" fill="#f8f7ff" />
    <rect x="35" y="40" width="70" height="8" rx="4" fill="#7059e2" />
    <rect x="35" y="58" width="85" height="6" rx="3" fill="#c3b8ff" />
    <rect x="35" y="72" width="60" height="6" rx="3" fill="#c3b8ff" />
    <rect x="35" y="86" width="75" height="6" rx="3" fill="#c3b8ff" />

    <!-- Divider -->
    <line x1="140" y1="20" x2="140" y2="130" stroke="#e8e3ff" stroke-width="2" />

    <!-- Right Page / Screen -->
    <rect x="150" y="25" width="105" height="100" rx="8" fill="#f8f7ff" />
    <circle cx="202" cy="55" r="18" fill="#7059e2" />
    <polygon points="197,48 212,55 197,62" fill="#ffffff" />
    <rect x="165" y="86" width="75" height="6" rx="3" fill="#a595ff" />
    <rect x="175" y="100" width="55" height="6" rx="3" fill="#c3b8ff" />
  </g>
</svg>