<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="eduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00cec9" />
      <stop offset="100%" stop-color="#6C5CE7" />
    </linearGradient>
    <filter id="eduShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00cec9" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Glowing Circles -->
  <circle cx="300" cy="250" r="180" fill="url(#eduGrad)" opacity="0.1" />
  <circle cx="150" cy="120" r="50" fill="#6C5CE7" opacity="0.2" />
  <circle cx="450" cy="380" r="70" fill="#00cec9" opacity="0.2" />

  <!-- Graduation / Digital Book Concept -->
  <g filter="url(#eduShadow)" transform="translate(150, 100)">
    <!-- Open Book / Screen Base -->
    <rect x="20" y="80" width="260" height="180" rx="16" fill="#1e1e2d" />
    <path d="M 20,100 L 150,150 L 280,100 L 280,240 L 150,260 L 20,240 Z" fill="#2d2d42" opacity="0.8" />

    <!-- Code Lines on Book Pages -->
    <line x1="50" y1="140" x2="120" y2="155" stroke="#6C5CE7" stroke-width="4" stroke-linecap="round" />
    <line x1="50" y1="165" x2="100" y2="178" stroke="#a29bfe" stroke-width="4" stroke-linecap="round" />
    <line x1="50" y1="190" x2="115" y2="202" stroke="#a29bfe" stroke-width="4" stroke-linecap="round" />

    <line x1="180" y1="155" x2="250" y2="140" stroke="#00cec9" stroke-width="4" stroke-linecap="round" />
    <line x1="200" y1="178" x2="250" y2="165" stroke="#81ecec" stroke-width="4" stroke-linecap="round" />
    <line x1="185" y1="202" x2="250" y2="190" stroke="#81ecec" stroke-width="4" stroke-linecap="round" />

    <!-- Lightbulb / Idea Icon Floating Above -->
    <g transform="translate(120, -20)">
      <circle cx="30" cy="30" r="35" fill="url(#eduGrad)" />
      <path d="M 30,12 C 20,12 12,20 12,30 C 12,37 16,42 21,46 L 21,52 C 21,54 23,56 25,56 L 35,56 C 37,56 39,54 39,52 L 39,46 C 44,42 48,37 48,30 C 48,20 40,12 30,12 Z" fill="#ffffff" />
      <rect x="25" y="58" width="10" height="3" rx="1.5" fill="#ffffff" />
    </g>
  </g>

  <!-- Community Connection Nodes -->
  <g stroke="#6C5CE7" stroke-width="2" opacity="0.6">
    <line x1="100" x2="170" y1="350" y2="280" stroke-dasharray="4,4" />
    <line x1="500" x2="430" y1="350" y2="280" stroke-dasharray="4,4" />
  </g>

  <circle cx="100" cy="350" r="20" fill="#6C5CE7" filter="url(#eduShadow)" />
  <circle cx="500" cy="350" r="20" fill="#00cec9" filter="url(#eduShadow)" />
</svg>