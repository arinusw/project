<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="eduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(250, 69%, 61%)" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="hsl(250, 69%, 61%)" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Backdrop -->
  <circle cx="250" cy="200" r="150" fill="url(#eduGrad)"/>

  <!-- Laptop with Interactive Learning Material -->
  <rect x="120" y="110" width="260" height="170" rx="10" fill="#2B2C34"/>
  <rect x="130" y="120" width="240" height="150" rx="6" fill="#FFFFFF"/>
  <path d="M80 280 L420 280 L400 295 L100 295 Z" fill="#3D3B54"/>

  <!-- Code / Article Layout on Laptop Screen -->
  <rect x="150" y="140" width="120" height="12" rx="4" fill="hsl(250, 69%, 61%)"/>
  <rect x="150" y="160" width="200" height="6" rx="3" fill="#E2DFEE"/>
  <rect x="150" y="172" width="180" height="6" rx="3" fill="#E2DFEE"/>
  <rect x="150" y="184" width="160" height="6" rx="3" fill="#E2DFEE"/>

  <!-- Code Block Overlay -->
  <rect x="150" y="200" width="200" height="50" rx="6" fill="#1E1E2C"/>
  <text x="160" y="220" font-family="monospace" font-size="10" fill="#6C5CE7">&lt;code&gt;</text>
  <text x="175" y="235" font-family="monospace" font-size="10" fill="#27C93F">learnDigitalTech();</text>
  <text x="160" y="245" font-family="monospace" font-size="10" fill="#6C5CE7">&lt;/code&gt;</text>

  <!-- Graduation / Knowledge Badge Floating -->
  <g transform="translate(330, 80)">
    <circle cx="30" cy="30" r="30" fill="hsl(250, 69%, 61%)"/>
    <path d="M30 18 L46 25 L30 32 L14 25 Z" fill="#FFFFFF"/>
    <path d="M20 29 L20 37 C20 39 25 41 30 41 C35 41 40 39 40 37 L40 29" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Community Certificate Badge -->
  <g transform="translate(70, 200)">
    <rect width="70" height="80" rx="8" fill="#FFFFFF" stroke="hsl(250, 69%, 61%)" stroke-width="2"/>
    <rect x="10" y="12" width="50" height="6" rx="3" fill="hsl(250, 69%, 61%)"/>
    <rect x="10" y="24" width="40" height="4" rx="2" fill="#E2DFEE"/>
    <rect x="10" y="32" width="35" height="4" rx="2" fill="#E2DFEE"/>
    <circle cx="35" cy="55" r="10" fill="hsl(250, 69%, 61%)" opacity="0.3"/>
    <polygon points="35,48 38,55 45,55 39,59 41,66 35,62 29,66 31,59 25,55 32,55" fill="hsl(250, 69%, 61%)"/>
  </g>
</svg>
