<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="eduGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00cec9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6c5ce7" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="bulbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="100%" stop-color="#fdcb6e"/>
    </linearGradient>
  </defs>

  <!-- Ambient Backdrop -->
  <circle cx="250" cy="250" r="180" fill="url(#eduGrad1)"/>

  <!-- Knowledge Book Platform -->
  <path d="M 140 330 C 190 320, 240 335, 250 340 C 260 335, 310 320, 360 330 L 360 365 C 310 355, 260 370, 250 375 C 240 370, 190 355, 140 365 Z" fill="#2d3436" stroke="#6c5ce7" stroke-width="2"/>
  <path d="M 140 320 C 190 310, 240 325, 250 330 C 260 325, 310 310, 360 320 L 360 330 C 310 320, 260 335, 250 340 C 240 335, 190 320, 140 330 Z" fill="#6c5ce7" opacity="0.6"/>
  <path d="M 140 310 C 190 300, 240 315, 250 320 C 260 315, 310 300, 360 310 L 360 320 C 310 310, 260 325, 250 330 C 240 315, 190 300, 140 310 Z" fill="#ffffff" fill-opacity="0.9"/>

  <!-- Spine line -->
  <line x1="250" y1="320" x2="250" y2="375" stroke="#7d5fff" stroke-width="2"/>

  <!-- Rising Rays / Tech Particles -->
  <path d="M 190 280 L 170 240" stroke="#00cec9" stroke-width="2" stroke-linecap="round" stroke-dasharray="4,4"/>
  <path d="M 220 270 L 210 220" stroke="#7d5fff" stroke-width="2" stroke-linecap="round"/>
  <path d="M 280 270 L 290 220" stroke="#7d5fff" stroke-width="2" stroke-linecap="round"/>
  <path d="M 310 280 L 330 240" stroke="#ff7675" stroke-width="2" stroke-linecap="round" stroke-dasharray="4,4"/>

  <!-- Glowing Digital Lightbulb (Symbol of Learning & Innovation) -->
  <!-- Filament / Glow circle -->
  <circle cx="250" cy="180" r="55" fill="url(#bulbGrad)" opacity="0.9"/>
  <circle cx="250" cy="180" r="70" fill="#ffeaa7" opacity="0.2"/>

  <!-- Bulb Base -->
  <rect x="235" y="235" width="30" height="8" rx="2" fill="#b2bec3"/>
  <rect x="238" y="245" width="24" height="6" rx="2" fill="#b2bec3"/>
  <path d="M 242 251 L 258 251 L 254 256 L 246 256 Z" fill="#636e72"/>

  <!-- Inner Filament Graphic: Circuit Brain or Spark -->
  <path d="M 240 185 L 245 170 L 255 170 L 260 185" fill="none" stroke="#d63031" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="245" cy="170" r="2.5" fill="#d63031"/>
  <circle cx="255" cy="170" r="2.5" fill="#d63031"/>

  <!-- Digital Education Elements (Floating Badges) -->
  <!-- Code Badge -->
  <g transform="translate(110, 150)">
    <rect width="60" height="34" rx="8" fill="#1e1e2f" stroke="#a29bfe" stroke-width="1.5"/>
    <text x="30" y="22" font-family="monospace" font-size="13" font-weight="bold" fill="#00d2d3" text-anchor="middle">&lt;Edu/&gt;</text>
  </g>

  <!-- Community / Growth Badge -->
  <g transform="translate(330, 160)">
    <rect width="60" height="34" rx="8" fill="#1e1e2f" stroke="#00cec9" stroke-width="1.5"/>
    <text x="30" y="22" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffeaa7" text-anchor="middle">★ KREASI</text>
  </g>
</svg>
