<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <linearGradient id="eduBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fd79a8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6c5ce7" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="eduShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="250" cy="225" r="180" fill="url(#eduBg)"/>

  <!-- Knowledge Tree / Digital Branches -->
  <g stroke="#cbd5e1" stroke-width="2" stroke-linecap="round">
    <line x1="250" y1="280" x2="250" y2="160"/>
    <line x1="250" y1="200" x2="180" y2="150"/>
    <line x1="250" y1="180" x2="320" y2="130"/>
    <line x1="180" y1="150" x2="130" y2="170"/>
    <line x1="320" y1="130" x2="370" y2="150"/>
  </g>

  <!-- Big Open Knowledge Book / Digital Tablet -->
  <g filter="url(#eduShadow)">
    <!-- Base Book Spine & Pages -->
    <path d="M140,290 C190,300 240,305 250,310 C260,305 310,300 360,290 L370,220 C320,230 260,235 250,240 C240,235 180,230 130,220 Z" fill="#ffffff"/>
    <path d="M140,290 C190,300 240,305 250,310 L250,325 C240,320 190,315 140,305 Z" fill="#e2e8f0"/>
    <path d="M360,290 C310,300 260,305 250,310 L250,325 C260,320 310,315 360,305 Z" fill="#cbd5e1"/>
    <!-- Page lines -->
    <path d="M160,250 C190,255 220,258 240,260" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <path d="M160,265 C190,270 220,273 240,275" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <path d="M260,260 C280,258 310,255 340,250" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <path d="M260,275 C280,273 310,270 340,265" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Floating Digital Knowledge Badges -->
  <!-- 1. Code Badge -->
  <g filter="url(#eduShadow)">
    <rect x="110" y="100" width="80" height="60" rx="10" fill="#ffffff"/>
    <rect x="120" y="112" width="60" height="10" rx="3" fill="#e0e7ff"/>
    <text x="126" y="120" font-family="monospace" font-size="8" font-weight="bold" fill="#4338ca">&lt;code/&gt;</text>
    <rect x="120" y="130" width="40" height="6" rx="2" fill="#94a3b8"/>
    <rect x="120" y="142" width="50" height="6" rx="2" fill="#cbd5e1"/>
  </g>

  <!-- 2. Community & Mentoring Badge (Center Top) -->
  <g filter="url(#eduShadow)">
    <circle cx="250" cy="90" r="32" fill="#ffffff"/>
    <circle cx="250" cy="90" r="26" fill="url(#bookCover)"/>
    <!-- Lightbulb & Gear -->
    <path d="M250,78 C244,78 239,83 239,89 C239,93 242,96 244,98 L244,101 L256,101 L256,98 C258,96 261,93 261,89 C261,83 256,78 250,78 Z" fill="#ffd166"/>
  </g>

  <!-- 3. Local Creativity Badge (Right) -->
  <g filter="url(#eduShadow)">
    <rect x="310" y="110" width="85" height="65" rx="10" fill="#ffffff"/>
    <circle cx="335" cy="132" r="10" fill="#00cec9"/>
    <circle cx="365" cy="132" r="8" fill="#fd79a8"/>
    <rect x="322" y="152" width="60" height="8" rx="3" fill="#e2e8f0"/>
  </g>

  <!-- Floating Sparkles -->
  <g fill="#6c5ce7">
    <polygon points="210,60 213,67 220,70 213,73 210,80 207,73 200,70 207,67"/>
    <polygon points="295,65 297,71 303,73 297,75 295,81 293,75 287,73 293,71" fill="#00cec9"/>
  </g>
</svg>
