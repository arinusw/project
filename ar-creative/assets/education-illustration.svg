<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="eduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b894;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0984e3;stop-opacity:1" />
    </linearGradient>
    <filter id="eduShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0984e3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="250" cy="250" r="170" fill="url(#eduGrad)" opacity="0.1" />

  <!-- Stacked Books -->
  <rect x="130" y="310" width="240" height="35" rx="6" fill="#0984e3" filter="url(#eduShadow)" />
  <rect x="150" y="315" width="210" height="25" fill="#ffffff" opacity="0.9" />

  <rect x="150" y="270" width="200" height="35" rx="6" fill="#00b894" filter="url(#eduShadow)" />
  <rect x="170" y="275" width="170" height="25" fill="#ffffff" opacity="0.9" />

  <rect x="170" y="230" width="160" height="35" rx="6" fill="#6C5CE7" filter="url(#eduShadow)" />
  <rect x="185" y="235" width="135" height="25" fill="#ffffff" opacity="0.9" />

  <!-- Graduation Cap / Digital Knowledge Symbol Floating -->
  <g transform="translate(250, 140)">
    <polygon points="0,-40 70,-10 0,20 -70,-10" fill="#2d3436" filter="url(#eduShadow)" />
    <polygon points="0,-30 50,-8 0,14 -50,-8" fill="#0984e3" />
    <rect x="-30" y="8" width="60" height="30" rx="4" fill="#2d3436" />
    <path d="M 50,-8 L 50,30 L 45,35 L 45,30 Z" fill="#fdcb6e" stroke="#fdcb6e" stroke-width="3" />
    <circle cx="50" cy="38" r="6" fill="#fdcb6e" />
  </g>

  <!-- Digital Code Badges -->
  <g transform="translate(110, 160)">
    <rect x="0" y="0" width="70" height="35" rx="10" fill="#fd79a8" filter="url(#eduShadow)" />
    <text x="35" y="22" font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <g transform="translate(320, 170)">
    <rect x="0" y="0" width="70" height="35" rx="10" fill="#fdcb6e" filter="url(#eduShadow)" />
    <text x="35" y="23" font-family="sans-serif" font-weight="bold" font-size="16" fill="#ffffff" text-anchor="middle">AI</text>
  </g>
</svg>