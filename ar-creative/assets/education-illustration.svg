<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="eduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e57e0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6e57e0" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="shadowEdu" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#6e57e0" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="500" height="400" rx="24" fill="url(#eduGrad)"/>

  <!-- Main Open Book & Graduation Concept -->
  <g filter="url(#shadowEdu)" transform="translate(80, 80)">
    <!-- Book Base -->
    <path d="M 30 180 Q 170 160 170 240 Q 170 160 310 180 L 310 80 Q 170 60 170 140 Q 170 60 30 80 Z" fill="#ffffff" stroke="#e2dff8" stroke-width="3"/>
    <path d="M 170 140 L 170 240" stroke="#6e57e0" stroke-width="3" stroke-dasharray="4,4"/>

    <!-- Digital Code/Content on Book Pages -->
    <line x1="60" y1="105" x2="140" y2="98" stroke="#6e57e0" stroke-width="4" stroke-linecap="round"/>
    <line x1="60" y1="125" x2="120" y2="118" stroke="#a197f0" stroke-width="4" stroke-linecap="round"/>
    <line x1="60" y1="145" x2="135" y2="138" stroke="#a197f0" stroke-width="4" stroke-linecap="round"/>

    <line x1="200" y1="98" x2="280" y2="105" stroke="#6e57e0" stroke-width="4" stroke-linecap="round"/>
    <line x1="200" y1="118" x2="260" y2="125" stroke="#a197f0" stroke-width="4" stroke-linecap="round"/>
    <line x1="200" y1="138" x2="275" y2="145" stroke="#a197f0" stroke-width="4" stroke-linecap="round"/>

    <!-- Graduation Cap / Knowledge Cap -->
    <path d="M 170 10 L 250 45 L 170 80 L 90 45 Z" fill="#6e57e0"/>
    <rect x="130" y="60" width="80" height="25" fill="#5a43cd" rx="4"/>
    <path d="M 230 50 L 250 85 L 245 110 L 235 110 L 230 85 Z" fill="#ffbd2e"/>
    <circle cx="240" cy="112" r="6" fill="#ffbd2e"/>
  </g>

  <!-- Community Certificate / Digital Badge Floating -->
  <g filter="url(#shadowEdu)">
    <rect x="330" y="220" width="110" height="85" rx="10" fill="#ffffff"/>
    <rect x="345" y="235" width="80" height="8" rx="2" fill="#6e57e0"/>
    <rect x="345" y="250" width="55" height="6" rx="2" fill="#a197f0"/>
    <circle cx="395" cy="280" r="12" fill="#27c93f"/>
    <path d="M 390 280 L 394 284 L 401 276" stroke="#ffffff" stroke-width="2" fill="none"/>
  </g>
</svg>
