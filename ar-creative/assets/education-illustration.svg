<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="eduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00cec9"/>
      <stop offset="100%" stop-color="#0984e3"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74b9ff"/>
      <stop offset="100%" stop-color="#0984e3"/>
    </linearGradient>
  </defs>

  <!-- Ambient light -->
  <circle cx="250" cy="220" r="180" fill="url(#eduGrad)" opacity="0.12"/>

  <!-- Open Book Base -->
  <path d="M120 340 C180 320 220 330 250 350 C280 330 320 320 380 340 L380 360 C320 340 280 350 250 370 C220 350 180 340 120 360 Z" fill="#2d3436"/>
  <path d="M125 330 C180 310 220 320 250 340 C280 320 320 310 375 330 L375 345 C320 325 280 335 250 355 C220 335 180 325 125 345 Z" fill="#636e72"/>

  <!-- Holographic / Digital Light Rays rising from book -->
  <polygon points="150,320 250,140 350,320" fill="url(#eduGrad)" opacity="0.2"/>

  <!-- Floating Digital Light Bulb (Idea / Knowledge) -->
  <g transform="translate(200, 100)">
    <!-- Bulb outline -->
    <path d="M50 0 C22 0 0 22 0 50 C0 68 10 83 25 93 L25 110 C25 115 29 120 34 120 L66 120 C71 120 75 115 75 110 L75 93 C90 83 100 68 100 50 C100 22 78 0 50 0 Z" fill="#2d3436" stroke="#00cec9" stroke-width="3"/>
    <!-- Filament glow -->
    <circle cx="50" cy="50" r="22" fill="#ffeaa7" opacity="0.9"/>
    <path d="M40 50 L45 35 L55 35 L60 50" stroke="#d63031" stroke-width="2.5" fill="none"/>
    <rect x="35" y="125" width="30" height="8" rx="4" fill="#00cec9"/>
    <!-- Glow rays -->
    <line x1="50" y1="-15" x2="50" y2="-5" stroke="#ffeaa7" stroke-width="3" stroke-linecap="round"/>
    <line x1="95" y1="15" x2="88" y2="22" stroke="#ffeaa7" stroke-width="3" stroke-linecap="round"/>
    <line x1="115" y1="50" x2="105" y2="50" stroke="#ffeaa7" stroke-width="3" stroke-linecap="round"/>
    <line x1="5" y1="15" x2="12" y2="22" stroke="#ffeaa7" stroke-width="3" stroke-linecap="round"/>
    <line x1="-15" y1="50" x2="-5" y2="50" stroke="#ffeaa7" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Floating Learning Modules / Badges -->
  <!-- Module 1: Code / Dev -->
  <g transform="translate(70, 180)">
    <rect width="110" height="55" rx="12" fill="#1e272e" stroke="#00d2d3" stroke-width="1.5"/>
    <circle cx="25" cy="27" r="14" fill="#00d2d3" opacity="0.2"/>
    <text x="25" y="32" font-family="monospace" font-size="12" font-weight="bold" fill="#00d2d3" text-anchor="middle">&lt;/&gt;</text>
    <text x="48" y="25" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Kreatif</text>
    <text x="48" y="38" font-family="sans-serif" font-size="9" fill="#81ecec">Web & Code</text>
  </g>

  <!-- Module 2: Design & Media -->
  <g transform="translate(320, 180)">
    <rect width="115" height="55" rx="12" fill="#1e272e" stroke="#a29bfe" stroke-width="1.5"/>
    <circle cx="25" cy="27" r="14" fill="#a29bfe" opacity="0.2"/>
    <circle cx="25" cy="27" r="6" fill="#a29bfe"/>
    <text x="48" y="25" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Literasi</text>
    <text x="48" y="38" font-family="sans-serif" font-size="9" fill="#dfe6e9">Desain & Media</text>
  </g>

  <!-- Module 3: Komunitas & Edukasi Lokal -->
  <g transform="translate(160, 260)">
    <rect width="180" height="48" rx="10" fill="#2d3436" stroke="#fdcb6e" stroke-width="1.5"/>
    <circle cx="25" cy="24" r="12" fill="#fdcb6e" opacity="0.3"/>
    <polygon points="25,18 31,27 19,27" fill="#fdcb6e"/>
    <text x="45" y="22" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Komunitas Lokal</text>
    <text x="45" y="35" font-family="sans-serif" font-size="9" fill="#ffeaa7">Kolaborasi & Praktik</text>
  </g>

  <!-- Floating interactive data points -->
  <circle cx="130" cy="120" r="4" fill="#00cec9"/>
  <circle cx="370" cy="120" r="4" fill="#a29bfe"/>
  <circle cx="250" cy="40" r="5" fill="#ffeaa7"/>
  <line x1="130" y1="120" x2="200" y2="140" stroke="#00cec9" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="370" y1="120" x2="300" y2="140" stroke="#a29bfe" stroke-width="1" stroke-dasharray="2,2"/>
</svg>
