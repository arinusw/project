<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="eduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9e80ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a31f4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="250" cy="250" r="170" fill="#7c5dfa" opacity="0.1" />

  <!-- Open Book Base -->
  <path d="M 120 300 Q 250 270 380 300 L 380 200 Q 250 170 120 200 Z" fill="url(#eduGrad)" />
  <path d="M 120 200 Q 250 170 380 200 L 380 210 Q 250 180 120 210 Z" fill="#ffffff" opacity="0.4" />

  <!-- Book Spine Center -->
  <line x1="250" y1="180" x2="250" y2="285" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <!-- Graduation Cap Floating Above -->
  <polygon points="250,90 350,130 250,170 150,130" fill="#1e1e2d" stroke="#7c5dfa" stroke-width="3"/>
  <rect x="200" y="145" width="100" height="30" rx="5" fill="#2a2a3d"/>

  <!-- Tassel -->
  <path d="M 320 135 L 340 170 L 335 200" fill="none" stroke="#ffbd2e" stroke-width="3"/>
  <circle cx="335" cy="202" r="5" fill="#ffbd2e"/>

  <!-- Lightbulbs / Sparkles for Technology Education -->
  <circle cx="150" cy="110" r="6" fill="#ffbd2e"/>
  <circle cx="350" cy="90" r="8" fill="#7c5dfa"/>
  <circle cx="380" cy="260" r="10" fill="#27c93f" opacity="0.8"/>
  <circle cx="110" cy="250" r="7" fill="#ff5f56" opacity="0.8"/>
</svg>
