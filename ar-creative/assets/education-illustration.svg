<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="eduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="eduPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="eduShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0284c7" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect x="40" y="50" width="420" height="300" rx="36" fill="url(#eduGrad)"/>

  <!-- Open Digital Book / Knowledge Portal -->
  <g transform="translate(130, 95)" filter="url(#eduShadow)">
    <rect width="240" height="170" rx="16" fill="#ffffff"/>

    <!-- Left page / code -->
    <rect x="20" y="25" width="90" height="8" rx="4" fill="#0284c7"/>
    <rect x="20" y="45" width="70" height="6" rx="3" fill="#94a3b8"/>
    <rect x="20" y="60" width="85" height="6" rx="3" fill="#94a3b8"/>
    <rect x="20" y="75" width="60" height="6" rx="3" fill="#94a3b8"/>
    <rect x="20" y="90" width="75" height="6" rx="3" fill="#94a3b8"/>
    <circle cx="35" cy="125" r="14" fill="#e0f2fe"/>
    <text x="30" y="130" font-family="monospace" font-size="14" font-weight="bold" fill="#0284c7">&lt;</text>

    <!-- Center spine divider -->
    <line x1="120" y1="20" x2="120" y2="150" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4"/>

    <!-- Right page / digital creativity -->
    <rect x="135" y="25" width="85" height="45" rx="8" fill="url(#eduPrimary)"/>
    <polygon points="175,37 185,55 165,55" fill="#ffffff" opacity="0.6"/>
    <circle cx="150" cy="45" r="6" fill="#38bdf8"/>
    <rect x="135" y="85" width="80" height="6" rx="3" fill="#94a3b8"/>
    <rect x="135" y="100" width="65" height="6" rx="3" fill="#94a3b8"/>
    <rect x="135" y="115" width="75" height="6" rx="3" fill="#94a3b8"/>
  </g>

  <!-- Floating Graduation cap / Idea lightbulb -->
  <g transform="translate(75, 120)" filter="url(#eduShadow)">
    <circle cx="35" cy="35" r="28" fill="#ffffff"/>
    <circle cx="35" cy="35" r="22" fill="#e0e7ff"/>
    <path d="M35 22 L47 28 L35 34 L23 28 Z" fill="#4f46e5"/>
    <path d="M28 32 L28 40 C28 43 42 43 42 40 L42 32" stroke="#4f46e5" stroke-width="2" fill="none"/>
  </g>

  <!-- Community / Local creativity node -->
  <g transform="translate(350, 220)" filter="url(#eduShadow)">
    <circle cx="35" cy="35" r="30" fill="#ffffff"/>
    <circle cx="35" cy="27" r="10" fill="#10b981"/>
    <path d="M20 50 C20 42 50 42 50 50 Z" fill="#10b981" opacity="0.8"/>
  </g>
</svg>
