<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B61FF"/>
      <stop offset="100%" stop-color="#2D124D"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7B9C"/>
      <stop offset="100%" stop-color="#FFBD2E"/>
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect x="50" y="50" width="400" height="400" rx="30" fill="url(#aboutGrad)" opacity="0.08" />
  <circle cx="250" cy="250" r="160" fill="none" stroke="#7B61FF" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Studio Gear / Lightbox Graphic -->
  <rect x="120" y="100" width="260" height="300" rx="20" fill="#1A1A26" stroke="#7B61FF" stroke-width="2" />

  <!-- Creative Layer Graphic elements -->
  <rect x="150" y="140" width="200" height="120" rx="12" fill="#252536" stroke="#00F2FE" stroke-width="1.5" />
  <path d="M170 230 L210 170 L250 210 L290 180 L330 230 Z" fill="#7B61FF" opacity="0.5" />
  <circle cx="290" cy="170" r="12" fill="#FFBD2E" opacity="0.9" />

  <!-- Layer Cards Stack (Symbolizing Solutions & Digital Products) -->
  <rect x="140" y="290" width="220" height="40" rx="10" fill="url(#accentGrad)" opacity="0.9" />
  <rect x="160" y="340" width="180" height="30" rx="8" fill="#7B61FF" opacity="0.7" />

  <!-- Floating Sparkles / Creativity Nodes -->
  <g stroke="#00F2FE" stroke-width="2" stroke-linecap="round">
    <line x1="80" y1="150" x2="80" y2="170" />
    <line x1="70" y1="160" x2="90" y2="160" />
  </g>
  <g stroke="#FF7B9C" stroke-width="2" stroke-linecap="round">
    <line x1="420" y1="320" x2="420" y2="340" />
    <line x1="410" y1="330" x2="430" y2="330" />
  </g>
</svg>
