<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e57e0"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadowAbout" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#6e57e0" flood-opacity="0.15"/>
    </filter>
  </defs>

  <circle cx="250" cy="200" r="150" fill="#f5f3ff" opacity="0.8"/>
  <circle cx="250" cy="200" r="120" fill="none" stroke="#ddd6fe" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Studio Creative Workspace Graphic -->
  <g filter="url(#shadowAbout)" transform="translate(120, 100)">
    <rect width="260" height="180" rx="16" fill="#ffffff"/>
    <!-- Laptop screen representation -->
    <rect x="20" y="20" width="220" height="120" rx="8" fill="#1e1b4b"/>
    <!-- Screen content -->
    <circle cx="130" cy="80" r="30" fill="url(#aboutGrad)"/>
    <path d="M 115 80 Q 130 60 145 80 T 160 80" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <rect x="35" y="35" width="40" height="6" rx="3" fill="#818cf8"/>
    <rect x="35" y="47" width="25" height="6" rx="3" fill="#6366f1"/>
    <!-- Base -->
    <path d="M 0 170 L 260 170 L 240 180 L 20 180 Z" fill="#c4b5fd"/>
  </g>

  <!-- Surrounding Badges -->
  <g filter="url(#shadowAbout)" transform="translate(80, 70)">
    <circle cx="30" cy="30" r="30" fill="#6e57e0"/>
    <path d="M 20 30 L 27 37 L 40 22" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g filter="url(#shadowAbout)" transform="translate(340, 240)">
    <rect width="80" height="50" rx="10" fill="#ffffff"/>
    <rect x="12" y="15" width="56" height="8" rx="4" fill="#6e57e0"/>
    <rect x="12" y="29" width="36" height="6" rx="3" fill="#c4b5fd"/>
  </g>
</svg>