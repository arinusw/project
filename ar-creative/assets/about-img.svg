<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#fd79a8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Shape -->
  <circle cx="250" cy="250" r="190" fill="#6C5CE7" opacity="0.1" />

  <!-- Main Digital Studio Frame -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="300" height="300" rx="24" fill="#1e1e2d"/>
    <rect x="120" y="120" width="260" height="260" rx="16" fill="#2b2b3d"/>
  </g>

  <!-- Digital Art & Solution Graphics -->
  <circle cx="250" cy="210" r="60" fill="url(#aboutGrad)"/>

  <!-- Lightbulb / Solution Icon -->
  <path d="M250,175 C230,175 215,190 215,210 C215,225 225,235 235,245 L265,245 C275,235 285,225 285,210 C285,190 270,175 250,175 Z" fill="#ffffff" opacity="0.9"/>
  <rect x="238" y="250" width="24" height="10" rx="2" fill="#ffffff" opacity="0.9"/>

  <!-- Network / Technology Nodes -->
  <circle cx="160" cy="310" r="18" fill="#00cec9"/>
  <line x1="175" y1="300" x2="210" y2="250" stroke="#00cec9" stroke-width="3" stroke-dasharray="4,4"/>

  <circle cx="340" cy="310" r="18" fill="#fd79a8"/>
  <line x1="325" y1="300" x2="290" y2="250" stroke="#fd79a8" stroke-width="3" stroke-dasharray="4,4"/>

  <!-- Text / Badge Overlay -->
  <rect x="150" y="330" width="200" height="36" rx="18" fill="#6C5CE7"/>
  <text x="250" y="353" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Ar Creative Studio</text>
</svg>