<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6e57e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a38b3;stop-opacity:1" />
    </linearGradient>
  </defs>

  <circle cx="250" cy="250" r="190" fill="#6e57e0" opacity="0.08" />

  <!-- Layered cards -->
  <rect x="110" y="110" width="280" height="280" rx="20" fill="#2d2b42" opacity="0.4" transform="rotate(-6 250 250)" />
  <rect x="110" y="110" width="280" height="280" rx="20" fill="#2d2b42" opacity="0.7" transform="rotate(3 250 250)" />
  <rect x="110" y="110" width="280" height="280" rx="20" fill="#1e1e24" stroke="#6e57e0" stroke-width="2" />

  <!-- Digital Studio Symbols -->
  <circle cx="250" cy="200" r="50" fill="url(#aboutGrad)" />
  <path d="M235 190 L265 190 L250 220 Z" fill="#ffffff" opacity="0.9" />

  <!-- Code / Design Lines -->
  <rect x="160" y="280" width="180" height="10" rx="5" fill="#6e57e0" />
  <rect x="180" y="305" width="140" height="8" rx="4" fill="#8f8ba6" opacity="0.7" />
  <rect x="200" y="325" width="100" height="8" rx="4" fill="#8f8ba6" opacity="0.4" />

  <!-- Orbiting Nodes -->
  <circle cx="130" cy="160" r="12" fill="#ff7300" />
  <circle cx="370" cy="320" r="16" fill="#6e57e0" />
</svg>
