  </defs>

  <!-- Background Glow -->
  <circle cx="250" cy="250" r="170" fill="url(#aboutGrad1)" opacity="0.12" />

  <!-- Center Layered Studio Emblem / Target / Core -->
  <g filter="url(#shadowAbout)">
    <rect x="130" y="110" width="240" height="280" rx="24" fill="#ffffff" opacity="0.95" />
  </g>

  <!-- Inner Illustration Content -->
  <!-- Creative Layers / Blocks -->
  <rect x="160" y="140" width="180" height="70" rx="14" fill="#6c5ce7" opacity="0.9" />
  <circle cx="195" cy="175" r="18" fill="#ffffff" opacity="0.3" />
  <rect x="225" y="163" width="90" height="10" rx="5" fill="#ffffff" />
  <rect x="225" y="179" width="60" height="8" rx="4" fill="#ffffff" opacity="0.7" />

  <rect x="160" y="225" width="180" height="70" rx="14" fill="#00cec9" opacity="0.85" />
  <path d="M 185 268 L 205 248 L 225 268" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="235" y="248" width="80" height="10" rx="5" fill="#ffffff" />
  <rect x="235" y="264" width="50" height="8" rx="4" fill="#ffffff" opacity="0.7" />

