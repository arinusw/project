<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#a29bfe"/>
    </linearGradient>
    <linearGradient id="aboutGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B894"/>
      <stop offset="100%" stop-color="#55E6C1"/>
    </linearGradient>
  </defs>

  <!-- Outer background circle -->
  <circle cx="250" cy="200" r="170" fill="url(#aboutGrad1)" opacity="0.1"/>

  <!-- Central Studio Workstation Illustration -->
  <!-- Layered cards / screens representing services & education -->
  <rect x="80" y="100" width="220" height="160" rx="16" fill="#FFFFFF" stroke="#6C5CE7" stroke-width="3"/>
  <rect x="95" y="115" width="190" height="15" rx="4" fill="#E2E8F0"/>
  <rect x="95" y="140" width="120" height="10" rx="3" fill="#A29BFE"/>
  <rect x="95" y="158" width="160" height="10" rx="3" fill="#CBD5E1"/>
  <rect x="95" y="176" width="90" height="10" rx="3" fill="#CBD5E1"/>

  <circle cx="120" cy="220" r="18" fill="#6C5CE7"/>
  <path d="M115 220 L125 220 M120 215 L120 225" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Overlapping Second Card (Education & Creative Output) -->
  <rect x="200" y="160" width="220" height="160" rx="16" fill="#1E1E2E" stroke="#00B894" stroke-width="3"/>
  <!-- Code & Design icons inside second card -->
  <rect x="220" y="180" width="180" height="20" rx="6" fill="#2A2A3C"/>
  <circle cx="235" cy="190" r="4" fill="#FF7675"/>
  <circle cx="247" cy="190" r="4" fill="#FDCB6E"/>
  <circle cx="259" cy="190" r="4" fill="#55E6C1"/>

  <text x="220" y="230" font-family="sans-serif" font-size="14" fill="#55E6C1" font-weight="bold">Inovasi &amp; Solusi</text>
  <rect x="220" y="245" width="140" height="8" rx="4" fill="#A29BFE"/>
  <rect x="220" y="260" width="110" height="8" rx="4" fill="#6C5CE7"/>

  <!-- Floating Badge: Technology -->
  <g transform="translate(340, 70)">
    <circle cx="35" cy="35" r="35" fill="url(#aboutGrad2)"/>
    <path d="M25 35 L32 42 L45 28" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Decorative floating geometric shapes -->
  <circle cx="90" cy="70" r="10" fill="#FDCB6E"/>
  <rect x="410" y="300" width="20" height="20" rx="5" fill="#6C5CE7" transform="rotate(20 420 310)"/>
</svg>
