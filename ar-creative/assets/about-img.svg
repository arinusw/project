<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6C63FF" />
    </linearGradient>
    <filter id="shadowAbout" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background shapes -->
  <rect x="60" y="60" width="380" height="380" rx="40" fill="url(#aboutGrad)" opacity="0.05" />
  <circle cx="250" cy="250" r="150" fill="#6C63FF" opacity="0.08" />

  <!-- Central Lightbulb & Digital Gear Symbolizing Creative Tech -->
  <g filter="url(#shadowAbout)">
    <!-- Shield / Card Backdrop -->
    <rect x="120" y="100" width="260" height="300" rx="20" fill="#2F2E41" />
    <rect x="130" y="110" width="240" height="280" rx="16" fill="#1E1E2E" />
  </g>

  <!-- Gear Wheel -->
  <circle cx="250" cy="220" r="60" fill="none" stroke="#8B5CF6" stroke-width="12" stroke-dasharray="25 10" />
  <circle cx="250" cy="220" r="35" fill="#2F2E41" />

  <!-- Idea Lightbulb in Center -->
  <path d="M 235 210 C 235 195, 265 195, 265 210 C 265 220, 258 225, 258 232 L 242 232 C 242 225, 235 220, 235 210 Z" fill="#F59E0B" />
  <rect x="243" y="235" width="14" height="6" rx="2" fill="#D97706" />

  <!-- Tech Code & Creativity Lines -->
  <rect x="160" y="310" width="180" height="10" rx="5" fill="#6C63FF" />
  <rect x="180" y="330" width="140" height="8" rx="4" fill="#A78BFA" opacity="0.8" />
  <rect x="200" y="348" width="100" height="8" rx="4" fill="#EC4899" opacity="0.8" />

  <!-- Floating Digital Badges -->
  <g filter="url(#shadowAbout)">
    <circle cx="120" cy="180" r="30" fill="#6C63FF" />
    <path d="M 110 180 L 118 188 L 132 172" stroke="#FFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <g filter="url(#shadowAbout)">
    <circle cx="380" cy="300" r="32" fill="#EC4899" />
    <text x="380" y="307" font-family="sans-serif" font-weight="bold" font-size="20" fill="#FFF" text-anchor="middle">&lt;/&gt;</text>
  </g>
</svg>
