<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <filter id="shadowAbout" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3B82F6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect x="50" y="50" width="400" height="400" rx="200" fill="url(#aboutGrad)" opacity="0.08" />

  <!-- Central Work Station Concept -->
  <rect x="90" y="110" width="320" height="220" rx="16" fill="#FFFFFF" filter="url(#shadowAbout)"/>

  <!-- Creative Dashboard Layout -->
  <rect x="110" y="130" width="80" height="180" rx="8" fill="#F3F4F6"/>
  <rect x="120" y="145" width="60" height="12" rx="4" fill="#7C3AED"/>
  <rect x="120" y="170" width="60" height="8" rx="4" fill="#E5E7EB"/>
  <rect x="120" y="188" width="60" height="8" rx="4" fill="#E5E7EB"/>
  <rect x="120" y="206" width="60" height="8" rx="4" fill="#E5E7EB"/>

  <!-- Main Art Canvas -->
  <rect x="205" y="130" width="185" height="120" rx="8" fill="url(#aboutGrad)"/>
  <circle cx="297" cy="190" r="35" fill="#FFFFFF" opacity="0.25"/>
  <path d="M 230 230 L 270 180 L 300 210 L 330 170 L 370 230 Z" fill="#FFFFFF" opacity="0.9"/>

  <!-- Analytics / Progress Cards Floating -->
  <g transform="translate(205, 260)">
    <rect x="0" y="0" width="85" height="50" rx="8" fill="#10B981" opacity="0.9"/>
    <text x="12" y="22" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">Kreativitas</text>
    <text x="12" y="38" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">100%</text>
  </g>

  <g transform="translate(305, 260)">
    <rect x="0" y="0" width="85" height="50" rx="8" fill="#7C3AED" opacity="0.9"/>
    <text x="12" y="22" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">Solusi</text>
    <text x="12" y="38" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Digital</text>
  </g>

  <!-- Digital Pen / Stylus -->
  <g transform="translate(350, 310) rotate(-35)">
    <rect x="0" y="0" width="18" height="120" rx="9" fill="#1F2937"/>
    <polygon points="0,120 18,120 9,140" fill="#7C3AED"/>
  </g>
</svg>
