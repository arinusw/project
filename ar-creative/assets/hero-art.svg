<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFC" />
      <stop offset="100%" stop-color="#9A7BFF" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B3BE8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2A38" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1E1E28" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Ambient Glow Shapes -->
  <circle cx="250" cy="220" r="160" fill="url(#primaryGrad)" opacity="0.12" filter="url(#glow)"/>
  <circle cx="360" cy="140" r="90" fill="url(#accentGrad)" opacity="0.15" filter="url(#glow)"/>

  <!-- Geometric Abstract Creative Elements -->
  <rect x="80" y="70" width="340" height="230" rx="16" fill="#181824" stroke="#7C5CFC" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Browser / Workspace Header bar -->
  <rect x="80" y="70" width="340" height="34" rx="16" fill="#202030"/>
  <rect x="80" y="88" width="340" height="16" fill="#202030"/>
  <circle cx="102" cy="87" r="5" fill="#EF4444"/>
  <circle cx="118" cy="87" r="5" fill="#F59E0B"/>
  <circle cx="134" cy="87" r="5" fill="#10B981"/>
  <rect x="160" y="80" width="160" height="14" rx="7" fill="#2C2C3E"/>

  <!-- Code / Design Canvas Interior -->
  <rect x="105" y="125" width="130" height="85" rx="8" fill="url(#primaryGrad)" fill-opacity="0.2"/>
  <rect x="115" y="140" width="80" height="10" rx="4" fill="#7C5CFC"/>
  <rect x="115" y="160" width="100" height="8" rx="4" fill="#A78BFA" opacity="0.8"/>
  <rect x="115" y="176" width="60" height="8" rx="4" fill="#A78BFA" opacity="0.5"/>

  <!-- Creative Chart / Graph element -->
  <path d="M 260 190 L 290 155 L 320 170 L 360 130 L 390 145" fill="none" stroke="#34D399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="260" cy="190" r="4" fill="#34D399"/>
  <circle cx="290" cy="155" r="4" fill="#34D399"/>
  <circle cx="320" cy="170" r="4" fill="#34D399"/>
  <circle cx="360" cy="130" r="4" fill="#34D399"/>
  <circle cx="390" cy="145" r="4" fill="#34D399"/>

  <rect x="105" y="230" width="285" height="10" rx="5" fill="#2C2C40"/>
  <rect x="105" y="250" width="190" height="10" rx="5" fill="#2C2C40"/>
  <rect x="105" y="270" width="230" height="10" rx="5" fill="#2C2C40"/>

  <!-- Floating Digital Art Elements -->
  <!-- Creative Palette Card -->
  <g transform="translate(45, 190)">
    <rect width="110" height="110" rx="16" fill="#1C1B29" stroke="#7C5CFC" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="35" cy="40" r="14" fill="#7C5CFC"/>
    <circle cx="70" cy="40" r="14" fill="#38BDF8"/>
    <circle cx="35" cy="75" r="14" fill="#F43F5E"/>
    <circle cx="70" cy="75" r="14" fill="#10B981"/>
  </g>

  <!-- Digital Technology / Growth Card -->
  <g transform="translate(330, 210)">
    <rect width="130" height="120" rx="16" fill="#1C1B29" stroke="#34D399" stroke-width="1.5" filter="url(#glow)"/>
    <!-- Binary / Tech Icon inside -->
    <rect x="20" y="25" width="40" height="40" rx="8" fill="#34D399" fill-opacity="0.2"/>
    <path d="M 33 45 L 40 52 L 52 38" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="20" y="75" width="85" height="8" rx="4" fill="#F1F5F9" opacity="0.9"/>
    <rect x="20" y="90" width="60" height="8" rx="4" fill="#94A3B8" opacity="0.6"/>
  </g>

  <!-- Central Modern Studio Symbol -->
  <g transform="translate(210, 270)">
    <circle cx="40" cy="40" r="42" fill="url(#primaryGrad)"/>
    <!-- Stylized Ar Creative monogram symbol -->
    <path d="M 28 55 L 40 25 L 52 55 M 33 46 L 47 46" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sparkling / Digital sparks -->
  <polygon points="120,45 124,55 134,59 124,63 120,73 116,63 106,59 116,55" fill="#F59E0B" />
  <polygon points="390,70 393,77 400,80 393,83 390,90 387,83 380,80 387,77" fill="#7C5CFC" />
  <polygon points="70,330 73,337 80,340 73,343 70,350 67,343 60,340 67,337" fill="#38BDF8" />
  <polygon points="420,360 423,366 430,369 423,372 420,378 417,372 410,369 417,366" fill="#F43F5E" />
</svg>
